function computeTargets(weight, goalToggles) {
  const weightLoss = goalToggles.find(g => g.id === "weightloss")?.active;
  const muscle = goalToggles.find(g => g.id === "muscle")?.active;
  const maintenance = Math.round(weight * 29);

function metricStatus(value, m) {
  if (value == null) return "untested";
  if (m.low != null && value < m.low) return value < m.low * 0.85 ? "bad" : "watch";
  if (m.high != null && value > m.high) return value > m.high * 1.15 ? "bad" : "watch";
  if (m.idealLow != null && value < m.idealLow) return "watch";
  if (m.idealHigh != null && value > m.idealHigh) return "watch";
  return "good";
}
function rangeLabel(m) { if (m.low != null && m.high != null) return `${m.low}–${m.high}`; if (m.high != null) return `< ${m.high}`; if (m.low != null) return `> ${m.low}`; return "—"; }
function computeTopPriorities(metrics, periods) {
  const latestIdx = periods.length - 1;
  const withStatus = metrics.map(m => { const value = m.points[latestIdx]; return { key: m.key, label: m.label, value, unit: m.unit, status: metricStatus(value, m), target: rangeLabel(m) }; }).filter(m => m.status === "bad" || m.status === "watch");
  withStatus.sort((a, b) => (a.status === "bad" ? 0 : 1) - (b.status === "bad" ? 0 : 1));
  return withStatus.slice(0, 3);
}

function joinNames(arr) {
  if (!arr || !arr.length) return "";
  if (arr.length === 1) return arr[0];
  return arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
}
// All flagged (bad/watch) marker keys from the latest report, worst first.
function flaggedMarkerKeys(metrics, periods) {
  const latestIdx = periods.length - 1;
  return metrics
    .map(m => ({ key: m.key, status: metricStatus(m.points[latestIdx], m) }))
    .filter(m => m.status === "bad" || m.status === "watch")
    .sort((a, b) => (a.status === "bad" ? 0 : 1) - (b.status === "bad" ? 0 : 1))
    .map(m => m.key);
}
function computeAvoidList(metrics, periods) {
  const keys = flaggedMarkerKeys(metrics, periods);
  const seen = new Set(); const out = [];
  keys.forEach(k => (MARKER_INFO[k]?.avoid || []).forEach(a => { const id = a.item.toLowerCase(); if (!seen.has(id)) { seen.add(id); out.push(a); } }));
  return out.length ? out : GENERAL_AVOID;
}
function computeEatMore(metrics, periods) {
  const keys = flaggedMarkerKeys(metrics, periods);
  const seen = new Set(); const out = [];
  keys.forEach(k => (MARKER_INFO[k]?.eatMore || []).forEach(e => { const id = e.toLowerCase(); if (!seen.has(id)) { seen.add(id); out.push(e); } }));
  return out.length ? out : GENERAL_EATMORE;
}
function computeDailyFocus(metrics, periods) {
  const keys = flaggedMarkerKeys(metrics, periods);
  if (!keys.length) return GENERAL_FOCUS;
  const out = keys.map(k => MARKER_INFO[k]).filter(i => i && i.focus).map(i => ({ marker: (i.short || "").toUpperCase(), tip: i.focus }));
  out.push({ marker: "ACTIVITY", tip: "A 30-minute brisk walk is your single most effective all-round lever." });
  return out;
}
function computeTestNext(metrics, periods) {
  const latestIdx = periods.length - 1;
  const out = [];
  metrics.forEach(m => {
    const latest = m.points[latestIdx];
    const everTested = m.points.some(v => v != null);
    const status = metricStatus(latest, m);
    if (!everTested) out.push(`${m.label} — no reading on record yet, get a baseline.`);
    else if (latest == null) out.push(`${m.label} — missing from your latest report, retest it.`);
    else if (status === "bad" || status === "watch") out.push(`Recheck ${m.label} in 6–8 weeks — currently ${status === "bad" ? "out of range" : "borderline"}.`);
  });
  return out.length ? out : ["Everything tracked is in range — a routine annual check-up is enough."];
}
// The single object every tab reads its personalized advice from. Pure function of the entered
// data — swap in another person's profile/report/supplements and all of this changes.
function computeAdvice(metrics, periods, supplements, goalToggles) {
  const flaggedKeys = flaggedMarkerKeys(metrics, periods);
  const sugarKey = flaggedKeys.find(k => MARKER_INFO[k]?.drivers?.sugar != null);
  const cardioKeys = flaggedKeys.filter(k => k === "hdl" || k === "tg");
  const critNames = supplements.filter(s => s.critical).map(s => s.name.replace(/\s*\(.*?\)/, "").trim());
  return {
    flaggedKeys,
    avoidList: computeAvoidList(metrics, periods),
    eatMore: computeEatMore(metrics, periods),
    dailyFocus: computeDailyFocus(metrics, periods),
    testNext: computeTestNext(metrics, periods),
    criticalSuppNames: critNames.length ? joinNames(critNames) : "your key supplements",
    sugarMarkerLabel: sugarKey ? MARKER_INFO[sugarKey].short : null,
    cardioMarkerLabel: cardioKeys.length ? joinNames([...new Set(cardioKeys.map(k => MARKER_INFO[k].short))]) : "your heart & metabolic markers",
    focusMarkerLabel: flaggedKeys.length ? (MARKER_INFO[flaggedKeys[0]]?.short || null) : null,
    weightGoal: !!(goalToggles || []).find(g => g.id === "weightloss" && g.active),
  };
}

// same 3 suggestions per meal show all day but change tomorrow — pulled from her real meal

function todaysMealIdeas() {
  const dayIdx = Math.floor(Date.now() / 86400000);
  function pick(pool, offset, count) {
    const picks = [];
    for (let i = 0; i < count; i++) picks.push(pool[(dayIdx + offset + i * 7) % pool.length]);
    return picks;
  }
  return {
    breakfast: pick(MEAL_POOL.breakfast, 0, 3),
    lunch: pick(MEAL_POOL.lunch, 3, 3),
    dinner: pick(MEAL_POOL.dinner, 6, 3),
  };
}

// Deterministic pseudo-random in [0,1) from a numeric seed — used so the seeded history
// is stable across reloads and regenerations (never Math.random, which would reshuffle).
function seededRand(seed) { const x = Math.sin(seed * 999.13 + 7.7) * 43758.5453; return x - Math.floor(x); }

// Rough default macros per meal slot, used when a Weekly-Menu entry is a compound
// description that doesn't map to a single FOOD_DB dish — this keeps the food charts and
// insights populated with real numbers instead of blanks. A small deterministic jitter
// (per day) gives day-to-day variation so the trends aren't perfectly flat.
const SLOT_DEFAULTS = {
  Breakfast: { calories: 300, protein: 11, fiber: 4, carbs: 42, sugar: 6 },
  Lunch:     { calories: 480, protein: 15, fiber: 6, carbs: 66, sugar: 8 },
  Dinner:    { calories: 430, protein: 12, fiber: 5, carbs: 58, sugar: 9 },
};
const SAFE_WORDS = ["oats", "idli", "chilla", "dhokla", "khaman", "salad", "dal", "daal", "khichdi", "sabji", "shak", "upma", "poha", "curd", "chhash", "handvo", "sambhar", "mung", "moong", "rajma", "chana", "chhole", "chole", "brocolli", "broccoli", "uttapam", "bajra", "jowar", "brown rice"];
const HEAVY_WORDS = ["fried", " fry", "vada", "bhajiya", "puri", "pakora", "samosa", "kachori", "pizza", "pasta", "pav", "cheese", "cream", "sandwich", "dabeli", "misal", "biryani", "schezwan", "chinese", "noodles", "manchurian", "wafer", "chilly fry", "sabudana", "cutlet", "quesadilla", "tikki", "chaat", "chat -", "panipuri", "bhel", "sevpuri"];
function demoVerdictFor(dishText) {
  const n = dishText.toLowerCase();
  if (/pizza|samosa|vada pav|manchurian|kachori|dabeli/.test(n)) return "avoid";
  if (HEAVY_WORDS.some(w => n.includes(w))) return "limit";
  if (SAFE_WORDS.some(w => n.includes(w))) return "safe";
  return "moderate";
}

// Matches a Weekly-Menu text entry against FOOD_DB first; if it's a compound description
// that can't be mapped to one dish, falls back to slot-based default macros + a keyword
// verdict (so every seeded meal still carries calories/protein/sugar). Kept synchronous —
// no API calls during bulk history generation. Always tagged demo:true.
function classifyDemoMeal(dishText, slot, dayIdx) {
  if (!dishText) return null;
  const key = normalizeWithAliases(dishText);
  for (const [k, entry] of Object.entries(FOOD_DB)) {
    const nk = normalizeWithAliases(k);
    if (key.includes(nk) || nk.includes(key)) {
      return { dish: dishText, calories: entry.calories, protein: entry.protein, fiber: entry.fiber, carbs: entry.carbs, sugar: entry.sugar, verdict: entry.verdict, demo: true };
    }
  }
  const base = SLOT_DEFAULTS[slot] || SLOT_DEFAULTS.Lunch;
  const scale = 0.85 + seededRand((dayIdx + 1) * (slot ? slot.length : 5)) * 0.3; // 0.85–1.15
  const verdict = demoVerdictFor(dishText);
  const sugarBoost = verdict === "avoid" ? 10 : verdict === "limit" ? 5 : 0;
  return {
    dish: dishText,
    calories: Math.round(base.calories * scale), protein: Math.round(base.protein * scale),
    fiber: Math.round(base.fiber * scale), carbs: Math.round(base.carbs * scale),
    sugar: Math.round(base.sugar * scale) + sugarBoost, verdict, demo: true,
  };
}

// Generates real-looking history from Jul 1, 2026 through `endKey` (default: today), using
// her real Weekly-Menu rotation (WEEKLY_MENU_LOG, digested from the Menu25 "Weekly menu"
// sheet) for food, plus the specified activity/supplement pattern:
//   • Jul 18–28: a brisk walk every day (8k–20k steps) + 20-min yoga on some days, no gym,
//     and every supplement taken EXCEPT Turmeric+Piperine, Silymarin and Zinc.
//   • Every other week: about half the days a 30-min walk, the rest no activity (no gym,
//     nothing else), and supplements taken less consistently.
//   • Sundays are rest days (no walk).
// Pure function — returns data, doesn't touch storage — so it's easy to review and easy to
// wipe via the existing "Clear all history" / "Clear a specific date" controls.
function generateHistory(endKey) {
  const foodByDate = {}, activitiesByDate = {}, habitsByDate = {}, supplementsByDate = {};
  const start = new Date(2026, 6, 1);            // Jul 1, 2026
  const end = endKey ? new Date(endKey + "T00:00:00") : new Date();
  const highStart = new Date(2026, 6, 18), highEnd = new Date(2026, 6, 28); // Jul 18–28

  let i = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1), i++) {
    const dk = ymd(d);
    const dow = d.getDay(); // 0 = Sunday
    const inHigh = d >= highStart && d <= highEnd;
    const menuDay = WEEKLY_MENU_LOG[i % WEEKLY_MENU_LOG.length];

    // ---- Food (from her real weekly-menu rotation) ----
    const entries = [];
    [["b", "Breakfast"], ["l", "Lunch"], ["d", "Dinner"]].forEach(([mk, slot]) => {
      const classified = classifyDemoMeal(menuDay[mk], slot, i);
      if (classified) entries.push({ ...classified, mealSlot: slot, time: d.getTime() });
    });
    if (entries.length) foodByDate[dk] = entries;

    // ---- Activity + habits ----
    const acts = [];
    const habits = {};
    if (dow === 0) {
      habits.walk = false; // Sunday rest day
    } else if (inHigh) {
      const steps = 8000 + Math.floor(seededRand(i * 3.1) * 12000); // 8k–20k
      acts.push({ type: "Walk", duration: Math.round(steps / 130), time: d.getTime(), demo: true, note: `~${steps.toLocaleString()} steps` });
      if (seededRand(i * 5.7) < 0.45) acts.push({ type: "Yoga", duration: 20, time: d.getTime(), demo: true });
      habits.walk = true; habits.noAlcohol = true; habits.water = true;
      habits.noFried = seededRand(i * 2.3) < 0.7; habits.noSugar = seededRand(i * 4.9) < 0.6;
    } else {
      if (seededRand(i * 6.3) < 0.5) { acts.push({ type: "Walk", duration: 30, time: d.getTime(), demo: true }); habits.walk = true; }
      else habits.walk = false;
      habits.noAlcohol = seededRand(i * 1.7) < 0.7; habits.water = seededRand(i * 3.9) < 0.6;
      habits.noFried = seededRand(i * 2.1) < 0.5; habits.noSugar = seededRand(i * 5.3) < 0.45;
    }
    if (acts.length) activitiesByDate[dk] = acts;
    habitsByDate[dk] = habits;

    // ---- Supplements (no demo flag inside — the object is counted for adherence) ----
    const supp = {};
    SUPPLEMENTS_SEED.forEach((s, si) => {
      if (s.time === "weekly") { supp[s.id] = dow === 1; return; }       // weekly D3 → Mondays
      if (inHigh) supp[s.id] = !HIGH_WINDOW_SKIP.includes(s.id);
      else supp[s.id] = seededRand(i * 10 + si) < (CRITICAL_SUPP_IDS.includes(s.id) ? 0.65 : 0.3);
    });
    supplementsByDate[dk] = supp;
  }
  return { foodByDate, activitiesByDate, habitsByDate, supplementsByDate };
}

function localAnswer(question, customDishes) {
  const q = question.toLowerCase();
  for (const entry of FAQ_DB) {
    if (entry.keywords.some(k => q.includes(k))) return entry.answer;
  }
  for (const [dish, info] of Object.entries(FOOD_DB)) {
    if (q.includes(dish)) {
      const meta = verdictMetaMap()[info.verdict] || verdictMetaMap().moderate;
      const tip = info.healthierTip || suggestSwap(dish);
      return `${meta.emoji} ${meta.label} — ${info.reason} Portion: ${info.portion}.${tip ? " " + tip : ""}`;
    }
  }
  if (customDishes) {
    for (const [dish, info] of Object.entries(customDishes)) {
      if (q.includes(dish)) {
        const meta = verdictMetaMap()[info.verdict] || verdictMetaMap().moderate;
        return `${meta.emoji} ${meta.label} — from your saved dishes. ${info.reason}${info.healthierTip ? " " + info.healthierTip : ""}`;
      }
    }
  }
  return null;
}

// Deterministic verdict from macros — rules-based on current priorities, not an AI
// judgment. Used for dishes looked up via the free nutrition API or pasted text.
function classifyMacros(dishName, macros) {
  const name = dishName.toLowerCase();
  const notFriedOverride = /\bair.?(fry|fri)|baked|steamed|grilled|boiled|roasted(?! peanuts)/.test(name);
  const friedWords = ["fried", " fry", "vada", "bhajiya", "puri", "pakora", "chips", "samosa", "kachori", "bhatura"];
  const isFried = !notFriedOverride && friedWords.some(k => name.includes(k));
  const sugar = macros.sugar || 0, fat = macros.fat || 0, carbs = macros.carbs || 0;
  if (isFried || sugar >= 15) return "avoid";
  if (sugar >= 8 || fat >= 18 || carbs >= 55) return "limit";
  if (sugar >= 4 || fat >= 10 || carbs >= 35) return "moderate";
  return "safe";
}

// Detects improving modifiers in a dish name — "air fried", "sugar free", "brown rice",
// "less oil", "with ghee", "extra vegetables" etc — and upgrades a base verdict
// accordingly. Applied on top of both curated-DB matches and freshly looked-up dishes,
// so "air fried veg cutlet" or "sugar free besan laddoo" get credit for the swap
// already made, instead of being flagged the same as the unmodified dish.
const VERDICT_ORDER = ["avoid", "limit", "moderate", "safe"];
const IMPROVING_MODIFIERS = [
  { match: ["brown bread", "brown rice", "whole wheat", "whole grain", "wholegrain", "multigrain", "jowar", "bajra", "ragi", "millet", "oats aata", "mix aata", "atta"], note: "whole grain / millet base instead of refined flour" },
  { match: ["air fried", "air-fried", "air fry", "air fryer", "baked", "steamed", "grilled", "boiled"], note: "not deep-fried" },
  { match: ["sugar free", "sugar-free", "no sugar", "jaggery-free", "date sweetened", "date-sweetened", "stevia"], note: "reduced or no added sugar" },
  { match: ["less oil", "low oil", "minimal oil", "no oil"], note: "less oil than usual" },
  { match: ["with ghee"], note: "ghee instead of butter or refined oil" },
  { match: ["extra vegetables", "more vegetables", "loaded with veg", "broccoli", "beetroot", "capsicum", "added vegetables"], note: "extra vegetables added" },
];
function detectModifiers(dishName) {
  const name = dishName.toLowerCase();
  const notes = [];
  for (const m of IMPROVING_MODIFIERS) {
    if (m.match.some(k => name.includes(k))) notes.push(m.note);
  }
  return notes;
}
function applyModifierUpgrade(baseVerdict, dishName) {
  const notes = detectModifiers(dishName);
  if (notes.length === 0) return { verdict: baseVerdict, notes: [] };
  // cap the upgrade at 2 tiers regardless of how many modifiers match, so e.g.
  // "air fried sugar free jalebi" doesn't get waved through as fully "safe"
  const steps = Math.min(2, notes.length);
  const normalizedBase = baseVerdict === "caution" ? "moderate" : baseVerdict; // "caution" and "moderate" render identically but only "moderate" is in VERDICT_ORDER
  const baseIdx = VERDICT_ORDER.indexOf(normalizedBase);
  const idx = Math.min(VERDICT_ORDER.length - 1, (baseIdx === -1 ? 0 : baseIdx) + steps);
  return { verdict: VERDICT_ORDER[idx], notes };
}
// Strips recognized modifier phrases from a query so the *base dish* can still be
// matched against the curated list/corpus even when modifiers are typed inline
// (e.g. "air fried vada pav" -> matches "vada pav", then the verdict is upgraded).
function stripModifiers(dishName) {
  let name = dishName;
  for (const m of IMPROVING_MODIFIERS) {
    for (const k of m.match) {
      name = name.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), "");
    }
  }
  // clean up leftover connector words the modifier phrases leave behind
  // (e.g. "aloo paratha with jowar atta" -> after removing "jowar"/"atta" -> "aloo paratha with")
  name = name.replace(/\b(with|using|made|instead of|and|no)\b/gi, "");
  return name.replace(/\s+/g, " ").trim() || dishName;
}

// Given the CURRENT top-priority markers (from the latest report — updates automatically
// if the report changes) and a dish's macro profile, generates good/bad tags. Approximate
// and rules-based on purpose — not a clinical claim, just a rough macro-level signal.
function computeDynamicTags(macros, priorities) {
  const tags = [];
  const sugar = macros.sugar, fat = macros.fat;
  for (const p of priorities || []) {
    const drivers = MARKER_INFO[p.key]?.drivers;
    if (!drivers) continue;
    let verdict = null;
    if (drivers.sugar != null && sugar != null) { if (sugar >= drivers.sugar) verdict = "bad"; else if (sugar <= 3) verdict = "good"; }
    if (verdict == null && drivers.fat != null && fat != null) { if (fat >= drivers.fat) verdict = "bad"; else if (fat <= 5) verdict = "good"; }
    if (verdict) tags.push({ label: p.label, verdict });
  }
  return tags;
}

const STAPLE_SWAPS = [

  { match: ["fried", "vada", "bhajiya", "pakora", "samosa", "kachori", "manchurian", "nachos", "spring roll"], exclude: ["air-fried", "air fried", "baked", "steamed"], tip: "Air-frying, baking, or a steamed version instead of deep-frying keeps the GGT/TG hit much lower." },

  { match: ["noodles", "chow mein", "hakka"], exclude: ["whole wheat noodles", "millet noodles"], tip: "Whole wheat or millet noodles with extra vegetables and less oil is a lighter version of the same dish." },

function suggestSwap(dishName) {
  const name = dishName.toLowerCase();
  for (const rule of STAPLE_SWAPS) {
    if (rule.match.some(k => name.includes(k)) && !rule.exclude.some(k => name.includes(k))) return rule.tip;
  }
  return null;
}

// Free nutrition lookup via your own backend proxy (calls a free-tier nutrition API,
// never Anthropic). Returns null on any failure so the caller can fall back gracefully.
async function lookupNutrition(dish) {
  try {
    const res = await fetch("/api/nutrition", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dish }),
    });
    const data = await res.json();
    if (!res.ok || data.error) return null;
    return data;
  } catch {
    return null;
  }
}

/* ============================== FUZZY DISH MATCHING ============================== */
// Loads once at startup — a ~6,700-name vegetarian dish corpus (dishes.json, built from
// the Vegetarian Dish Database) used as a spelling/typo dictionary AND to recognize dishes
// beyond the curated FOOD_DB. Shape: { cuisines:[...], dishes:[[name, cuisineIdx], ...] }.
// The database's own 1–5 ratings are templated (nearly every dish scores ~4/safe), so they
// are deliberately NOT used for verdicts — verdicts come from the app's own keyword rules.
let DISH_CORPUS = null;
async function loadDishCorpus() {
  if (DISH_CORPUS) return DISH_CORPUS;
  try {
    const res = await fetch("dishes.json");
    DISH_CORPUS = await res.json();
  } catch {
    DISH_CORPUS = { cuisines: [], dishes: [] };
  }
  return DISH_CORPUS;
}

// 1,479-dish rating corpus — unlike the name-only corpus above, this one's ratings do
// differentiate real dishes (jalebi scores badly, dhokla scores well), so it's used as a
// rough verdict fallback when no real macro data is available. Always labeled "approximate"
// in the UI — the explanatory text behind these ratings is templated, not dish-specific.
let DISH_RATINGS = null;
async function loadDishRatings() {
  if (DISH_RATINGS) return DISH_RATINGS;
  try {
    const res = await fetch("dishratings.json");
    DISH_RATINGS = await res.json();
  } catch {
    DISH_RATINGS = { subs: [], portions: [], dishes: [] };
  }
  return DISH_RATINGS;
}
function ratingToVerdict(avg) {
  if (avg <= 1.5) return "avoid";
  if (avg <= 2.5) return "limit";
  if (avg <= 3.5) return "moderate";
  return "safe";
}
function lookupDishRating(query, ratings) {
  const nq = normalizeWithAliases(query);
  if (!ratings || !ratings.dishes) return null;
  // exact pass first
  for (const [name, avg, subIdx, portionIdx] of ratings.dishes) {
    if (normalizeWithAliases(name) === nq) {
      return { name, verdict: ratingToVerdict(avg), substitution: ratings.subs[subIdx], portion: ratings.portions[portionIdx] };
    }
  }
  // fuzzy fallback — same tolerance approach as the spelling corpus
  let best = null, bestDist = Infinity, bestRow = null;
  for (const row of ratings.dishes) {
    const nk = normalizeWithAliases(row[0]);
    const dist = levenshtein(nq, nk);
    const threshold = Math.max(1, Math.floor(Math.min(nq.length, nk.length) * 0.2));
    if (dist <= threshold && dist < bestDist) { best = row[0]; bestDist = dist; bestRow = row; }
  }
  if (bestRow) {
    const [name, avg, subIdx, portionIdx] = bestRow;
    return { name, verdict: ratingToVerdict(avg), substitution: ratings.subs[subIdx], portion: ratings.portions[portionIdx] };
  }
  return null;
}

  lines.push(avgProtein >= targets.protein * 0.9 ? `Protein averaged ${avgProtein}g/day — on target.` : `Protein averaged ${avgProtein}g/day — below the ${targets.protein}g target.`);
  lines.push(avgSugar > targets.sugar ? `Sugar averaged ${avgSugar}g/day — over the ${targets.sugar}g target.` : `Sugar averaged ${avgSugar}g/day — within target.`);
  lines.push(`Carbs averaged ${avgCarbs}g/day.`);
  return lines;
}
function supplementInsight(curKeys, prevKeys, weekSupplements, totalSupp) {
  const pct = (keys) => {
    let total = 0, count = 0;
    keys.forEach(k => { const s = weekSupplements[k]; if (s && Object.keys(s).length) { count++; total += Object.values(s).filter(Boolean).length / totalSupp; } });
    return count ? Math.round((total / count) * 100) : null;
  };
  const cur = pct(curKeys), prev = pct(prevKeys);
  if (cur == null) return null;
  let text = `Supplements taken ~${cur}% of logged days`;
  if (prev != null) text += cur >= prev ? ` (up from ${prev}%).` : ` (down from ${prev}%).`;
  else text += ".";
  return text;
}

/* ---------- Shared period stats + comparison series (all anchored to the viewed date) ---------- */
function toneColor(tone) { return tone === "bad" ? T.alert : tone === "warn" ? T.amber : T.forest; }
function toneBg(tone) { return tone === "bad" ? T.alertPale : tone === "warn" ? T.amberPale : T.forestPale; }
function dowShort(dk) { return new Date(dk + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short" }); }

// Food aggregate across a set of date keys → per-logged-day averages + verdict mix.
function foodStats(keys, weekFood) {
  let days = 0, calories = 0, protein = 0, carbs = 0, sugar = 0, fiber = 0, meals = 0, bad = 0;
  keys.forEach(k => {
    const entries = weekFood[k] || [];
    if (!entries.length) return;
    days++;
    entries.forEach(e => {
      calories += e.calories || 0; protein += e.protein || 0; carbs += e.carbs || 0;
      sugar += e.sugar || 0; fiber += e.fiber || 0; meals++;
      if (e.verdict === "avoid" || e.verdict === "limit") bad++;
    });
  });
  if (!days) return null;
  return {
    days, meals, badMeals: bad,
    calories: Math.round(calories / days), protein: Math.round(protein / days),
    carbs: Math.round(carbs / days), sugar: Math.round(sugar / days), fiber: Math.round(fiber / days),
    cleanPct: meals ? Math.round(((meals - bad) / meals) * 100) : null,
  };
}
// Activity + habit aggregate across date keys (Sundays excluded from habit denominators).
function activityStats(keys, activities, weekHabits) {
  let minutes = 0, activeDays = 0, walkDays = 0, trackable = 0, habitDone = 0, habitPossible = 0;
  keys.forEach(k => {
    const sun = new Date(k + "T00:00:00").getDay() === 0;
    const acts = activities[k] || [];
    if (acts.length) activeDays++;
    acts.forEach(a => { minutes += a.duration || 0; });
    if (acts.some(a => a.type === "Walk")) walkDays++;
    if (!sun) { trackable++; const h = weekHabits[k]; if (h) { habitDone += HABITS.filter(x => h[x.id]).length; habitPossible += HABITS.length; } }
  });
  return { minutes, activeDays, walkDays, trackable, habitPct: habitPossible ? Math.round((habitDone / habitPossible) * 100) : null };
}
// Supplement adherence across date keys → % of the full list taken, averaged over logged days.
function suppStats(keys, weekSupplements, total) {
  let sum = 0, days = 0, taken = 0;
  keys.forEach(k => { const s = weekSupplements[k]; if (!s || !Object.keys(s).length) return; days++; const t = Object.values(s).filter(Boolean).length; taken += t; sum += t / (total || 1); });
  if (!days) return null;
  return { pct: Math.round((sum / days) * 100), days, avgTaken: Math.round((taken / days) * 10) / 10 };
}

// Per-day value getters (return null when there's nothing to plot for that day).
function scoreValue(dk, weekFood, weekHabits, weekSupplements) { return hasAnyData(dk, weekFood, weekHabits, weekSupplements) ? dayScore(weekFood[dk] || [], weekHabits[dk] || {}, weekSupplements[dk] || {}) : null; }
function caloriesValue(dk, weekFood) { const e = weekFood[dk] || []; return e.length ? e.reduce((s, f) => s + (f.calories || 0), 0) : null; }
function sugarValue(dk, weekFood) { const e = weekFood[dk] || []; return e.length ? e.reduce((s, f) => s + (f.sugar || 0), 0) : null; }
function activeMinValue(dk, activities) { if (dk > todayKey()) return null; const a = activities[dk] || []; return a.reduce((s, x) => s + (x.duration || 0), 0); }
function suppPctValue(dk, weekSupplements, total) { const s = weekSupplements[dk]; return s && Object.keys(s).length ? Math.round((Object.values(s).filter(Boolean).length / (total || 1)) * 100) : null; }
function habitPctValue(dk, weekHabits) { if (new Date(dk + "T00:00:00").getDay() === 0) return null; const h = weekHabits[dk]; return h && Object.keys(h).length ? Math.round((HABITS.filter(x => h[x.id]).length / HABITS.length) * 100) : null; }

// Split a calendar month into 7-day blocks (W1, W2, …) and average a per-day value over each.
function monthWeekBlocks(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const dim = daysInMonth(y, m - 1);
  const blocks = [];
  for (let s = 1; s <= dim; s += 7) { const keys = []; for (let day = s; day < s + 7 && day <= dim; day++) keys.push(`${monthKey}-${String(day).padStart(2, "0")}`); blocks.push(keys); }
  return blocks;
}
function monthWeekSeries(monthKey, valueFn) {
  return monthWeekBlocks(monthKey).map(keys => { const vals = keys.map(valueFn).filter(v => v != null); return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null; });
}

// Top-of-tab headline: one-liner insight + concrete recommendation, comparing the viewed
// week to the week before (and to targets). Returns { tone, text } or null when no data.
function foodHeadline(thisKeys, lastKeys, weekFood, targets, sugarMarkerLabel) {
  const cur = foodStats(thisKeys, weekFood); if (!cur) return null;
  const prev = foodStats(lastKeys, weekFood);
  const dir = prev ? (cur.sugar > prev.sugar + 2 ? ` (up from ${prev.sugar}g last week)` : cur.sugar < prev.sugar - 2 ? ` (down from ${prev.sugar}g last week)` : "") : "";
  const protectPhrase = sugarMarkerLabel ? `protect your ${sugarMarkerLabel}` : "keep things in balance";
  if (cur.sugar > targets.sugar) return { tone: "warn", text: `Sugar is averaging ${cur.sugar}g/day this week${dir} — over the ${targets.sugar}g target. Cut sweets, juice and refined carbs to ${protectPhrase}.` };
  if (cur.protein < targets.protein * 0.85) return { tone: "warn", text: `Sugar's under control (${cur.sugar}g/day) but protein is low at ${cur.protein}g vs the ${targets.protein}g target — add more dal, paneer or curd this week.` };
  return { tone: "good", text: `Clean eating this week — sugar ${cur.sugar}g/day (target ${targets.sugar}), protein ${cur.protein}g, ${cur.cleanPct}% of meals in the green. Keep it up.` };
}
function habitHeadline(thisKeys, lastKeys, activities, weekHabits, cardioMarkerLabel) {
  const cur = activityStats(thisKeys, activities, weekHabits); if (cur.trackable === 0) return null;
  const prev = activityStats(lastKeys, activities, weekHabits);
  const dir = cur.walkDays > prev.walkDays ? ` (up from ${prev.walkDays})` : cur.walkDays < prev.walkDays ? ` (down from ${prev.walkDays})` : "";
  const lever = cardioMarkerLabel || "your heart & metabolic health";
  if (cur.walkDays <= 2) return { tone: "bad", text: `Only ${cur.walkDays} walk${cur.walkDays === 1 ? "" : "s"} logged this week${dir} — aim for at least 4 brisk 30-min walks; it's your single best lever for ${lever}.` };
  if (cur.walkDays < 4) return { tone: "warn", text: `${cur.walkDays} walks this week${dir}, ${cur.minutes} active minutes. Push for a couple more — 4–5 walks a week is where it starts to move markers.` };
  return { tone: "good", text: `Strong week — ${cur.walkDays} walks and ${cur.minutes} active minutes${dir}. Keep the streak going.` };
}
function suppHeadline(thisKeys, lastKeys, weekSupplements, total, criticalSuppNames) {
  const cur = suppStats(thisKeys, weekSupplements, total); if (!cur) return null;
  const prev = suppStats(lastKeys, weekSupplements, total);
  const dir = prev ? (cur.pct > prev.pct + 3 ? ` (up from ${prev.pct}%)` : cur.pct < prev.pct - 3 ? ` (down from ${prev.pct}%)` : "") : "";
  if (cur.pct < 60) return { tone: "warn", text: `Only ~${cur.pct}% of supplements taken this week${dir}. Don't skip your critical ones${criticalSuppNames ? ` — ${criticalSuppNames}` : ""} — they're doing the heavy lifting.` };
  return { tone: "good", text: `Good consistency — ~${cur.pct}% of supplements taken this week${dir}.` };
}

/* ============================== STORAGE ============================== */
function useKV(key, initial) {
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; } catch { return initial; }
  });
  const save = useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [value, save, true];
}

/* ============================== SIMPLE CUSTOM CHARTS ============================== */
function MiniLineChart({ periods, series, width = 560, height = 220 }) {
  const padL = 34, padB = 24, padT = 10, padR = 10;
  const allVals = series.flatMap(s => s.points.filter(v => v != null));
  const min = Math.min(...allVals, 0), max = Math.max(...allVals, 1);
  const x = (i) => padL + (i / (periods.length - 1)) * (width - padL - padR);
  const y = (v) => padT + (1 - (v - min) / (max - min || 1)) * (height - padT - padB);
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {[0, 0.5, 1].map((f, i) => <line key={i} x1={padL} x2={width - padR} y1={padT + f * (height - padT - padB)} y2={padT + f * (height - padT - padB)} stroke={T.border} strokeWidth="1" />)}
      {periods.map((p, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{p}</text>)}
      {series.map(s => {
        const segments = []; let current = [];
        s.points.forEach((v, i) => { if (v == null) { if (current.length) segments.push(current); current = []; } else current.push([x(i), y(v)]); });
        if (current.length) segments.push(current);
        return segments.map((seg, si) => <polyline key={s.key + si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />);
      })}
      {series.map(s => s.points.map((v, i) => v != null && <circle key={s.key + i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />))}
    </svg>
  );
}
function MiniBarChart({ bars, height = 100 }) {
  const width = 320, padB = 18, padT = 6;
  const max = Math.max(...bars.map(b => Math.abs(b.value)), 1);
  const bw = (width / bars.length) * 0.6;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {bars.map((b, i) => {
        const slot = width / bars.length; const cx = slot * i + slot / 2;
        const h = b.value < 0 ? 6 : Math.max(4, (Math.abs(b.value) / max) * (height - padB - padT));
        return (
          <g key={i}>
            <rect x={cx - bw / 2} y={height - padB - h} width={bw} height={h} rx="3" fill={b.color} opacity={b.opacity ?? 1} />
            <text x={cx} y={height - 4} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{b.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Two-line comparison chart (this period vs the one before). Handles nulls (gaps) and
// auto-scales; used for week day-by-day and month week-by-week comparisons across tabs.
function TwoLineChart({ labels, a, b, aLabel, bLabel, aColor = T.saffron, bColor = T.teal, height = 180, yMax, unit = "" }) {
  const width = 560, padL = 34, padB = 34, padT = 12, padR = 12;
  const vals = [...(a || []), ...(b || [])].filter(v => v != null);
  const max = yMax || Math.max(...vals, 1);
  const n = Math.max(1, labels.length - 1);
  const x = i => padL + (i / n) * (width - padL - padR);
  const y = v => padT + (1 - v / (max || 1)) * (height - padT - padB);
  function draw(arr, color) {
    if (!arr) return null;
    const segs = []; let cur = [];
    arr.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    return (
      <g>
        {segs.map((seg, si) => <polyline key={si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />)}
        {arr.map((v, i) => v != null && <circle key={i} cx={x(i)} cy={y(v)} r="3" fill={color} />)}
      </g>
    );
  }
  return (
    <div>
      <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
        {[0, 0.5, 1].map((f, i) => { const yy = padT + f * (height - padT - padB); return <g key={i}><line x1={padL} x2={width - padR} y1={yy} y2={yy} stroke={T.border} strokeWidth="1" /><text x={padL - 6} y={yy + 3} fontSize="9" fill={T.inkSoft} textAnchor="end" fontFamily="Inter">{Math.round(max - f * max)}{unit}</text></g>; })}
        {labels.map((l, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{l}</text>)}
        {draw(b, bColor)}
        {draw(a, aColor)}

// A single "this week vs last week" number with a delta chip.
function MetricDelta({ label, cur, prev, unit = "", goodWhenLower = false }) {
  const delta = cur != null && prev != null ? Math.round((cur - prev) * 10) / 10 : null;
  const good = delta == null || delta === 0 ? null : goodWhenLower ? delta < 0 : delta > 0;
  return (
    <div style={{ flex: 1, minWidth: 76 }}>
      <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>{cur ?? "—"}{cur != null ? unit : ""}</div>

      {delta != null && delta !== 0 && <div style={{ fontFamily: "Inter", fontSize: 10.5, color: good ? T.forest : T.alert }}>{delta > 0 ? "▲" : "▼"} {Math.abs(delta)}{unit} vs last wk</div>}
    </div>
  );
}

        calories: entry.calories, protein: entry.protein, fiber: entry.fiber, carbs: entry.carbs, sugar: entry.sugar,
        portion: entry.portion, marker: entry.marker, weeklyLimit: entry.weeklyLimit,
        reason: entry.reason + (notes.length ? ` Improved because: ${notes.join(", ")}.` : ""),
        healthierTip: notes.length ? null : (entry.healthierTip || suggestSwap(matchedFoodKey)),
        dynamicTags: computeDynamicTags(entry, priorities),
      });
      return;
    }

    // 2. Your own saved dishes (from past pastes/manual entries), exact or fuzzy
    const customKeys = Object.keys(customDishes);
    const matchedCustomKey = fuzzyMatchKey(coreDish, customKeys);
    if (matchedCustomKey) {
      const entry = customDishes[matchedCustomKey];
      if (normalizeWithAliases(matchedCustomKey) !== normalizeWithAliases(coreDish)) setCorrectedFrom(matchedCustomKey);
      const { verdict: upgradedVerdict, notes } = applyModifierUpgrade(entry.verdict, raw);
      setResult({
        dish: raw, ...entry, verdict: upgradedVerdict,
        reason: entry.reason + (notes.length ? ` Improved because: ${notes.join(", ")}.` : ""),
        lookedUp: true, source: "your saved dishes",
        dynamicTags: computeDynamicTags(entry, priorities),
      });
      return;
    }

    // 3. Correct against the 5,200-name spelling corpus, then retry the free API with the cleaned-up core name
    setLookingUp(true);
    const corpus = await loadDishCorpus();
    const corrected = fuzzyMatchCorpus(coreDish, corpus);
    const queryForApi = corrected || coreDish;
    let data = await lookupNutrition(queryForApi);
    setLookingUp(false);
    // Reject a garbage fuzzy match (e.g. "son papdi" -> a branded coffee): the returned
    // product name must share a real word (4+ letters) with what the user typed.
    if (data && data.servingDesc) {
      const desc = String(data.servingDesc).toLowerCase();
      const qWords = normalizeWithAliases(hCore).split(" ").filter((w) => w.length >= 4);
      if (qWords.length && !qWords.some((w) => desc.includes(w))) data = null;
    }
    if (data) {
      const baseVerdict = classifyMacros(raw, data); // raw, so the fried-override regex still sees "air fried" etc directly
      const { verdict: upgradedVerdict, notes } = applyModifierUpgrade(baseVerdict, raw);
      if (corrected && normalizeWithAliases(corrected) !== normalizeWithAliases(coreDish)) setCorrectedFrom(corrected);
      setResult({
        dish: raw, verdict: upgradedVerdict,
        calories: data.calories != null ? Math.round(data.calories) : null,
        protein: data.protein != null ? Math.round(data.protein) : null,
        fiber: data.fiber != null ? Math.round(data.fiber) : null,
        carbs: data.carbs != null ? Math.round(data.carbs) : null,
        sugar: data.sugar != null ? Math.round(data.sugar) : null,
        portion: (data.servingDesc && data.servingDesc.length <= 40) ? data.servingDesc : "1 standard serving",
        reason: `Estimated from ${data.source || "a nutrition database"}${notes.length ? ` — improved because: ${notes.join(", ")}` : ""} — a rules-based estimate, not clinical advice.`,
        marker: null, weeklyLimit: null,
        healthierTip: notes.length ? null : suggestSwap(corrected || coreDish),
        lookedUp: true, source: data.source,
        dynamicTags: computeDynamicTags(data, priorities),
      });
    } else if (corrected) {
      // Recognized in the ~6,700-dish database (dishes.json) but no exact macros available
      // on a static deploy (no nutrition backend). Give a GENERAL "how healthy is this dish"
      // verdict from the app's keyword rules — this works for anyone, not just Jignesh — and
      // let the user add calories manually. The database's own 1–5 ratings are templated and
      // deliberately ignored here.
      const baseVerdict = demoVerdictFor(corrected);
      const { verdict: upgradedVerdict, notes } = applyModifierUpgrade(baseVerdict, raw);
      if (normalizeWithAliases(corrected) !== normalizeWithAliases(coreDish)) setCorrectedFrom(corrected);
      // If we also have INDB health data for this dish, fill in real per-100g nutrition.
      const heC = healthLookup(hCore) || healthLookup(coreDish) || healthLookup(corrected) || healthLookup(raw);
      const nC = heC && heC.n ? heC.n : null;
      setResult({
        dish: raw, verdict: upgradedVerdict,
        calories: nC ? nC.kcal : null, protein: nC ? nC.protein : null, fiber: nC ? nC.fibre : null, carbs: nC ? nC.carb : null, sugar: nC ? nC.sugar : null,
        portion: nC ? "per 100 g" : "1 moderate serving", perUnit: nC ? "100 g" : null,
        reason: nC
          ? `Nutrition below is per 100 g (from the INDB sample). The verdict and tags are personalised to your report.${notes.length ? ` Improved because: ${notes.join(", ")}.` : ""}`
          : `Recognized "${corrected}" in the dish database. This is a general healthy-eating estimate based on the dish type — add calories manually if you want them tracked.${notes.length ? ` Improved because: ${notes.join(", ")}.` : ""}`,
        marker: null, weeklyLimit: null,
        healthierTip: notes.length ? null : suggestSwap(corrected),
        lookedUp: true, source: nC ? "health database" : "dish database",
      });
    } else {
      // Recognized in the per-condition health DB (built from the INDB sample) even though
      // it's not in the curated FOOD_DB and no macro API is available — show the health
      // signals plus the INDB nutrition (per 100 g) rather than "not found".
      const he = healthLookup(hCore) || healthLookup(coreDish) || healthLookup(raw);
      if (he) {

        setResult({
          dish: raw, verdict: demoVerdictFor(coreDish),
          calories: n.kcal ?? null, protein: n.protein ?? null, fiber: n.fibre ?? null,
          carbs: n.carb ?? null, sugar: n.sugar ?? null,
          portion: "per 100 g", perUnit: "100 g",
          reason: "Nutrition below is per 100 g (from the INDB sample). The verdict and tags are personalised to your report.",
          marker: null, weeklyLimit: null, lookedUp: true, source: "health database",
        });
      } else {
        setNotFound(raw);
      }
    }
  }

function ActivityLog({ selectedDate, activities, addActivity, deleteActivity }) {
  const [type, setType] = useState("Walk");
  const [duration, setDuration] = useState("");
  function add() { const mins = parseInt(duration, 10); if (!mins || mins <= 0) return; addActivity(selectedDate, { type, duration: mins, time: Date.now() }); setDuration(""); }
  const allEntries = Object.keys(activities).sort((a, b) => b.localeCompare(a)).flatMap(dk => (activities[dk] || []).map((e, idx) => ({ ...e, dateKey: dk, idx }))).sort((a, b) => b.time - a.time).slice(0, 10);
  const byMonth = summarizeActivitiesByMonth(activities);
  const selD = new Date(selectedDate + "T00:00:00");
  const curMk = ym(selD);
  const prevD = new Date(selD.getFullYear(), selD.getMonth() - 1, 1); const prevMk = ym(prevD);
  const isCurRealMonth = curMk === ym(new Date());
  const daysElapsedThisMonth = isCurRealMonth ? new Date().getDate() : daysInMonth(selD.getFullYear(), selD.getMonth());
  const daysInPrevMonth = daysInMonth(prevD.getFullYear(), prevD.getMonth());
  const curStats = byMonth[curMk]; const prevStats = byMonth[prevMk];
  const curPct = curStats ? Math.round((curStats.activeDays.size / daysElapsedThisMonth) * 100) : 0;
  const prevPct = prevStats ? Math.round((prevStats.activeDays.size / daysInPrevMonth) * 100) : null;
  const minFn = (k) => activeMinValue(k, activities);
  const monActThis = monthWeekSeries(curMk, minFn);
  const monActLast = monthWeekSeries(prevMk, minFn);
  const monActLen = Math.max(monActThis.length, monActLast.length, 1);
  const monActPad = (arr) => arr.concat(Array(Math.max(0, monActLen - arr.length)).fill(null));
  const monActLabels = Array.from({ length: monActLen }, (_, i) => `W${i + 1}`);
  return (
    <>
      <SectionLabel>Activity log — {formatDateLabel(selectedDate)}</SectionLabel>
      <Card>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>{ACTIVITY_TYPES.map(t => <button key={t} onClick={() => setType(t)} style={{ background: type === t ? T.teal : T.creamDeep, color: type === t ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12 }}>{t}</button>)}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={duration} onChange={e => setDuration(e.target.value.replace(/\D/g, ""))} placeholder="Minutes" inputMode="numeric" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
          <button onClick={add} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "0 16px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Add</button>
        </div>
      </Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Recent activity</SectionLabel>
      <Card>{allEntries.length === 0 ? <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Nothing logged yet.</div> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{allEntries.map((e, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: "Inter", fontSize: 13 }}>{e.type}</span>
            <span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, flex: 1, textAlign: "right" }}>{e.duration} min · {e.dateKey === todayKey() ? "Today" : formatDateLabel(e.dateKey)}</span>
            <DeleteBtn onClick={() => deleteActivity(e.dateKey, e.idx)} />
          </div>
        ))}</div>
      )}</Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Monthly summary — {monthLabel(curMk)}</SectionLabel>
      <Card>
        <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, marginBottom: 6 }}>{monthLabel(curMk)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{curPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{curStats ? curStats.activeDays.size : 0} active days of {daysElapsedThisMonth}{isCurRealMonth ? " so far" : ""}{curStats ? ` · ${curStats.totalMinutes} min total` : ""}</div>
        </div>
        {prevPct !== null ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginTop: 6 }}>
            <Icon name={curPct >= prevPct ? "trendUp" : "trendDown"} size={14} color={curPct >= prevPct ? T.forest : T.alert} /> vs {prevPct}% in {monthLabel(prevMk)}
          </div>
        ) : <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>No data yet for {monthLabel(prevMk)} to compare.</div>}
        {(monActThis.some(v => v != null) || monActLast.some(v => v != null)) && (
          <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
            <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Active minutes per week — {monthLabel(curMk)} vs {monthLabel(prevMk)}</div>
            <div style={{ minWidth: 480 }}>
              <TwoLineChart labels={monActLabels} a={monActPad(monActThis)} b={monActPad(monActLast)} aLabel={monthLabel(curMk)} bLabel={monthLabel(prevMk)} unit="m" height={170} />
            </div>
          </div>
        )}
      </Card>
      <div style={{ height: 18 }} />
    </>
  );
}

function HabitsTab({ selectedDate, setSelectedDate, habitsForDate, toggleHabit, weekHabits, weekFood, weekSupplements, activities, addActivity, deleteActivity, advice }) {
  const [calendarOpen, setCalendarOpen] = useState(false);
  const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(selectedDate);
  const dates = thisWeekKeys.map(k => new Date(k + "T00:00:00"));
  function streakFor(habitId) { let streak = 0; for (let i = dates.length - 1; i >= 0; i--) { const d = dates[i]; const key = ymd(d); if (isSunday(d)) continue; if (weekHabits[key]?.[habitId]) streak++; else break; } return streak; }
  const weekBars = dates.map(d => { const key = ymd(d); if (isSunday(d)) return { label: dayLabel(d), value: 0.3, color: T.creamDeep }; const done = HABITS.filter(h => weekHabits[key]?.[h.id]).length; return { label: dayLabel(d), value: done || 0.3, color: done >= HABITS.length - 1 ? T.forest : done >= HABITS.length / 2 ? T.amber : T.alert }; });
  const totalPossible = dates.filter(d => !isSunday(d)).length * HABITS.length;
  const totalDone = dates.reduce((sum, d) => { if (isSunday(d)) return sum; const key = ymd(d); return sum + HABITS.filter(h => weekHabits[key]?.[h.id]).length; }, 0);
  const weekPct = totalPossible === 0 ? 0 : Math.round((totalDone / totalPossible) * 100);
  const selDate = new Date(selectedDate + "T00:00:00");
  const selIsSunday = isSunday(selDate);
  const habitHl = habitHeadline(thisWeekKeys, lastWeekKeys, activities, weekHabits, advice.cardioMarkerLabel);
  const weekLabels = thisWeekKeys.map(dowShort);
  const weekHabitThis = thisWeekKeys.map(k => habitPctValue(k, weekHabits));
  const weekHabitLast = lastWeekKeys.map(k => habitPctValue(k, weekHabits));

  return (
    <div className="tabPane">
      <DateBar selectedDate={selectedDate} onOpenCalendar={() => setCalendarOpen(true)} onBackToToday={() => setSelectedDate(todayKey())} />
      {habitHl && <><InsightCallout insight={habitHl} icon="walk" /><div style={{ height: 14 }} /></>}
      <SectionLabel>Habits — {formatDateLabel(selectedDate)}</SectionLabel>
      <Card>
        {selIsSunday ? (
          <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Sunday — rest day, no tracking needed.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{HABITS.map(h => (
            <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
              <button onClick={() => toggleHabit(selectedDate, h.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${habitsForDate[h.id] ? T.forest : T.border}`, background: habitsForDate[h.id] ? T.forest : T.white, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{habitsForDate[h.id] && <Icon name="check" size={14} color={T.white} />}</button>
              <span style={{ fontFamily: "Inter", fontSize: 13.5 }}>{h.label}</span>
            </div>
          ))}</div>
        )}
      </Card>
      <div style={{ height: 18 }} />
      <ActivityLog selectedDate={selectedDate} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} />
      <SectionLabel>7-day overview ({dates[0].toLocaleDateString("en-IN", { day: "numeric", month: "short" })} – {dates[6].toLocaleDateString("en-IN", { day: "numeric", month: "short" })})</SectionLabel>
      <Card>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 480 }}>
            <thead><tr><th></th>{dates.map((d, i) => {
              const key = ymd(d);
              const isToday = key === todayKey();
              return (

function SupplementsTab({ selectedDate, setSelectedDate, supplementsForDate, toggleSupplement, weekFood, activities, weekSupplements, supplements, advice }) {
  const [calendarOpen, setCalendarOpen] = useState(false);
  const groups = [{ key: "morning", label: "🌅 Morning" }, { key: "afternoon", label: "☀️ After lunch" }, { key: "evening", label: "🌆 Evening" }, { key: "night", label: "🌙 Before bed" }, { key: "weekly", label: "📅 Weekly" }];
  const takenToday = supplements.filter(s => supplementsForDate[s.id]).length;
  const total = supplements.length;
  const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(selectedDate);
  const { thisMonthKey, lastMonthKey } = monthWindowsForDate(selectedDate);
  const suppHl = suppHeadline(thisWeekKeys, lastWeekKeys, weekSupplements, total, advice.criticalSuppNames);
  const curW = suppStats(thisWeekKeys, weekSupplements, total);
  const prevW = suppStats(lastWeekKeys, weekSupplements, total);
  const weekLabels = thisWeekKeys.map(dowShort);
  const suppFn = (k) => suppPctValue(k, weekSupplements, total);
  const weekSuppThis = thisWeekKeys.map(suppFn);
  const weekSuppLast = lastWeekKeys.map(suppFn);
  const monSuppThis = monthWeekSeries(thisMonthKey, suppFn);
  const monSuppLast = monthWeekSeries(lastMonthKey, suppFn);
  const monLen = Math.max(monSuppThis.length, monSuppLast.length, 1);
  const monPad = (arr) => arr.concat(Array(Math.max(0, monLen - arr.length)).fill(null));
  const monLabels = Array.from({ length: monLen }, (_, i) => `W${i + 1}`);
  return (
    <div className="tabPane">
      <DateBar selectedDate={selectedDate} onOpenCalendar={() => setCalendarOpen(true)} onBackToToday={() => setSelectedDate(todayKey())} />
      {suppHl && <><InsightCallout insight={suppHl} icon="pill" /><div style={{ height: 14 }} /></>}
      <Card style={{ marginBottom: 14, textAlign: "center" }}>
        <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{takenToday} of {supplements.length}</div>
        <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>taken — {formatDateLabel(selectedDate)}</div>
      </Card>
      {(curW || prevW) && (
        <>
          <SectionLabel>Adherence — week & month</SectionLabel>
          <Card style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 6 }}>
              <MetricDelta label="This week" cur={curW ? curW.pct : null} prev={prevW ? prevW.pct : null} unit="%" />
              <MetricDelta label="Avg taken/day" cur={curW ? curW.avgTaken : null} prev={prevW ? prevW.avgTaken : null} />
              <div style={{ flex: 1, minWidth: 76 }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>{prevW ? prevW.pct + "%" : "—"}</div><div style={{ fontFamily: "Inter", fontSize: 10.5, color: T.inkSoft }}>Last week</div></div>
            </div>
            {(weekSuppThis.some(v => v != null) || weekSuppLast.some(v => v != null)) && (
              <div style={{ marginTop: 8, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Supplements taken per day (%) — this week vs last week</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={weekLabels} a={weekSuppThis} b={weekSuppLast} aLabel="This week" bLabel="Last week" yMax={100} unit="%" height={170} />
                </div>
              </div>
            )}
            {(monSuppThis.some(v => v != null) || monSuppLast.some(v => v != null)) && (
              <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Weekly average (%) — {monthLabel(thisMonthKey)} vs {monthLabel(lastMonthKey)}</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={monLabels} a={monPad(monSuppThis)} b={monPad(monSuppLast)} aLabel={monthLabel(thisMonthKey)} bLabel={monthLabel(lastMonthKey)} yMax={100} unit="%" height={170} />
                </div>
              </div>
            )}
          </Card>
        </>
      )}
      {groups.map(g => { const items = supplements.filter(s => s.time === g.key); if (items.length === 0) return null; return (
        <div key={g.key} style={{ marginBottom: 14 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, color: T.inkSoft, marginBottom: 6 }}>{g.label}</div>
          <Card><div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{items.map(s => (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={() => toggleSupplement(selectedDate, s.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${supplementsForDate[s.id] ? T.forest : T.border}`, background: supplementsForDate[s.id] ? T.forest : T.white, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{supplementsForDate[s.id] && <Icon name="check" size={14} color={T.white} />}</button>
              <div style={{ flex: 1 }}><div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 600 }}>{s.name}</div><div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft }}>{s.dose} · {s.why}</div></div>
            </div>
          ))}</div></Card>
        </div>
      ); })}
      <div style={{ height: 90 }} />
      {calendarOpen && <CalendarPicker selectedDate={selectedDate} onSelect={setSelectedDate} onClose={() => setCalendarOpen(false)} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} />}
    </div>
  );
}

function PlanTab({ weekFood, advice }) {
  const mealIdeas = todaysMealIdeas();

      <SectionLabel>Foods to avoid this week</SectionLabel>

        <div key={m} style={{ marginBottom: 10 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, textTransform: "capitalize", color: T.teal, marginBottom: 4 }}>{m}</div>
          {mealIdeas[m].map((idea, i) => <div key={i} style={{ fontFamily: "Inter", fontSize: 13, color: T.ink, marginBottom: 2, display: "flex", gap: 6 }}><Icon name="chevron" size={14} color={T.saffron} style={{ flexShrink: 0, marginTop: 3 }} /> {idea}</div>)}
        </div>

      <Card style={{ marginBottom: 18 }}><div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{SWAPS.map((s, i) => (
        <div key={i}><div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>{s.craving}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, lineHeight: 1.4 }}>{s.swap}</div></div>
      ))}</div></Card>
      {frequentlyEaten.length > 0 && (
        <>
          <SectionLabel>What you've been eating this week</SectionLabel>
          <Card style={{ marginBottom: 18 }}><div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{frequentlyEaten.map(([dish, count]) => {
            const entry = FOOD_DB[dish];
            const isUnhealthy = entry && (entry.verdict === "avoid" || entry.verdict === "limit" || entry.verdict === "caution");
            return (
              <div key={dish}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontFamily: "Inter", fontSize: 13, textTransform: "capitalize" }}>{dish}</span>
                  <Badge bg={isUnhealthy ? T.alertPale : T.creamDeep} fg={isUnhealthy ? T.alert : T.inkSoft}>{count}x logged{isUnhealthy ? " ⚠️" : ""}</Badge>
                </div>
              </div>
            );
          })}</div></Card>
        </>
      )}
      {flaggedFrequent.length > 0 && (
        <>
          <SectionLabel>How to make them healthier</SectionLabel>
          <Card style={{ marginBottom: 90 }}><div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{flaggedFrequent.map(([dish]) => {
            const entry = FOOD_DB[dish];
            const tip = entry.healthierTip || suggestSwap(dish);
            return (
              <div key={dish}>
                <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, textTransform: "capitalize" }}>{dish}</div>
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, lineHeight: 1.4 }}>{tip || "Cut back on frequency — no lighter version identified for this one."}</div>
              </div>
            );
          })}</div></Card>
        </>
      )}
      {flaggedFrequent.length === 0 && <div style={{ height: 90 }} />}
    </div>
  );
}


function SettingsPanel({ open, onClose, profile, saveProfile, goalToggles, saveGoalToggles, customGoals, saveCustomGoals, metrics, saveMetrics, periods, savePeriods, supplements, saveSupplements, initialSection, onClearDate, onClearAll, onApplyDemoMonth }) {
  const [section, setSection] = useState(initialSection || "profile");

  const [newValues, setNewValues] = useState({});
  const [addingReport, setAddingReport] = useState(false);
  const [clearDateVal, setClearDateVal] = useState(todayKey());
  const [confirmingClearAll, setConfirmingClearAll] = useState(false);
  const [editingSuppId, setEditingSuppId] = useState(null);
  const [suppForm, setSuppForm] = useState({ name: "", dose: "", time: "morning", timeLabel: "", why: "" });
  useEffect(() => { setForm(profile); }, [profile, open]);
  useEffect(() => { if (open) setSection(initialSection || "profile"); }, [open, initialSection]);
  if (!open) return null;
  function saveProfileForm() { saveProfile({ ...form, weight: Number(form.weight) || profile.weight, age: Number(form.age) || profile.age, height: Number(form.height) || profile.height }); }
  function toggleGoal(id) { saveGoalToggles(goalToggles.map(g => g.id === id ? { ...g, active: !g.active } : g)); }
  function addCustomGoal() { if (!newGoalText.trim()) return; saveCustomGoals([...customGoals, { id: `custom-${Date.now()}`, label: newGoalText.trim(), active: true }]); setNewGoalText(""); }
  function removeCustomGoal(id) { saveCustomGoals(customGoals.filter(g => g.id !== id)); }
  function startAddSupplement() { setEditingSuppId("new"); setSuppForm({ name: "", dose: "", time: "morning", timeLabel: "", why: "" }); }
  function startEditSupplement(s) { setEditingSuppId(s.id); setSuppForm({ name: s.name, dose: s.dose, time: s.time, timeLabel: s.timeLabel, why: s.why }); }
  function saveSupplementForm() {
    if (!suppForm.name.trim()) return;
    if (editingSuppId === "new") {
      const id = `supp-${Date.now()}`;
      saveSupplements([...supplements, { id, ...suppForm, critical: false }]);
    } else {
      saveSupplements(supplements.map(s => s.id === editingSuppId ? { ...s, ...suppForm } : s));
    }
    setEditingSuppId(null);
  }
  function removeSupplement(id) { saveSupplements(supplements.filter(s => s.id !== id)); setEditingSuppId(null); }
  function submitNewReport() {
    if (!newPeriodLabel.trim()) return;
    savePeriods([...periods, newPeriodLabel.trim()]);
    saveMetrics(metrics.map(m => ({ ...m, points: [...m.points, newValues[m.key] != null && newValues[m.key] !== "" ? Number(newValues[m.key]) : null] })));

    <div className="askOverlay" onClick={onClose}>
      <div className="askPanel" onClick={e => e.stopPropagation()} style={{ height: "88vh" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", borderBottom: `1px solid ${T.border}` }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: T.teal }}>Profile & Reports</div><button onClick={onClose} style={{ background: "none", border: "none" }}><Icon name="x" size={20} color={T.inkSoft} /></button></div>
        <div style={{ display: "flex", gap: 6, padding: "10px 16px", borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>{SECTIONS.map(s => <button key={s.id} onClick={() => setSection(s.id)} style={{ background: section === s.id ? T.teal : T.creamDeep, color: section === s.id ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 14px", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, whiteSpace: "nowrap" }}>{s.label}</button>)}</div>
        <div style={{ flex: 1, overflowY: "auto", padding: 16 }}>
          {section === "profile" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[{ key: "name", label: "Name" }, { key: "age", label: "Age" }, { key: "weight", label: "Weight (kg)" }, { key: "height", label: "Height (cm)" }, { key: "gender", label: "Gender" }, { key: "city", label: "City / Country" }, { key: "diet", label: "Dietary pattern" }].map(f => (
                <div key={f.key}><div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 4 }}>{f.label}</div><input value={form[f.key] ?? ""} onChange={e => setForm({ ...form, [f.key]: e.target.value })} style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} /></div>
