function metricStatus(value, m) {
  if (value == null) return "untested";

  if (m.high != null && value > m.high) return value > m.high * 1.15 ? "bad" : "watch";
  if (m.idealLow != null && value < m.idealLow) return "watch";
  if (m.idealHigh != null && value > m.idealHigh) return "watch";
  return "good";
}
function rangeLabel(m) { if (m.low != null && m.high != null) return `${m.low}–${m.high}`; if (m.high != null) return `< ${m.high}`; if (m.low != null) return `> ${m.low}`; return "—"; }
function computeTopPriorities(metrics, periods) {
  const latestIdx = periods.length - 1;
  const withStatus = metrics.map(m => { const value = m.points[latestIdx]; return { key: m.key, label: m.label, value, unit: m.unit, status: metricStatus(value, m), target: rangeLabel(m) }; }).filter(m => m.status === "bad" || m.status === "watch");

}

function summarizeActivitiesByMonth(activities) {
  const byMonth = {};
  Object.keys(activities).forEach(dateKey => {
    const mk = dateKey.slice(0, 7); const entries = activities[dateKey] || [];

function dayScore(entries, habitsForDay, supplementsForDay) {
  const mealsCount = entries.length;
  const badMeals = entries.filter(f => f.verdict === "avoid" || f.verdict === "limit").length;
  const goodMeals = mealsCount - badMeals;
  const foodScore = mealsCount === 0 ? 70 : Math.round((goodMeals / mealsCount) * 100);
  const habitsDone = Object.values(habitsForDay || {}).filter(Boolean).length;
  const habitScore = Math.round((habitsDone / HABITS.length) * 100);
  const supplementsDone = Object.values(supplementsForDay || {}).filter(Boolean).length;
  const supScore = Math.round((supplementsDone / SUPPLEMENTS.length) * 100);
  return Math.max(0, Math.min(100, Math.round(foodScore * 0.4 + habitScore * 0.35 + supScore * 0.25)));
}

// Calls YOUR backend proxy (/api/chat), not Anthropic directly — the proxy holds the real key.
async function callClaude(systemPrompt, userText, jsonMode) {
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system: systemPrompt, message: userText }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const text = data.text || "";
    if (jsonMode) { try { return JSON.parse(text.replace(/```json|```/g, "").trim()); } catch { return null; } }
    return text;
  } catch (e) {
    return jsonMode ? null : "Couldn't reach the health engine (" + e.message + "). Check that the backend proxy is deployed with an API key set.";
  }
}

/* ============================== STORAGE (real localStorage — this is a standalone site) ============================== */
function useKV(key, initial) {
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; } catch { return initial; }
  });
  const save = useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [value, save, true];
}

/* ============================== SIMPLE CUSTOM CHARTS (no chart library) ============================== */
function MiniLineChart({ periods, series, width = 560, height = 220 }) {
  const padL = 34, padB = 24, padT = 10, padR = 10;
  const allVals = series.flatMap(s => s.points.filter(v => v != null));
  const min = Math.min(...allVals, 0), max = Math.max(...allVals, 1);
  const x = (i) => padL + (i / (periods.length - 1)) * (width - padL - padR);
  const y = (v) => padT + (1 - (v - min) / (max - min || 1)) * (height - padT - padB);
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {[0, 0.5, 1].map((f, i) => (
        <line key={i} x1={padL} x2={width - padR} y1={padT + f * (height - padT - padB)} y2={padT + f * (height - padT - padB)} stroke={T.border} strokeWidth="1" />
      ))}
      {periods.map((p, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{p}</text>)}
      {series.map(s => {
        const segments = [];
        let current = [];
        s.points.forEach((v, i) => {
          if (v == null) { if (current.length) segments.push(current); current = []; }
          else current.push([x(i), y(v)]);
        });
        if (current.length) segments.push(current);
        return segments.map((seg, si) => (
          <polyline key={s.key + si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        ));
      })}
      {series.map(s => s.points.map((v, i) => v != null && <circle key={s.key + i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />))}
    </svg>
  );
}
function MiniBarChart({ bars, height = 100 }) {
  const width = 320, padB = 18, padT = 6;
  const max = Math.max(...bars.map(b => Math.abs(b.value)), 1);
  const bw = (width / bars.length) * 0.6;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {bars.map((b, i) => {
        const slot = width / bars.length;
        const cx = slot * i + slot / 2;
        const h = b.value < 0 ? 6 : Math.max(4, (Math.abs(b.value) / max) * (height - padB - padT));
        return (
          <g key={i}>
            <rect x={cx - bw / 2} y={height - padB - h} width={bw} height={h} rx="3" fill={b.color} opacity={b.opacity ?? 1} />
            <text x={cx} y={height - 4} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{b.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function FoodCheckTab({ foodToday, weekFood, addFoodEntry, onOpenAsk }) {
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [mealSlot, setMealSlot] = useState("Snack");
  const [warning, setWarning] = useState(null);
  const shortcuts = Object.keys(FOOD_DB);

  async function checkDish(dish) {
    setResult(null); setWarning(null);
    const key = dish.trim().toLowerCase();
    if (FOOD_DB[key]) { setResult({ dish, ...FOOD_DB[key] }); return; }
    setLoading(true);
    const sys = `You are a clinical nutrition assistant for Jignesh, 54, Indian vegetarian (Gujarati), current priorities: Triglycerides 257 (HIGH, target <150), GGT 105 (ELEVATED liver, target <64), TSH 4.57 (high-normal, target 1.5-3.0), LDL 82 (OPTIMAL — protect this). Given a dish name, respond ONLY with JSON, no markdown fences: {"ingredients": "...", "calories": <int>, "protein": <int>, "fiber": <int>, "carbs": <int>, "sugar": <int>, "portion": "...", "verdict": "safe"|"moderate"|"limit"|"avoid", "reason": "...", "marker": "..." or null, "weeklyLimit": <int> or null}`;
    const parsed = await callClaude(sys, `Dish: ${dish}`, true);
    setLoading(false);
    setResult(parsed ? { dish, ...parsed } : { dish, verdict: "moderate", calories: 200, protein: 5, fiber: 1, carbs: 25, sugar: 5, portion: "small serving", reason: "Could not analyze automatically.", marker: null, weeklyLimit: null });
  }
  function meta(v) { return VERDICT_META[v] || VERDICT_META.moderate; }
  function weeklyCountFor(dishName) {
    const key = dishName.trim().toLowerCase(); let count = 0;
    for (let offset = 0; offset <= 6; offset++) { const dk = dateKeyOffset(offset); const entries = weekFood[dk] || []; count += entries.filter(e => e.dish.trim().toLowerCase() === key).length; }
    return count;
  }
  function logMeal() {
    const entry = { dish: result.dish, calories: result.calories || 0, protein: result.protein || 0, fiber: result.fiber || 0, carbs: result.carbs || 0, sugar: result.sugar || 0, verdict: result.verdict, mealSlot, time: Date.now() };
    addFoodEntry(entry);
    const countAfter = weeklyCountFor(result.dish) + 1;
    if (result.weeklyLimit != null && countAfter > result.weeklyLimit) setWarning(`⚠️ This is your ${countAfter}${countAfter === 1 ? "st" : countAfter === 2 ? "nd" : countAfter === 3 ? "rd" : "th"} "${result.dish}" this week — recommended cap is ${result.weeklyLimit}/week.`);
    else if (mealSlot === "After Dinner" && (result.verdict === "limit" || result.verdict === "avoid")) setWarning(`Post-dinner + ${meta(result.verdict).label.toLowerCase()} — flagged habit pattern. Small portion or skip tonight.`);
    else { setWarning(null); setResult(null); setQuery(""); }
  }
  const totalCals = foodToday.reduce((s, f) => s + (f.calories || 0), 0);
  const badCount = foodToday.filter(f => f.verdict === "avoid" || f.verdict === "limit").length;

  return (
    <div className="tabPane">
      <SectionLabel>Is this safe?</SectionLabel>
      <Card>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Type a dish — e.g. besan laddoo" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "10px 12px", fontFamily: "Inter", fontSize: 14, background: T.cream }} onKeyDown={e => { if (e.key === "Enter" && query.trim()) checkDish(query.trim()); }} />
          <button onClick={() => query.trim() && checkDish(query.trim())} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "0 16px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Check</button>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>{shortcuts.map(s => <button key={s} onClick={() => checkDish(s)} style={{ background: T.creamDeep, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12.5, color: T.ink, textTransform: "capitalize" }}>{s}</button>)}</div>
      </Card>
      {loading && <div style={{ display: "flex", alignItems: "center", gap: 8, padding: 14, fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}><Icon name="loader" size={16} /> Checking ingredients…</div>}
      {result && !loading && (
        <>
          <div style={{ height: 12 }} />
          <Card style={{ borderColor: meta(result.verdict).fg }}>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, textTransform: "capitalize", marginBottom: 4 }}>{result.dish}</div>
            {result.ingredients && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>Likely: {result.ingredients}</div>}
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: meta(result.verdict).bg, color: meta(result.verdict).fg, padding: "6px 12px", borderRadius: 999, fontFamily: "Manrope", fontWeight: 800, fontSize: 13, marginBottom: 10 }}>{meta(result.verdict).emoji} {meta(result.verdict).label}</div>
            <div style={{ fontFamily: "Inter", fontSize: 13.5, color: T.ink, lineHeight: 1.5, marginBottom: 10 }}>{result.reason}</div>
            <div style={{ display: "flex", gap: 14, marginBottom: 12, flexWrap: "wrap" }}><MiniStat v={result.calories} l="cal" /><MiniStat v={result.protein} l="protein g" /><MiniStat v={result.fiber} l="fiber g" /><MiniStat v={result.sugar} l="sugar g" /></div>
            {result.weeklyLimit != null && <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 10 }}>You've had this {weeklyCountFor(result.dish)}x this week · cap: {result.weeklyLimit}/week</div>}
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 6 }}>When?</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{MEAL_SLOTS.map(s => <button key={s} onClick={() => setMealSlot(s)} style={{ background: mealSlot === s ? T.teal : T.creamDeep, color: mealSlot === s ? T.white : T.ink, border: "none", borderRadius: 999, padding: "5px 11px", fontFamily: "Inter", fontSize: 12 }}>{s}</button>)}</div>

          </Card>
        </>

      {warning && (
        <>
          <div style={{ height: 10 }} />
          <Card style={{ background: T.amberPale, border: "none" }}>
            <div style={{ fontFamily: "Inter", fontSize: 13, color: T.ink, lineHeight: 1.45, marginBottom: 8 }}>{warning}</div>
            <button onClick={() => { setWarning(null); setResult(null); setQuery(""); }} style={{ background: T.teal, border: "none", borderRadius: 8, padding: "7px 12px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12 }}>Got it</button>
          </Card>
        </>
      )}
      <div style={{ height: 18 }} />
      <SectionLabel>What I ate today</SectionLabel>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
          <div><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20 }}>{totalCals}</div><div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft }}>calories today</div></div>

        {foodToday.length === 0 ? <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Nothing logged yet today.</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{foodToday.map((f, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div><div style={{ fontFamily: "Inter", fontSize: 13.5, textTransform: "capitalize" }}>{f.dish}</div><div style={{ fontFamily: "Inter", fontSize: 10.5, color: T.inkSoft }}>{f.mealSlot || "—"}</div></div>
              <Badge bg={meta(f.verdict).bg} fg={meta(f.verdict).fg}>{meta(f.verdict).emoji} {f.calories} cal</Badge>
            </div>
          ))}</div>
        )}
      </Card>
      <div style={{ height: 90 }} />
      <FabButton onOpenAsk={onOpenAsk} />
    </div>
  );
}

function ActivityLog({ activities, addActivity }) {
  const [type, setType] = useState("Walk");
  const [duration, setDuration] = useState("");
  const tk = todayKey();
  function add() { const mins = parseInt(duration, 10); if (!mins || mins <= 0) return; addActivity({ type, duration: mins, time: Date.now() }); setDuration(""); }
  const allEntries = Object.keys(activities).sort((a, b) => b.localeCompare(a)).flatMap(dk => (activities[dk] || []).map(e => ({ ...e, dateKey: dk }))).sort((a, b) => b.time - a.time).slice(0, 10);
  const byMonth = summarizeActivitiesByMonth(activities);
  const now = new Date(); const curMk = now.toISOString().slice(0, 7);
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1); const prevMk = prevDate.toISOString().slice(0, 7);
  const daysElapsedThisMonth = now.getDate(); const daysInPrevMonth = daysInMonth(prevDate.getFullYear(), prevDate.getMonth());
  const curStats = byMonth[curMk]; const prevStats = byMonth[prevMk];
  const curPct = curStats ? Math.round((curStats.activeDays.size / daysElapsedThisMonth) * 100) : 0;
  const prevPct = prevStats ? Math.round((prevStats.activeDays.size / daysInPrevMonth) * 100) : null;
  return (
    <>
      <SectionLabel>Activity log</SectionLabel>
      <Card>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>{ACTIVITY_TYPES.map(t => <button key={t} onClick={() => setType(t)} style={{ background: type === t ? T.teal : T.creamDeep, color: type === t ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12 }}>{t}</button>)}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={duration} onChange={e => setDuration(e.target.value.replace(/\D/g, ""))} placeholder="Minutes" inputMode="numeric" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
          <button onClick={add} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "0 16px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Add</button>
        </div>
      </Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Recent activity</SectionLabel>
      <Card>{allEntries.length === 0 ? <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Nothing logged yet.</div> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{allEntries.map((e, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between" }}><span style={{ fontFamily: "Inter", fontSize: 13 }}>{e.type}</span><span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{e.duration} min · {e.dateKey === tk ? "Today" : e.dateKey}</span></div>
        ))}</div>
      )}</Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Monthly summary</SectionLabel>
      <Card>
        <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, marginBottom: 6 }}>{monthLabel(curMk)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{curPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{curStats ? curStats.activeDays.size : 0} active days of {daysElapsedThisMonth} so far{curStats ? ` · ${curStats.totalMinutes} min total` : ""}</div>
        </div>
        {prevPct !== null ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginTop: 6 }}>
            <Icon name={curPct >= prevPct ? "trendUp" : "trendDown"} size={14} color={curPct >= prevPct ? T.forest : T.alert} /> vs {prevPct}% in {monthLabel(prevMk)}
          </div>
        ) : <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>No data yet for {monthLabel(prevMk)} to compare.</div>}
      </Card>
      <div style={{ height: 18 }} />
    </>
  );
}

function HabitsTab({ habitsWeek, toggleHabit, activities, addActivity, onOpenAsk }) {
  const dates = last7Dates();
  function streakFor(habitId) { let streak = 0; for (let i = dates.length - 1; i >= 0; i--) { const d = dates[i]; const key = d.toISOString().slice(0, 10); if (isSunday(d)) continue; if (habitsWeek[key]?.[habitId]) streak++; else break; } return streak; }
  const weekBars = dates.map(d => { const key = d.toISOString().slice(0, 10); if (isSunday(d)) return { label: dayLabel(d), value: 0.3, color: T.creamDeep }; const done = HABITS.filter(h => habitsWeek[key]?.[h.id]).length; return { label: dayLabel(d), value: done || 0.3, color: done >= HABITS.length - 1 ? T.forest : done >= HABITS.length / 2 ? T.amber : T.alert }; });
  const totalPossible = dates.filter(d => !isSunday(d)).length * HABITS.length;
  const totalDone = dates.reduce((sum, d) => { if (isSunday(d)) return sum; const key = d.toISOString().slice(0, 10); return sum + HABITS.filter(h => habitsWeek[key]?.[h.id]).length; }, 0);
  const weekPct = totalPossible === 0 ? 0 : Math.round((totalDone / totalPossible) * 100);
  return (
    <div className="tabPane">
      <ActivityLog activities={activities} addActivity={addActivity} />
      <SectionLabel>This week — tap today's column to log</SectionLabel>
      <Card>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 480 }}>
            <thead><tr><th></th>{dates.map((d, i) => <th key={i} style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 11, color: T.inkSoft, paddingBottom: 8 }}>{dayLabel(d)}</th>)}</tr></thead>
            <tbody>{HABITS.map(h => (
              <tr key={h.id}>
                <td style={{ fontFamily: "Inter", fontSize: 12.5, paddingRight: 8, whiteSpace: "nowrap" }}>{h.label}</td>
                {dates.map((d, i) => {
                  const key = d.toISOString().slice(0, 10); const rest = isSunday(d); const done = habitsWeek[key]?.[h.id]; const isToday = key === todayKey();
                  return <td key={i} style={{ textAlign: "center", padding: 3 }}><button disabled={rest || !isToday} onClick={() => isToday && toggleHabit(key, h.id)} style={{ width: 26, height: 26, borderRadius: 7, border: "none", background: rest ? T.creamDeep : done ? T.forest : T.alertPale, opacity: isToday ? 1 : rest ? 1 : 0.55, cursor: isToday && !rest ? "pointer" : "default" }} /></td>;
                })}
              </tr>
            ))}</tbody>
          </table>
        </div>
        <div style={{ display: "flex", gap: 12, marginTop: 12, fontFamily: "Inter", fontSize: 11, color: T.inkSoft }}>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: T.forest, borderRadius: 3, marginRight: 4 }} />Done</span>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: T.alertPale, borderRadius: 3, marginRight: 4 }} />Missed</span>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: T.creamDeep, borderRadius: 3, marginRight: 4 }} />Sunday</span>
        </div>
      </Card>
      <div style={{ height: 14 }} />
      <SectionLabel>Streaks</SectionLabel>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{HABITS.map(h => (
        <Card key={h.id} style={{ flex: "1 1 45%", textAlign: "center", padding: 12 }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20, color: T.saffronDeep }}>{streakFor(h.id)}</div><div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft }}>{h.label}</div></Card>
      ))}</div>

      <SectionLabel>Weekly score</SectionLabel>
      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 26 }}>{weekPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft, textAlign: "right", maxWidth: 220 }}>{weekPct >= 80 ? "Strong week — keep going." : weekPct >= 50 ? "Halfway there." : "Needs work."}</div>
        </div>

      </Card>
      <div style={{ height: 90 }} />
      <FabButton onOpenAsk={onOpenAsk} />
    </div>
  );
}

function AskPanel({ open, onClose }) {

  const [input, setInput] = useState(""); const [loading, setLoading] = useState(false); const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);
  async function send() {
    const text = input.trim(); if (!text || loading) return;
    setInput(""); setMessages(m => [...m, { role: "user", text }]); setLoading(true);
    const sys = `You are a direct, specific health assistant for Jignesh, 54, Indian vegetarian (Gujarati). Priorities: Triglycerides 257 (HIGH, target <150), GGT 105 (ELEVATED, target <64), TSH 4.57 (target 1.5-3.0), LDL 82 (OPTIMAL, protect it). Supplements: Omega-3, Isabgol, Ashwagandha, Liv.52, Silymarin, B12, Turmeric, Zinc, D3. Banned: alcohol, fruit juice, sugar, maida, fried food, large mango. Answer in 2-4 short sentences, direct and specific — never generic.`;
    const reply = await callClaude(sys, text, false);

        </div>
      </div>
    </div>
  );
}

  if (!open) return null;
  function saveProfileForm() { saveProfile({ ...form, weight: Number(form.weight) || profile.weight, age: Number(form.age) || profile.age }); }
  function toggleGoal(id) { saveGoalToggles(goalToggles.map(g => g.id === id ? { ...g, active: !g.active } : g)); }

              ))}
              <button onClick={saveProfileForm} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, marginTop: 6 }}>Save profile</button>
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft }}>Changing weight recalculates calorie/protein targets automatically.</div>
            </div>
          )}
          {section === "goals" && (
            <div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>BODY COMPOSITION GOALS</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>{goalToggles.map(g => (
                <label key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <button onClick={() => toggleGoal(g.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${g.active ? T.forest : T.border}`, background: g.active ? T.forest : T.white, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{g.active && <Icon name="check" size={14} color={T.white} />}</button>
                  <span style={{ fontFamily: "Inter", fontSize: 13.5 }}>{g.label}</span>
                </label>
              ))}</div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>OTHER GOALS</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                {customGoals.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft }}>None added yet.</div>}
                {customGoals.map(g => <div key={g.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.creamDeep, borderRadius: 10, padding: "8px 10px" }}><span style={{ fontFamily: "Inter", fontSize: 13 }}>{g.label}</span><button onClick={() => removeCustomGoal(g.id)} style={{ background: "none", border: "none" }}><Icon name="x" size={14} color={T.inkSoft} /></button></div>)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newGoalText} onChange={e => setNewGoalText(e.target.value)} placeholder="e.g. Improve sleep" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13 }} />
                <button onClick={addCustomGoal} style={{ background: T.teal, border: "none", borderRadius: 10, padding: "0 14px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Add</button>
              </div>
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginTop: 10 }}>Marker-based priorities update automatically from your latest report.</div>
            </div>
          )}
          {section === "reports" && (
            <div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>REPORT HISTORY</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>{periods.map(p => <Badge key={p} bg={T.tealPale} fg={T.teal}>{p}</Badge>)}</div>
              {!addingReport ? <button onClick={() => setAddingReport(true)} style={{ width: "100%", background: T.saffron, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>+ Add new report</button> : (
                <div>
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 4 }}>Period label (e.g. "Jan 2027")</div>
                  <input value={newPeriodLabel} onChange={e => setNewPeriodLabel(e.target.value)} style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5, marginBottom: 12 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 6 }}>Enter new values — leave blank if not tested</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>{metrics.map(m => (
                    <div key={m.key} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ flex: 1, fontFamily: "Inter", fontSize: 12.5 }}>{m.label}</span>
                      <input value={newValues[m.key] ?? ""} onChange={e => setNewValues({ ...newValues, [m.key]: e.target.value.replace(/[^0-9.]/g, "") })} placeholder={m.unit} inputMode="decimal" style={{ width: 80, border: `1px solid ${T.border}`, borderRadius: 8, padding: "6px 8px", fontFamily: "Inter", fontSize: 13 }} />
                    </div>
                  ))}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setAddingReport(false)} style={{ flex: 1, background: T.creamDeep, border: "none", borderRadius: 10, padding: "9px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 13, color: T.ink }}>Cancel</button>
                    <button onClick={submitNewReport} style={{ flex: 1, background: T.teal, border: "none", borderRadius: 10, padding: "9px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Save report</button>
                  </div>
                </div>
              )}
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginTop: 14, lineHeight: 1.5 }}>Manual entry only — this app can't read an uploaded PDF/Excel file itself.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function App() {
  const [tab, setTab] = useState("today");
  const [askOpen, setAskOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsSection, setSettingsSection] = useState("profile");
  const tk = todayKey();

  const [weekFood, setWeekFood] = useKV("week:foodlog", {});
  const [weekSupplements, setWeekSupplements] = useKV("week:supplements", {});
  const [weekHabits, setWeekHabits] = useKV("week:habits", {});
  const [demoCleared, setDemoCleared] = useKV("week:demoCleared", false);
  const [activities, setActivities] = useKV("activities:log", {});
  const [profile, setProfile] = useKV("profile:data", PROFILE_SEED);
  const [goalToggles, setGoalToggles] = useKV("goals:toggles", DEFAULT_GOAL_TOGGLES);
  const [customGoals, setCustomGoals] = useKV("goals:custom", []);
  const [metrics, setMetrics] = useKV("reports:metrics", METRICS_SEED);
  const [periods, setPeriods] = useKV("reports:periods", PERIODS_SEED);

  const foodToday = weekFood[tk] || [];
  const supplementsToday = weekSupplements[tk] || {};
  const habitToday = weekHabits[tk] || {};
  const targets = computeTargets(profile.weight, goalToggles);

  const addFoodEntry = (entry) => setWeekFood(prev => ({ ...prev, [tk]: [...(prev[tk] || []), entry] }));
  const toggleSupplement = (id) => setWeekSupplements(prev => ({ ...prev, [tk]: { ...(prev[tk] || {}), [id]: !(prev[tk]?.[id]) } }));
  const toggleHabit = (dateKey, habitId) => setWeekHabits(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [habitId]: !(prev[dateKey]?.[habitId]) } }));
  const clearDemo = () => setDemoCleared(true);
  const addActivity = (entry) => setActivities(prev => ({ ...prev, [tk]: [...(prev[tk] || []), entry] }));
  const openSettings = (section) => { setSettingsSection(section || "profile"); setSettingsOpen(true); };

  const TABS = [
    { id: "today", label: "Today", icon: "home" },
    { id: "food", label: "Food Check", icon: "food" },
    { id: "health", label: "My Health", icon: "activity" },
    { id: "habits", label: "Habits", icon: "calendar" },
    { id: "supplements", label: "Plan", icon: "pill" },
  ];

  return (
    <div style={{ display: "flex", justifyContent: "center", background: T.creamDeep, minHeight: "100vh" }}>
      <style>{`
        .pulseWrap { animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .fab { position: fixed; bottom: 78px; right: calc(50% - 190px); background: ${T.saffron}; border: none; border-radius: 999px; padding: 12px 18px; display: flex; align-items: center; gap: 7px; box-shadow: 0 6px 18px rgba(232,133,61,0.45); cursor: pointer; z-index: 20; }
        @media (max-width: 460px) { .fab { right: 16px; } }
        .askOverlay { position: fixed; inset: 0; background: rgba(38,48,46,0.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
        .askPanel { background: ${T.cream}; width: 100%; max-width: 420px; height: 78vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
        .tabPane { padding: 18px 16px 16px; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>
      <div style={{ width: "100%", maxWidth: 420, background: T.cream, minHeight: "100vh", position: "relative", boxShadow: "0 0 40px rgba(0,0,0,0.06)" }}>
        <button onClick={() => openSettings("profile")} aria-label="Profile and reports" style={{ position: "absolute", top: 14, right: 14, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><Icon name="settings" size={16} color={T.teal} /></button>
        {tab === "today" && <TodayTab profile={profile} targets={targets} foodToday={foodToday} habitToday={habitToday} supplementsToday={supplementsToday} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} toggleHabit={toggleHabit} onOpenAsk={() => setAskOpen(true)} onNavigate={setTab} demoCleared={demoCleared} clearDemo={clearDemo} />}
        {tab === "food" && <FoodCheckTab foodToday={foodToday} weekFood={weekFood} addFoodEntry={addFoodEntry} onOpenAsk={() => setAskOpen(true)} />}
        {tab === "health" && <MyHealthTab metrics={metrics} periods={periods} supplementsToday={supplementsToday} toggleSupplement={toggleSupplement} onOpenAsk={() => setAskOpen(true)} onAddReport={() => openSettings("reports")} />}
        {tab === "habits" && <HabitsTab habitsWeek={weekHabits} toggleHabit={toggleHabit} activities={activities} addActivity={addActivity} onOpenAsk={() => setAskOpen(true)} />}
        {tab === "supplements" && <SupplementsTab supplementsToday={supplementsToday} toggleSupplement={toggleSupplement} weekFood={weekFood} onOpenAsk={() => setAskOpen(true)} />}
        <div style={{ position: "fixed", bottom: 0, width: "100%", maxWidth: 420, background: T.teal, display: "flex", justifyContent: "space-around", padding: "10px 4px 12px", zIndex: 30 }}>
          {TABS.map(t => { const active = tab === t.id; return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, opacity: active ? 1 : 0.6, cursor: "pointer" }}>
              <Icon name={t.icon} size={20} color={active ? T.saffron : T.white} />
              <span style={{ fontFamily: "Inter", fontSize: 10, fontWeight: active ? 700 : 500, color: T.white }}>{t.label}</span>
            </button>
          ); })}
        </div>
        <AskPanel open={askOpen} onClose={() => setAskOpen(false)} />
        <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} initialSection={settingsSection} profile={profile} saveProfile={setProfile} goalToggles={goalToggles} saveGoalToggles={setGoalToggles} customGoals={customGoals} saveCustomGoals={setCustomGoals} metrics={metrics} saveMetrics={setMetrics} periods={periods} savePeriods={setPeriods} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
