                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setAddingReport(false)} style={{ flex: 1, background: T.creamDeep, border: "none", borderRadius: 10, padding: "9px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 13, color: T.ink }}>Cancel</button>
                    <button onClick={submitNewReport} style={{ flex: 1, background: T.tealSolid, border: "none", borderRadius: 10, padding: "9px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Save report</button>
                  </div>
                </div>
              )}
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginTop: 14, lineHeight: 1.5 }}>Manual entry only — this app can't read an uploaded PDF/Excel file itself.</div>
            </div>
          )}
          {section === "supplements" && (
            <div>
              <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
                Edit this list yourself when a doctor changes the plan — the app won't change what's on it automatically based on report data.
              </div>
              {editingSuppId ? (
                <div style={{ background: T.creamDeep, borderRadius: 10, padding: 12, marginBottom: 12 }}>
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Name</div>
                  <input value={suppForm.name} onChange={e => setSuppForm({ ...suppForm, name: e.target.value })} style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 10px", fontFamily: "Inter", fontSize: 13, marginBottom: 8 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Dose</div>
                  <input value={suppForm.dose} onChange={e => setSuppForm({ ...suppForm, dose: e.target.value })} placeholder="e.g. 500mg" style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 10px", fontFamily: "Inter", fontSize: 13, marginBottom: 8 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Time of day</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                    {[{ k: "morning", l: "Morning" }, { k: "afternoon", l: "After lunch" }, { k: "evening", l: "Evening" }, { k: "night", l: "Before bed" }, { k: "weekly", l: "Weekly" }].map(t => (
                      <button key={t.k} onClick={() => setSuppForm({ ...suppForm, time: t.k })} style={{ background: suppForm.time === t.k ? T.teal : T.white, color: suppForm.time === t.k ? T.white : T.ink, border: `1px solid ${T.border}`, borderRadius: 999, padding: "5px 10px", fontFamily: "Inter", fontSize: 11.5 }}>{t.l}</button>
                    ))}
                  </div>
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Timing note (shown under the dose)</div>
                  <input value={suppForm.timeLabel} onChange={e => setSuppForm({ ...suppForm, timeLabel: e.target.value })} placeholder="e.g. After breakfast" style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 10px", fontFamily: "Inter", fontSize: 13, marginBottom: 8 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 4 }}>Why (optional)</div>
                  <input value={suppForm.why} onChange={e => setSuppForm({ ...suppForm, why: e.target.value })} style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 10px", fontFamily: "Inter", fontSize: 13, marginBottom: 10 }} />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setEditingSuppId(null)} style={{ flex: 1, background: T.white, border: `1px solid ${T.border}`, borderRadius: 8, padding: "9px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Cancel</button>
                    {editingSuppId !== "new" && <button onClick={() => removeSupplement(editingSuppId)} style={{ background: T.alertPale, border: "none", borderRadius: 8, padding: "9px 12px", color: T.alert, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Remove</button>}
                    <button onClick={saveSupplementForm} style={{ flex: 1, background: T.tealSolid, border: "none", borderRadius: 8, padding: "9px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Save</button>
                  </div>
                </div>
              ) : (
                <button onClick={startAddSupplement} style={{ width: "100%", background: T.saffron, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, marginBottom: 14 }}>+ Add supplement</button>
              )}
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {supplements.map(s => (
                  <div key={s.id} onClick={() => startEditSupplement(s)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.white, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", cursor: "pointer" }}>
                    <div><div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13 }}>{s.name}</div><div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft }}>{s.dose} · {s.timeLabel}</div></div>
                    <Icon name="chevron" size={14} color={T.inkSoft} />
                  </div>
                ))}
              </div>
            </div>
          )}
          {section === "data" && (
            <div>
              <button onClick={onApplyDemoMonth} style={{ width: "100%", background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 10, padding: "10px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>Generate history (Jul 1 → today)</button>
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginBottom: 20, lineHeight: 1.5 }}>Fills every empty day from Jul 1 with sample food (from the Weekly Menu), activity and supplement data. Won't touch days you've already logged.</div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR A SPECIFIC DATE</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                <input type="date" value={clearDateVal} max={todayKey()} onChange={e => setClearDateVal(e.target.value)} style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
                <button onClick={() => onClearDate(clearDateVal)} style={{ background: T.alert, border: "none", borderRadius: 10, padding: "0 14px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Clear</button>
              </div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR EVERYTHING</div>
              {!confirmingClearAll ? (
                <button onClick={() => setConfirmingClearAll(true)} style={{ width: "100%", background: T.alertPale, border: `1px solid ${T.alert}`, borderRadius: 10, padding: "10px 0", color: T.alert, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Clear all history</button>
              ) : (
                <div style={{ background: T.alertPale, borderRadius: 10, padding: 12 }}>
                  <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.ink, marginBottom: 10 }}>This can't be undone. Delete every logged day permanently?</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setConfirmingClearAll(false)} style={{ flex: 1, background: T.white, border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Cancel</button>
                    <button onClick={() => { onClearAll(); setConfirmingClearAll(false); }} style={{ flex: 1, background: T.alert, border: "none", borderRadius: 8, padding: "8px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Yes, delete everything</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function App() {
  const [tab, setTab] = useState("today");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsSection, setSettingsSection] = useState("profile");
  const [logOpen, setLogOpen] = useState(false);
  const tk = todayKey();

  const [weekFood, setWeekFood] = useKV("week:foodlog", {});
  const [weekSupplements, setWeekSupplements] = useKV("week:supplements", {});
  const [weekHabits, setWeekHabits] = useKV("week:habits", {});
  const [demoCleared, setDemoCleared] = useKV("week:demoCleared", false);
  const [activities, setActivities] = useKV("activities:log", {});
  const [profile, setProfile] = useKV("profile:data", PROFILE_SEED);
  const [goalToggles, setGoalToggles] = useKV("goals:toggles", DEFAULT_GOAL_TOGGLES);
  const [customGoals, setCustomGoals] = useKV("goals:custom", []);
  const [metrics, setMetrics] = useKV("reports:metrics", METRICS_SEED);
  const [periods, setPeriods] = useKV("reports:periods", PERIODS_SEED);
  const [supplements, setSupplements] = useKV("supplements:list", SUPPLEMENTS_SEED);
  const [theme, setTheme] = useKV("ui:theme", "dark");
  T = theme === "light" ? T_LIGHT : T_DARK; // apply the chosen palette before this render tree paints
  useEffect(() => { try { document.body.style.background = (theme === "light" ? T_LIGHT : T_DARK).creamDeep; } catch {} }, [theme]);
  TOTAL_SUPPLEMENTS = supplements.length;
  const [customDishes, setCustomDishes] = useKV("dishes:custom", {});
  const [corpusLoaded, setCorpusLoaded] = useState(false);
  useEffect(() => { loadDishCorpus().then(() => setCorpusLoaded(true)); }, []);
  useEffect(() => { loadHealthDB(); loadRulesDB(); }, []);
  // One-time seed of real-looking history (Jul 1 → today). Runs once per SEED_VERSION and
  // never overwrites days that already have real logged data (spread order: seed first, then
  // existing wins). Cleared history is not re-seeded — the flag stays set until they clear it
  // or use "Generate history" in ⚙️ → Data.
  useEffect(() => {
    try {
      if (localStorage.getItem("seed:history") === SEED_VERSION) return;
      const { foodByDate, activitiesByDate, habitsByDate, supplementsByDate } = generateHistory();
      setWeekFood(prev => ({ ...foodByDate, ...prev }));
      setActivities(prev => ({ ...activitiesByDate, ...prev }));
      setWeekHabits(prev => ({ ...habitsByDate, ...prev }));
      setWeekSupplements(prev => ({ ...supplementsByDate, ...prev }));
      localStorage.setItem("seed:history", SEED_VERSION);
    } catch {}
  }, []);
  const saveCustomDish = (key, entry) => setCustomDishes(prev => ({ ...prev, [key]: entry }));

  const foodToday = weekFood[tk] || [];
  const supplementsToday = weekSupplements[tk] || {};
  const habitToday = weekHabits[tk] || {};
  const foodForDate = weekFood[selectedDate] || [];
  const supplementsForDate = weekSupplements[selectedDate] || {};
  const habitsForDate = weekHabits[selectedDate] || {};
  const targets = computeTargets(profile.weight, goalToggles);
  const advice = computeAdvice(metrics, periods, supplements, goalToggles);

  const addFoodEntry = (dateKey, entry) => setWeekFood(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const deleteFoodEntry = (dateKey, index) => setWeekFood(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  const toggleSupplement = (dateKey, id) => setWeekSupplements(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [id]: !(prev[dateKey]?.[id]) } }));
  const toggleHabit = (dateKey, habitId) => setWeekHabits(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [habitId]: !(prev[dateKey]?.[habitId]) } }));
  const clearDemo = () => setDemoCleared(true);
  const addActivity = (dateKey, entry) => setActivities(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const deleteActivity = (dateKey, index) => setActivities(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  const openSettings = (section) => { setSettingsSection(section || "profile"); setSettingsOpen(true); };
  const clearDateData = (dateKey) => {
    setWeekFood(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekSupplements(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekHabits(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setActivities(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
  };
  const clearAllData = () => { setWeekFood({}); setWeekSupplements({}); setWeekHabits({}); setActivities({}); };
  const applyDemoMonth = () => {
    const { foodByDate, activitiesByDate, habitsByDate, supplementsByDate } = generateHistory();
    setWeekFood(prev => ({ ...foodByDate, ...prev }));
    setActivities(prev => ({ ...activitiesByDate, ...prev }));
    setWeekHabits(prev => ({ ...habitsByDate, ...prev }));
    setWeekSupplements(prev => ({ ...supplementsByDate, ...prev }));
    try { localStorage.setItem("seed:history", SEED_VERSION); } catch {}
  };

  // 5-item bar: Today · Plan · ＋(log) · Progress · Me. Food/Activity/Supplement logging is
  // reached through the center ＋. "Progress" shows the health markers/trends (MyHealthTab);
  // "Me" opens Profile & Reports. Nav colours are literals because the bar is always deep teal.
  const NAV = [
    { id: "today", label: "Today", icon: "home" },
    { id: "plan", label: "Plan", icon: "clipboard" },
    { center: true },
    { id: "health", label: "Progress", icon: "activity" },
    { id: "me", label: "Me", icon: "user" },
  ];
  const logOptions = [
    { label: "Food / meal", icon: "food", tab: "food" },
    { label: "Activity", icon: "walk", tab: "habits" },
    { label: "Supplement", icon: "pill", tab: "supplements" },
  ];

  return (
    <div style={{ display: "flex", justifyContent: "center", background: T.creamDeep, minHeight: "100vh" }}>
      <style>{`
        .pulseWrap { animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .askOverlay { position: fixed; inset: 0; background: rgba(38,48,46,0.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
        .askPanel { background: ${T.cream}; width: 100%; max-width: 420px; height: 78vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
        .tabPane { padding: calc(56px + env(safe-area-inset-top, 0px)) 16px 16px; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>
      <div style={{ width: "100%", maxWidth: 420, background: T.cream, minHeight: "100vh", position: "relative", boxShadow: "0 0 40px rgba(0,0,0,0.06)" }}>
        <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Toggle light or dark mode" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 58, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)", fontSize: 16 }}>{theme === "light" ? "🌙" : "☀️"}</button>
        <button onClick={() => openSettings("profile")} aria-label="Profile and reports" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 14, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)" }}><Icon name="settings" size={17} color={T.teal} /></button>
        {tab === "today" && <TodayTab profile={profile} targets={targets} advice={advice} foodToday={foodForDate} habitToday={habitsForDate} supplementsToday={supplementsForDate} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} activities={activities} toggleHabit={toggleHabit} supplements={supplements} onNavigate={setTab} demoCleared={demoCleared} clearDemo={clearDemo} selectedDate={selectedDate} setSelectedDate={setSelectedDate} />}
        {tab === "food" && <FoodCheckTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} foodForDate={foodForDate} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} addFoodEntry={addFoodEntry} deleteFoodEntry={deleteFoodEntry} customDishes={customDishes} saveCustomDish={saveCustomDish} metrics={metrics} periods={periods} targets={targets} advice={advice} />}
        {tab === "health" && <MyHealthTab metrics={metrics} periods={periods} supplementsToday={supplementsToday} toggleSupplement={(id) => toggleSupplement(tk, id)} supplements={supplements} onAddReport={() => openSettings("reports")} advice={advice} />}
        {tab === "habits" && <HabitsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} habitsForDate={habitsForDate} toggleHabit={toggleHabit} weekHabits={weekHabits} weekFood={weekFood} weekSupplements={weekSupplements} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} advice={advice} />}
        {tab === "supplements" && <SupplementsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} supplementsForDate={supplementsForDate} toggleSupplement={toggleSupplement} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} supplements={supplements} advice={advice} />}
        {tab === "plan" && <PlanTab weekFood={weekFood} advice={advice} />}
        <div style={{ position: "fixed", bottom: 0, width: "100%", maxWidth: 420, background: T.tealSolid, display: "flex", alignItems: "center", justifyContent: "space-around", padding: "8px 8px 10px", zIndex: 30 }}>
          {NAV.map((t, i) => {
            if (t.center) return (
              <button key="log" onClick={() => setLogOpen(true)} aria-label="Log something" style={{ flex: "0 0 auto", background: T.saffron, border: "none", width: 52, height: 52, borderRadius: 18, display: "grid", placeItems: "center", cursor: "pointer", marginTop: -22, boxShadow: "0 8px 18px rgba(0,0,0,0.26)" }}>
                <Icon name="plus" size={26} color="#ffffff" />
              </button>
            );
            const active = tab === t.id;
            const col = active ? "#5FE3CE" : "rgba(255,255,255,0.75)";
            const onClick = t.id === "me" ? () => openSettings("profile") : () => setTab(t.id);
            return (
              <button key={t.id} onClick={onClick} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", flex: 1, minWidth: 0 }}>
                <Icon name={t.icon} size={20} color={col} />
                <span style={{ fontFamily: "Inter", fontSize: 10.5, fontWeight: active ? 700 : 500, color: col }}>{t.label}</span>
              </button>
            );
          })}
        </div>
        {logOpen && (
          <div className="askOverlay" onClick={() => setLogOpen(false)}>
            <div onClick={e => e.stopPropagation()} style={{ background: T.cream, width: "100%", maxWidth: 420, borderRadius: "22px 22px 0 0", padding: "12px 16px 26px" }}>
              <div style={{ width: 40, height: 4, borderRadius: 2, background: T.border, margin: "0 auto 14px" }} />
              <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 16, color: T.teal, marginBottom: 12 }}>What do you want to log?</div>
              {logOptions.map(o => (
                <button key={o.tab} onClick={() => { setTab(o.tab); setLogOpen(false); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 13, background: T.white, border: `1px solid ${T.border}`, borderRadius: 14, padding: "14px 15px", marginBottom: 10, cursor: "pointer" }}>
                  <Icon name={o.icon} size={20} color={T.saffron} />
                  <span style={{ fontFamily: "Inter", fontSize: 15, fontWeight: 600, color: T.ink }}>{o.label}</span>
                  <Icon name="chevron" size={16} color={T.inkSoft} style={{ marginLeft: "auto" }} />
                </button>
              ))}
            </div>
          </div>
        )}
        <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} initialSection={settingsSection} profile={profile} saveProfile={setProfile} goalToggles={goalToggles} saveGoalToggles={setGoalToggles} customGoals={customGoals} saveCustomGoals={setCustomGoals} metrics={metrics} saveMetrics={setMetrics} periods={periods} savePeriods={setPeriods} supplements={supplements} saveSupplements={setSupplements} onClearDate={clearDateData} onClearAll={clearAllData} onApplyDemoMonth={applyDemoMonth} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
