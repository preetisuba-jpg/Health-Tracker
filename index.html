function computeTargets(weight, goalToggles) {
  const weightLoss = goalToggles.find(g => g.id === "weightloss")?.active;
  const muscle = goalToggles.find(g => g.id === "muscle")?.active;
  const maintenance = Math.round(weight * 29);
  let calories = maintenance, proteinPerKg = 0.9, note = "maintenance";
  if (weightLoss && !muscle) { calories = maintenance - 400; proteinPerKg = 1.0; note = "mild deficit for fat loss"; }
  else if (muscle && !weightLoss) { calories = maintenance + 200; proteinPerKg = 1.6; note = "surplus + higher protein for muscle gain"; }

  return { calories, protein: Math.round(weight * proteinPerKg), fiber: 30, carbs: weightLoss ? 180 : 220, sugar: 20, note };
}

function metricStatus(value, m) {
  if (value == null) return "untested";
  if (m.low != null && value < m.low) return value < m.low * 0.85 ? "bad" : "watch";
  if (m.high != null && value > m.high) return value > m.high * 1.15 ? "bad" : "watch";
  if (m.idealLow != null && value < m.idealLow) return "watch";
  if (m.idealHigh != null && value > m.idealHigh) return "watch";
  return "good";
}
function rangeLabel(m) { if (m.low != null && m.high != null) return `${m.low}–${m.high}`; if (m.high != null) return `< ${m.high}`; if (m.low != null) return `> ${m.low}`; return "—"; }
function computeTopPriorities(metrics, periods) {
  const latestIdx = periods.length - 1;
  const withStatus = metrics.map(m => { const value = m.points[latestIdx]; return { key: m.key, label: m.label, value, unit: m.unit, status: metricStatus(value, m), target: rangeLabel(m) }; }).filter(m => m.status === "bad" || m.status === "watch");
  withStatus.sort((a, b) => (a.status === "bad" ? 0 : 1) - (b.status === "bad" ? 0 : 1));
  return withStatus.slice(0, 3);
}

  "khichadi": "khichdi", "kichdi": "khichdi", "khichuri": "khichdi",

function normalizeDishName(str) {
  return str
    .toLowerCase()
    .replace(/\s*-\s*(classic|traditional)\s*$/i, "")
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function applyAlias(word) { return DISH_ALIASES[word] || word; }
function normalizeWithAliases(str) {
  return normalizeDishName(str).split(" ").map(applyAlias).join(" ");
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n; if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Fuzzy-match a typed dish name against a set of known keys (curated FOOD_DB / custom
// saved dishes). Returns the matching key, or null. Tolerant of typos, extra spaces,
// "- classic" suffixes, and a handful of known phonetic variants (dosa/dhosa etc).
function fuzzyMatchKey(query, knownKeys) {
  const nq = normalizeWithAliases(query);
  if (knownKeys.includes(nq)) return nq;
  let best = null, bestDist = Infinity;
  for (const key of knownKeys) {
    const nk = normalizeWithAliases(key);
    if (nk === nq) return key;
    const dist = levenshtein(nq, nk);
    const threshold = Math.max(1, Math.floor(Math.min(nq.length, nk.length) * 0.25));
    if (dist <= threshold && dist < bestDist) { best = key; bestDist = dist; }
  }
  return best;
}

// Same idea but against the big read-only name corpus — used to suggest a corrected
// canonical name (e.g. "dhosa" -> "Dosa") to retry against curated data or the API.
function fuzzyMatchCorpus(query, corpus) {
  const nq = normalizeWithAliases(query);
  if (!corpus || !corpus.dishes) return null;
  let best = null, bestDist = Infinity;
  for (const [name] of corpus.dishes) {
    const nk = normalizeWithAliases(name);
    if (nk === nq) return name;
    const dist = levenshtein(nq, nk);
    const threshold = Math.max(1, Math.floor(Math.min(nq.length, nk.length) * 0.2));
    if (dist <= threshold && dist < bestDist) { best = name; bestDist = dist; }
  }
  return best;
}

// Extracts calories/macros from pasted text (e.g. a Google AI Overview reply). Ranges
// like "200 to 415 calories" are averaged to a single midpoint estimate.
function extractNutrientFromText(text, keyword) {
  let m = text.match(new RegExp(keyword + "\\s*[:\\s]*([\\d.]+)\\s*g?\\s*(?:(?:to|-|–|—)\\s*([\\d.]+)\\s*g?)?", "i"));
  if (m) return m[2] ? (parseFloat(m[1]) + parseFloat(m[2])) / 2 : parseFloat(m[1]);
  m = text.match(new RegExp("([\\d.]+)\\s*g\\s*(?:(?:to|-|–|—)\\s*([\\d.]+)\\s*g)?\\s*(?:of\\s+)?" + keyword, "i"));
  if (m) return m[2] ? (parseFloat(m[1]) + parseFloat(m[2])) / 2 : parseFloat(m[1]);
  return null;
}
function extractCaloriesFromText(text) {
  let m = text.match(/([\d.]+)\s*(?:to|-|–|—)\s*([\d.]+)\s*(?:kcal|calories)/i);
  if (m) return Math.round((parseFloat(m[1]) + parseFloat(m[2])) / 2);
  m = text.match(/([\d.]+)\s*(?:kcal|calories)/i);
  if (m) return Math.round(parseFloat(m[1]));
  return null;
}
function parsePastedNutrition(text) {
  return {
    calories: extractCaloriesFromText(text),
    protein: extractNutrientFromText(text, "protein"),
    sugar: extractNutrientFromText(text, "(?:total )?sugars?"),
    carbs: extractNutrientFromText(text, "(?:total )?carbohydrates?"),
    fat: extractNutrientFromText(text, "(?:total )?fat"),
    fiber: extractNutrientFromText(text, "(?:dietary )?fiber"),
  };
}

function dayScore(entries, habitsForDay, supplementsForDay) {
  const mealsCount = entries.length;
  const badMeals = entries.filter(f => f.verdict === "avoid" || f.verdict === "limit").length;
  const goodMeals = mealsCount - badMeals;
  const foodScore = mealsCount === 0 ? 70 : Math.round((goodMeals / mealsCount) * 100);
  const habitsDone = Object.values(habitsForDay || {}).filter(Boolean).length;
  const habitScore = Math.round((habitsDone / HABITS.length) * 100);
  const supplementsDone = Object.values(supplementsForDay || {}).filter(Boolean).length;
  const supScore = Math.round((supplementsDone / SUPPLEMENTS.length) * 100);
  return Math.max(0, Math.min(100, Math.round(foodScore * 0.4 + habitScore * 0.35 + supScore * 0.25)));
}
function hasAnyData(dateKey, weekFood, weekHabits, weekSupplements) {
  return (weekFood[dateKey] || []).length > 0 || Object.keys(weekHabits[dateKey] || {}).length > 0 || Object.keys(weekSupplements[dateKey] || {}).length > 0;
}
function rangeScoreAvg(startOffset, endOffset, weekFood, weekHabits, weekSupplements) {
  let total = 0, count = 0;
  for (let o = startOffset; o <= endOffset; o++) {
    const dk = dateKeyOffset(o);
    if (hasAnyData(dk, weekFood, weekHabits, weekSupplements)) { total += dayScore(weekFood[dk] || [], weekHabits[dk] || {}, weekSupplements[dk] || {}); count++; }
  }
  return count ? Math.round(total / count) : null;
}
function monthScoreAvg(mk, weekFood, weekHabits, weekSupplements) {
  const dates = new Set([...Object.keys(weekFood), ...Object.keys(weekHabits), ...Object.keys(weekSupplements)].filter(dk => dk.startsWith(mk)));
  if (dates.size === 0) return null;
  let total = 0;
  dates.forEach(dk => { total += dayScore(weekFood[dk] || [], weekHabits[dk] || {}, weekSupplements[dk] || {}); });
  return Math.round(total / dates.size);
}

function useKV(key, initial) {
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; } catch { return initial; }
  });
  const save = useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [value, save, true];
}

/* ============================== SIMPLE CUSTOM CHARTS ============================== */
function MiniLineChart({ periods, series, width = 560, height = 220 }) {
  const padL = 34, padB = 24, padT = 10, padR = 10;
  const allVals = series.flatMap(s => s.points.filter(v => v != null));
  const min = Math.min(...allVals, 0), max = Math.max(...allVals, 1);
  const x = (i) => padL + (i / (periods.length - 1)) * (width - padL - padR);
  const y = (v) => padT + (1 - (v - min) / (max - min || 1)) * (height - padT - padB);
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {[0, 0.5, 1].map((f, i) => <line key={i} x1={padL} x2={width - padR} y1={padT + f * (height - padT - padB)} y2={padT + f * (height - padT - padB)} stroke={T.border} strokeWidth="1" />)}
      {periods.map((p, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{p}</text>)}
      {series.map(s => {
        const segments = []; let current = [];
        s.points.forEach((v, i) => { if (v == null) { if (current.length) segments.push(current); current = []; } else current.push([x(i), y(v)]); });
        if (current.length) segments.push(current);
        return segments.map((seg, si) => <polyline key={s.key + si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />);
      })}
      {series.map(s => s.points.map((v, i) => v != null && <circle key={s.key + i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />))}
    </svg>
  );
}
function MiniBarChart({ bars, height = 100 }) {
  const width = 320, padB = 18, padT = 6;
  const max = Math.max(...bars.map(b => Math.abs(b.value)), 1);
  const bw = (width / bars.length) * 0.6;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {bars.map((b, i) => {
        const slot = width / bars.length; const cx = slot * i + slot / 2;
        const h = b.value < 0 ? 6 : Math.max(4, (Math.abs(b.value) / max) * (height - padB - padT));
        return (
          <g key={i}>
            <rect x={cx - bw / 2} y={height - padB - h} width={bw} height={h} rx="3" fill={b.color} opacity={b.opacity ?? 1} />
            <text x={cx} y={height - 4} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{b.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function FoodCheckTab({ selectedDate, setSelectedDate, foodForDate, weekFood, activities, weekSupplements, addFoodEntry, deleteFoodEntry, customDishes, saveCustomDish, onOpenAsk }) {

  const [pasteText, setPasteText] = useState("");

  async function checkDish(dish) {
    setResult(null); setWarning(null); setNotFound(null); setManualVerdict(null); setManualCals(""); setPasteText(""); setPastePreview(null); setCorrectedFrom(null);
    const raw = dish.trim();

    // 1. Curated FOOD_DB, exact or fuzzy (typo-tolerant)
    const foodKeys = Object.keys(FOOD_DB);
    const matchedFoodKey = fuzzyMatchKey(raw, foodKeys);
    if (matchedFoodKey) {
      const entry = FOOD_DB[matchedFoodKey];
      if (normalizeWithAliases(matchedFoodKey) !== normalizeWithAliases(raw)) setCorrectedFrom(matchedFoodKey);
      setResult({ dish: matchedFoodKey, ...entry, healthierTip: entry.healthierTip || suggestSwap(matchedFoodKey) });
      return;
    }

    // 2. Your own saved dishes (from past pastes), exact or fuzzy
    const customKeys = Object.keys(customDishes);
    const matchedCustomKey = fuzzyMatchKey(raw, customKeys);
    if (matchedCustomKey) {
      const entry = customDishes[matchedCustomKey];
      if (normalizeWithAliases(matchedCustomKey) !== normalizeWithAliases(raw)) setCorrectedFrom(matchedCustomKey);
      setResult({ dish: matchedCustomKey, ...entry, lookedUp: true, source: "your saved dishes" });
      return;
    }

    // 3. Correct against the 5,200-name spelling corpus, then retry the free API with the cleaned-up name
    setLookingUp(true);
    const corpus = await loadDishCorpus();
    const corrected = fuzzyMatchCorpus(raw, corpus);
    const queryForApi = corrected || raw;
    const data = await lookupNutrition(queryForApi);
    setLookingUp(false);
    if (data) {
      const verdict = classifyMacros(queryForApi, data);
      if (corrected && normalizeWithAliases(corrected) !== normalizeWithAliases(raw)) setCorrectedFrom(corrected);
      setResult({
        dish: corrected || raw, verdict,
        calories: data.calories != null ? Math.round(data.calories) : null,
        protein: data.protein != null ? Math.round(data.protein) : null,
        fiber: data.fiber != null ? Math.round(data.fiber) : null,
        carbs: data.carbs != null ? Math.round(data.carbs) : null,
        sugar: data.sugar != null ? Math.round(data.sugar) : null,
        portion: data.servingDesc || "as typically served",
        reason: `Estimated from ${data.source || "nutrition database"} data for ${data.servingDesc || "a standard serving"} — verdict is a rules-based estimate, not a clinical judgment.`,
        marker: null, weeklyLimit: null,
        healthierTip: suggestSwap(corrected || raw),
        lookedUp: true, source: data.source,
      });
    } else {
      setNotFound(corrected || raw);
    }
  }

  function parsePaste() {
    const parsed = parsePastedNutrition(pasteText);
    setPastePreview(parsed);
  }
  function saveAndLogPasted() {
    if (!pastePreview) return;
    const verdict = classifyMacros(notFound, pastePreview);
    const entry = {
      verdict, calories: pastePreview.calories, protein: pastePreview.protein, fiber: pastePreview.fiber,
      carbs: pastePreview.carbs, sugar: pastePreview.sugar, portion: "as typically served (1 person)",
      reason: "Saved from pasted nutrition info — averaged from the ranges you provided.",
      marker: null, weeklyLimit: null, healthierTip: suggestSwap(notFound),
    };
    const key = normalizeWithAliases(notFound);
    saveCustomDish(key, entry);
    addFoodEntry(selectedDate, { dish: notFound, ...entry, mealSlot, time: Date.now() });
    setNotFound(null); setPasteText(""); setPastePreview(null); setQuery("");
  }
  function meta(v) { return VERDICT_META[v] || VERDICT_META.moderate; }
  function weeklyCountFor(dishName) {
    const key = dishName.trim().toLowerCase(); let count = 0;
    for (let offset = 0; offset <= 6; offset++) { const dk = dateKeyOffset(offset); const entries = weekFood[dk] || []; count += entries.filter(e => e.dish.trim().toLowerCase() === key).length; }
    return count;

    addFoodEntry(selectedDate, entry);
    const countAfter = weeklyCountFor(result.dish) + 1;
    if (result.weeklyLimit != null && countAfter > result.weeklyLimit) setWarning(`⚠️ This is your ${countAfter}${countAfter === 1 ? "st" : countAfter === 2 ? "nd" : countAfter === 3 ? "rd" : "th"} "${result.dish}" this week — recommended cap is ${result.weeklyLimit}/week.`);
    else if (mealSlot === "After Dinner" && (result.verdict === "limit" || result.verdict === "avoid")) setWarning(`Post-dinner + ${meta(result.verdict).label.toLowerCase()} — flagged habit pattern. Small portion or skip tonight.`);
    else { setWarning(null); setResult(null); setQuery(""); }

function ActivityLog({ selectedDate, activities, addActivity, deleteActivity }) {
  const [type, setType] = useState("Walk");
  const [duration, setDuration] = useState("");
  function add() { const mins = parseInt(duration, 10); if (!mins || mins <= 0) return; addActivity(selectedDate, { type, duration: mins, time: Date.now() }); setDuration(""); }
  const allEntries = Object.keys(activities).sort((a, b) => b.localeCompare(a)).flatMap(dk => (activities[dk] || []).map((e, idx) => ({ ...e, dateKey: dk, idx }))).sort((a, b) => b.time - a.time).slice(0, 10);
  const byMonth = summarizeActivitiesByMonth(activities);
  const now = new Date(); const curMk = now.toISOString().slice(0, 7);
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1); const prevMk = prevDate.toISOString().slice(0, 7);
  const daysElapsedThisMonth = now.getDate(); const daysInPrevMonth = daysInMonth(prevDate.getFullYear(), prevDate.getMonth());
  const curStats = byMonth[curMk]; const prevStats = byMonth[prevMk];
  const curPct = curStats ? Math.round((curStats.activeDays.size / daysElapsedThisMonth) * 100) : 0;
  const prevPct = prevStats ? Math.round((prevStats.activeDays.size / daysInPrevMonth) * 100) : null;
  return (
    <>
      <SectionLabel>Activity log — {formatDateLabel(selectedDate)}</SectionLabel>
      <Card>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>{ACTIVITY_TYPES.map(t => <button key={t} onClick={() => setType(t)} style={{ background: type === t ? T.teal : T.creamDeep, color: type === t ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12 }}>{t}</button>)}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={duration} onChange={e => setDuration(e.target.value.replace(/\D/g, ""))} placeholder="Minutes" inputMode="numeric" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
          <button onClick={add} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "0 16px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Add</button>
        </div>
      </Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Recent activity</SectionLabel>
      <Card>{allEntries.length === 0 ? <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Nothing logged yet.</div> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{allEntries.map((e, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: "Inter", fontSize: 13 }}>{e.type}</span>
            <span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, flex: 1, textAlign: "right" }}>{e.duration} min · {e.dateKey === todayKey() ? "Today" : formatDateLabel(e.dateKey)}</span>
            <DeleteBtn onClick={() => deleteActivity(e.dateKey, e.idx)} />
          </div>
        ))}</div>
      )}</Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Monthly summary</SectionLabel>
      <Card>
        <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, marginBottom: 6 }}>{monthLabel(curMk)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{curPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{curStats ? curStats.activeDays.size : 0} active days of {daysElapsedThisMonth} so far{curStats ? ` · ${curStats.totalMinutes} min total` : ""}</div>
        </div>
        {prevPct !== null ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginTop: 6 }}>
            <Icon name={curPct >= prevPct ? "trendUp" : "trendDown"} size={14} color={curPct >= prevPct ? T.forest : T.alert} /> vs {prevPct}% in {monthLabel(prevMk)}
          </div>
        ) : <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>No data yet for {monthLabel(prevMk)} to compare.</div>}
      </Card>
      <div style={{ height: 18 }} />
    </>
  );
}

function HabitsTab({ selectedDate, setSelectedDate, habitsForDate, toggleHabit, weekHabits, weekFood, weekSupplements, activities, addActivity, deleteActivity, onOpenAsk }) {
  const dates = last7Dates();
  const [calendarOpen, setCalendarOpen] = useState(false);
  function streakFor(habitId) { let streak = 0; for (let i = dates.length - 1; i >= 0; i--) { const d = dates[i]; const key = d.toISOString().slice(0, 10); if (isSunday(d)) continue; if (weekHabits[key]?.[habitId]) streak++; else break; } return streak; }
  const weekBars = dates.map(d => { const key = d.toISOString().slice(0, 10); if (isSunday(d)) return { label: dayLabel(d), value: 0.3, color: T.creamDeep }; const done = HABITS.filter(h => weekHabits[key]?.[h.id]).length; return { label: dayLabel(d), value: done || 0.3, color: done >= HABITS.length - 1 ? T.forest : done >= HABITS.length / 2 ? T.amber : T.alert }; });
  const totalPossible = dates.filter(d => !isSunday(d)).length * HABITS.length;
  const totalDone = dates.reduce((sum, d) => { if (isSunday(d)) return sum; const key = d.toISOString().slice(0, 10); return sum + HABITS.filter(h => weekHabits[key]?.[h.id]).length; }, 0);
  const weekPct = totalPossible === 0 ? 0 : Math.round((totalDone / totalPossible) * 100);
  const selDate = new Date(selectedDate + "T00:00:00");
  const selIsSunday = isSunday(selDate);

  return (

      <div style={{ height: 18 }} />
      <ActivityLog selectedDate={selectedDate} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} />
      <SectionLabel>Last 7 days — overview ({dates[0].toLocaleDateString("en-IN", { day: "numeric", month: "short" })} – {dates[6].toLocaleDateString("en-IN", { day: "numeric", month: "short" })})</SectionLabel>

function AskPanel({ open, onClose, customDishes }) {
  const [messages, setMessages] = useState([{ role: "assistant", text: "Ask me anything — \"Can I eat this?\", \"Is X safe with my liver?\", \"What happens if I skip Omega-3?\"" }]);
  const [input, setInput] = useState(""); const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);
  function send() {
    const text = input.trim(); if (!text) return;
    setInput(""); setMessages(m => [...m, { role: "user", text }]);
    const answer = localAnswer(text, customDishes);
    if (answer) {
      setMessages(m => [...m, { role: "assistant", text: answer }]);
    } else {
      setMessages(m => [...m, { role: "assistant", text: "That's not one of the pre-loaded topics — tap below to search it with his health context included.", searchUrl: contextSearchUrl(text) }]);
    }
  }
  if (!open) return null;
  return (
    <div className="askOverlay" onClick={onClose}>
      <div className="askPanel" onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", borderBottom: `1px solid ${T.border}` }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: T.teal }}>Ask about anything</div><button onClick={onClose} style={{ background: "none", border: "none" }}><Icon name="x" size={20} color={T.inkSoft} /></button></div>
        <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          {messages.map((m, i) => (
            <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", background: m.role === "user" ? T.saffron : T.tealPale, color: m.role === "user" ? T.white : T.ink, padding: "10px 13px", borderRadius: 14, maxWidth: "85%", fontFamily: "Inter", fontSize: 13.5, lineHeight: 1.45 }}>
              {m.text}
              {m.searchUrl && (
                <div style={{ marginTop: 8 }}>
                  <a href={m.searchUrl} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 5, color: T.saffronDeep, fontFamily: "Manrope", fontWeight: 700, fontSize: 12, textDecoration: "none" }}>
                    Search online <Icon name="external" size={12} color={T.saffronDeep} />
                  </a>
                </div>
              )}
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, padding: 12, borderTop: `1px solid ${T.border}` }}>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder="Type your question…" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "10px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
          <button onClick={send} style={{ background: T.teal, border: "none", borderRadius: 10, width: 42, display: "flex", alignItems: "center", justifyContent: "center" }}><Icon name="send" size={16} color={T.white} /></button>
        </div>
      </div>
    </div>
  );
}

              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>OTHER GOALS</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                {customGoals.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft }}>None added yet.</div>}
                {customGoals.map(g => <div key={g.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.creamDeep, borderRadius: 10, padding: "8px 10px" }}><span style={{ fontFamily: "Inter", fontSize: 13 }}>{g.label}</span><button onClick={() => removeCustomGoal(g.id)} style={{ background: "none", border: "none" }}><Icon name="x" size={14} color={T.inkSoft} /></button></div>)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newGoalText} onChange={e => setNewGoalText(e.target.value)} placeholder="e.g. Improve sleep" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13 }} />
                <button onClick={addCustomGoal} style={{ background: T.teal, border: "none", borderRadius: 10, padding: "0 14px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Add</button>
              </div>
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginTop: 10 }}>Marker-based priorities update automatically from your latest report.</div>
            </div>
          )}
          {section === "reports" && (
            <div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>REPORT HISTORY</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>{periods.map(p => <Badge key={p} bg={T.tealPale} fg={T.teal}>{p}</Badge>)}</div>
              {!addingReport ? <button onClick={() => setAddingReport(true)} style={{ width: "100%", background: T.saffron, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>+ Add new report</button> : (
                <div>
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 4 }}>Period label (e.g. "Jan 2027")</div>
                  <input value={newPeriodLabel} onChange={e => setNewPeriodLabel(e.target.value)} style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5, marginBottom: 12 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginBottom: 6 }}>Enter new values — leave blank if not tested</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>{metrics.map(m => (
                    <div key={m.key} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ flex: 1, fontFamily: "Inter", fontSize: 12.5 }}>{m.label}</span>
                      <input value={newValues[m.key] ?? ""} onChange={e => setNewValues({ ...newValues, [m.key]: e.target.value.replace(/[^0-9.]/g, "") })} placeholder={m.unit} inputMode="decimal" style={{ width: 80, border: `1px solid ${T.border}`, borderRadius: 8, padding: "6px 8px", fontFamily: "Inter", fontSize: 13 }} />
                    </div>
                  ))}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setAddingReport(false)} style={{ flex: 1, background: T.creamDeep, border: "none", borderRadius: 10, padding: "9px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 13, color: T.ink }}>Cancel</button>
                    <button onClick={submitNewReport} style={{ flex: 1, background: T.teal, border: "none", borderRadius: 10, padding: "9px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Save report</button>
                  </div>
                </div>
              )}
              <div style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, marginTop: 14, lineHeight: 1.5 }}>Manual entry only — this app can't read an uploaded PDF/Excel file itself.</div>
            </div>
          )}
          {section === "data" && (
            <div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR A SPECIFIC DATE</div>
              <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 8 }}>Removes food, activity, habit, and supplement entries for one day only.</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                <input type="date" value={clearDateVal} max={todayKey()} onChange={e => setClearDateVal(e.target.value)} style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
                <button onClick={() => onClearDate(clearDateVal)} style={{ background: T.alert, border: "none", borderRadius: 10, padding: "0 14px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Clear</button>
              </div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR EVERYTHING</div>
              <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 8 }}>Deletes all food, activity, habit, and supplement history permanently. Profile, goals, and report history are not affected.</div>
              {!confirmingClearAll ? (
                <button onClick={() => setConfirmingClearAll(true)} style={{ width: "100%", background: T.alertPale, border: `1px solid ${T.alert}`, borderRadius: 10, padding: "10px 0", color: T.alert, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Clear all history</button>
              ) : (
                <div style={{ background: T.alertPale, borderRadius: 10, padding: 12 }}>
                  <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.ink, marginBottom: 10 }}>This can't be undone. Delete every logged day permanently?</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setConfirmingClearAll(false)} style={{ flex: 1, background: T.white, border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Cancel</button>
                    <button onClick={() => { onClearAll(); setConfirmingClearAll(false); }} style={{ flex: 1, background: T.alert, border: "none", borderRadius: 8, padding: "8px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Yes, delete everything</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function App() {
  const [tab, setTab] = useState("today");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [askOpen, setAskOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsSection, setSettingsSection] = useState("profile");
  const tk = todayKey();

  const [weekFood, setWeekFood] = useKV("week:foodlog", {});
  const [weekSupplements, setWeekSupplements] = useKV("week:supplements", {});
  const [weekHabits, setWeekHabits] = useKV("week:habits", {});
  const [demoCleared, setDemoCleared] = useKV("week:demoCleared", false);
  const [activities, setActivities] = useKV("activities:log", {});
  const [profile, setProfile] = useKV("profile:data", PROFILE_SEED);
  const [goalToggles, setGoalToggles] = useKV("goals:toggles", DEFAULT_GOAL_TOGGLES);
  const [customGoals, setCustomGoals] = useKV("goals:custom", []);
  const [metrics, setMetrics] = useKV("reports:metrics", METRICS_SEED);
  const [periods, setPeriods] = useKV("reports:periods", PERIODS_SEED);
  const [customDishes, setCustomDishes] = useKV("dishes:custom", {});
  const [corpusLoaded, setCorpusLoaded] = useState(false);
  useEffect(() => { loadDishCorpus().then(() => setCorpusLoaded(true)); }, []);
  const saveCustomDish = (key, entry) => setCustomDishes(prev => ({ ...prev, [key]: entry }));

  const foodToday = weekFood[tk] || [];
  const supplementsToday = weekSupplements[tk] || {};
  const habitToday = weekHabits[tk] || {};
  const foodForDate = weekFood[selectedDate] || [];
  const supplementsForDate = weekSupplements[selectedDate] || {};
  const habitsForDate = weekHabits[selectedDate] || {};
  const targets = computeTargets(profile.weight, goalToggles);

  const addFoodEntry = (dateKey, entry) => setWeekFood(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const deleteFoodEntry = (dateKey, index) => setWeekFood(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  const toggleSupplement = (dateKey, id) => setWeekSupplements(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [id]: !(prev[dateKey]?.[id]) } }));
  const toggleHabit = (dateKey, habitId) => setWeekHabits(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [habitId]: !(prev[dateKey]?.[habitId]) } }));
  const clearDemo = () => setDemoCleared(true);
  const addActivity = (dateKey, entry) => setActivities(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const deleteActivity = (dateKey, index) => setActivities(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  const openSettings = (section) => { setSettingsSection(section || "profile"); setSettingsOpen(true); };
  const clearDateData = (dateKey) => {
    setWeekFood(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekSupplements(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekHabits(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setActivities(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
  };
  const clearAllData = () => { setWeekFood({}); setWeekSupplements({}); setWeekHabits({}); setActivities({}); };

  const TABS = [
    { id: "today", label: "Today", icon: "home" },
    { id: "food", label: "Food Check", icon: "food" },
    { id: "health", label: "My Health", icon: "activity" },
    { id: "habits", label: "Habits", icon: "calendar" },
    { id: "supplements", label: "Plan", icon: "pill" },
  ];

  return (
    <div style={{ display: "flex", justifyContent: "center", background: T.creamDeep, minHeight: "100vh" }}>
      <style>{`
        .pulseWrap { animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .fab { position: fixed; bottom: 78px; right: calc(50% - 190px); background: ${T.saffron}; border: none; border-radius: 999px; padding: 12px 18px; display: flex; align-items: center; gap: 7px; box-shadow: 0 6px 18px rgba(232,133,61,0.45); cursor: pointer; z-index: 20; }
        @media (max-width: 460px) { .fab { right: 16px; } }
        .askOverlay { position: fixed; inset: 0; background: rgba(38,48,46,0.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
        .askPanel { background: ${T.cream}; width: 100%; max-width: 420px; height: 78vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
        .tabPane { padding: calc(56px + env(safe-area-inset-top, 0px)) 16px 16px; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>
      <div style={{ width: "100%", maxWidth: 420, background: T.cream, minHeight: "100vh", position: "relative", boxShadow: "0 0 40px rgba(0,0,0,0.06)" }}>
        <button onClick={() => openSettings("profile")} aria-label="Profile and reports" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 14, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)" }}><Icon name="settings" size={17} color={T.teal} /></button>
        {tab === "today" && <TodayTab profile={profile} targets={targets} foodToday={foodToday} habitToday={habitToday} supplementsToday={supplementsToday} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} toggleHabit={toggleHabit} onOpenAsk={() => setAskOpen(true)} onNavigate={setTab} demoCleared={demoCleared} clearDemo={clearDemo} />}
        {tab === "food" && <FoodCheckTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} foodForDate={foodForDate} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} addFoodEntry={addFoodEntry} deleteFoodEntry={deleteFoodEntry} customDishes={customDishes} saveCustomDish={saveCustomDish} onOpenAsk={() => setAskOpen(true)} />}
        {tab === "health" && <MyHealthTab metrics={metrics} periods={periods} supplementsToday={supplementsToday} toggleSupplement={(id) => toggleSupplement(tk, id)} onOpenAsk={() => setAskOpen(true)} onAddReport={() => openSettings("reports")} />}
        {tab === "habits" && <HabitsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} habitsForDate={habitsForDate} toggleHabit={toggleHabit} weekHabits={weekHabits} weekFood={weekFood} weekSupplements={weekSupplements} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} onOpenAsk={() => setAskOpen(true)} />}
        {tab === "supplements" && <SupplementsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} supplementsForDate={supplementsForDate} toggleSupplement={toggleSupplement} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} onOpenAsk={() => setAskOpen(true)} />}
        <div style={{ position: "fixed", bottom: 0, width: "100%", maxWidth: 420, background: T.teal, display: "flex", justifyContent: "space-around", padding: "10px 4px 12px", zIndex: 30 }}>
          {TABS.map(t => { const active = tab === t.id; return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, opacity: active ? 1 : 0.6, cursor: "pointer" }}>
              <Icon name={t.icon} size={20} color={active ? T.saffron : T.white} />
              <span style={{ fontFamily: "Inter", fontSize: 10, fontWeight: active ? 700 : 500, color: T.white }}>{t.label}</span>
            </button>
          ); })}
        </div>
        <AskPanel open={askOpen} onClose={() => setAskOpen(false)} customDishes={customDishes} />
        <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} initialSection={settingsSection} profile={profile} saveProfile={setProfile} goalToggles={goalToggles} saveGoalToggles={setGoalToggles} customGoals={customGoals} saveCustomGoals={setCustomGoals} metrics={metrics} saveMetrics={setMetrics} periods={periods} savePeriods={setPeriods} onClearDate={clearDateData} onClearAll={clearAllData} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
