      <div style={{ height: 18 }} />
      <SectionLabel>Trend — {periods[0]} to {periods[periods.length - 1]}</SectionLabel>
      <Card>
        <div style={{ width: "100%", overflowX: "auto" }}><div style={{ minWidth: 520 }}>
          <MiniLineChart periods={periods} series={metrics.filter(m => ["chol", "ldl", "tg", "hdl", "ggt"].includes(m.key)).map(m => ({ key: m.key, points: m.points, color: m.color }))} />
        </div></div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 8 }}>{metrics.filter(m => ["chol", "ldl", "tg", "hdl", "ggt"].includes(m.key)).map(m => (
          <div key={m.key} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 3, background: m.color, display: "inline-block" }} /><span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{m.label}</span></div>
        ))}</div>
        <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>Gaps mean the marker wasn't tested that period.</div>
      </Card>
      <div style={{ height: 18 }} />
      <SectionLabel>Supplement tracker — today</SectionLabel>
      <Card><div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{supplements.map(s => (
        <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
          <button onClick={() => toggleSupplement(s.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${supplementsToday[s.id] ? T.forest : T.border}`, background: supplementsToday[s.id] ? T.forest : T.white, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{supplementsToday[s.id] && <Icon name="check" size={14} color={T.white} />}</button>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 600, textDecoration: supplementsToday[s.id] ? "line-through" : "none", color: supplementsToday[s.id] ? T.inkSoft : T.ink }}>{s.name} {s.isNew && <Badge bg={T.amberPale} fg={T.amber}>NEW</Badge>}</div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft }}>{s.dose} · {s.timeLabel}</div>
          </div>
        </div>
      ))}</div></Card>
      <div style={{ height: 18 }} />
      <SectionLabel>What to test next</SectionLabel>
      <Card>{advice.testNext.map((t, i) => <div key={i} style={{ display: "flex", gap: 8, marginBottom: i === advice.testNext.length - 1 ? 0 : 8 }}><Icon name="alert" size={14} color={T.amber} style={{ flexShrink: 0, marginTop: 2 }} /><span style={{ fontFamily: "Inter", fontSize: 13, lineHeight: 1.4 }}>{t}</span></div>)}</Card>
      <div style={{ height: 90 }} />
      {calendarOpen && <CalendarPicker selectedDate={selectedDate} onSelect={setSelectedDate} onClose={() => setCalendarOpen(false)} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} />}
    </div>
  );
}

/* ============================== TAB 4: HABITS ============================== */
function ActivityLog({ selectedDate, activities, addActivity, deleteActivity }) {
  const [type, setType] = useState("Walk");
  const [duration, setDuration] = useState("");
  function add() { const mins = parseInt(duration, 10); if (!mins || mins <= 0) return; addActivity(selectedDate, { type, duration: mins, time: Date.now() }); setDuration(""); }
  const allEntries = Object.keys(activities).sort((a, b) => b.localeCompare(a)).flatMap(dk => (activities[dk] || []).map((e, idx) => ({ ...e, dateKey: dk, idx }))).sort((a, b) => b.time - a.time).slice(0, 10);
  const byMonth = summarizeActivitiesByMonth(activities);
  const selD = new Date(selectedDate + "T00:00:00");
  const curMk = ym(selD);
  const prevD = new Date(selD.getFullYear(), selD.getMonth() - 1, 1); const prevMk = ym(prevD);
  const isCurRealMonth = curMk === ym(new Date());
  const daysElapsedThisMonth = isCurRealMonth ? new Date().getDate() : daysInMonth(selD.getFullYear(), selD.getMonth());
  const daysInPrevMonth = daysInMonth(prevD.getFullYear(), prevD.getMonth());
  const curStats = byMonth[curMk]; const prevStats = byMonth[prevMk];
  const curPct = curStats ? Math.round((curStats.activeDays.size / daysElapsedThisMonth) * 100) : 0;
  const prevPct = prevStats ? Math.round((prevStats.activeDays.size / daysInPrevMonth) * 100) : null;
  const minFn = (k) => activeMinValue(k, activities);
  const monActThis = monthWeekSeries(curMk, minFn);
  const monActLast = monthWeekSeries(prevMk, minFn);
  const monActLen = Math.max(monActThis.length, monActLast.length, 1);
  const monActPad = (arr) => arr.concat(Array(Math.max(0, monActLen - arr.length)).fill(null));
  const monActLabels = Array.from({ length: monActLen }, (_, i) => `W${i + 1}`);
  return (
    <>
      <SectionLabel>Activity log — {formatDateLabel(selectedDate)}</SectionLabel>
      <Card>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>{ACTIVITY_TYPES.map(t => <button key={t} onClick={() => setType(t)} style={{ background: type === t ? T.teal : T.creamDeep, color: type === t ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12 }}>{t}</button>)}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={duration} onChange={e => setDuration(e.target.value.replace(/\D/g, ""))} placeholder="Minutes" inputMode="numeric" style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
          <button onClick={add} style={{ background: T.saffron, border: "none", borderRadius: 10, padding: "0 16px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Add</button>
        </div>
      </Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Recent activity</SectionLabel>
      <Card>{allEntries.length === 0 ? <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Nothing logged yet.</div> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{allEntries.map((e, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: "Inter", fontSize: 13 }}>{e.type}</span>
            <span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, flex: 1, textAlign: "right" }}>{e.duration} min · ~{activityCalories(e.type, e.duration)} kcal · {e.dateKey === todayKey() ? "Today" : formatDateLabel(e.dateKey)}</span>
            <DeleteBtn onClick={() => deleteActivity(e.dateKey, e.idx)} />
          </div>
        ))}</div>
      )}</Card>
      <div style={{ height: 12 }} />
      <SectionLabel>Monthly summary — {monthLabel(curMk)}</SectionLabel>
      <Card>
        <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13, marginBottom: 6 }}>{monthLabel(curMk)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{curPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{curStats ? curStats.activeDays.size : 0} active days of {daysElapsedThisMonth}{isCurRealMonth ? " so far" : ""}{curStats ? ` · ${curStats.totalMinutes} min total` : ""}</div>
        </div>
        {prevPct !== null ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginTop: 6 }}>
            <Icon name={curPct >= prevPct ? "trendUp" : "trendDown"} size={14} color={curPct >= prevPct ? T.forest : T.alert} /> vs {prevPct}% in {monthLabel(prevMk)}
          </div>
        ) : <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>No data yet for {monthLabel(prevMk)} to compare.</div>}
        {(monActThis.some(v => v != null) || monActLast.some(v => v != null)) && (
          <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Active minutes per week — {monthLabel(curMk)} vs {monthLabel(prevMk)}</div>
            <div style={{ minWidth: 480 }}>
              <TwoLineChart labels={monActLabels} a={monActPad(monActThis)} b={monActPad(monActLast)} aLabel={monthLabel(curMk)} bLabel={monthLabel(prevMk)} unit="m" height={170} />
            </div>
          </div>
        )}
      </Card>
      <div style={{ height: 18 }} />
    </>
  );
}

function HabitsTab({ selectedDate, setSelectedDate, habitsForDate, toggleHabit, weekHabits, weekFood, weekSupplements, activities, addActivity, deleteActivity, advice }) {
  const [calendarOpen, setCalendarOpen] = useState(false);
  const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(selectedDate);
  const dates = thisWeekKeys.map(k => new Date(k + "T00:00:00"));
  function streakFor(habitId) { let streak = 0; for (let i = dates.length - 1; i >= 0; i--) { const d = dates[i]; const key = ymd(d); if (isSunday(d)) continue; if (weekHabits[key]?.[habitId]) streak++; else break; } return streak; }
  const weekBars = dates.map(d => { const key = ymd(d); if (isSunday(d)) return { label: dayLabel(d), value: 0.3, color: T.creamDeep }; const done = HABITS.filter(h => weekHabits[key]?.[h.id]).length; return { label: dayLabel(d), value: done || 0.3, color: done >= HABITS.length - 1 ? T.forest : done >= HABITS.length / 2 ? T.amber : T.alert }; });
  const totalPossible = dates.filter(d => !isSunday(d)).length * HABITS.length;
  const totalDone = dates.reduce((sum, d) => { if (isSunday(d)) return sum; const key = ymd(d); return sum + HABITS.filter(h => weekHabits[key]?.[h.id]).length; }, 0);
  const weekPct = totalPossible === 0 ? 0 : Math.round((totalDone / totalPossible) * 100);
  const selDate = new Date(selectedDate + "T00:00:00");
  const selIsSunday = isSunday(selDate);
  const habitHl = habitHeadline(thisWeekKeys, lastWeekKeys, activities, weekHabits, advice.cardioMarkerLabel);
  const weekLabels = thisWeekKeys.map(dowShort);
  const weekHabitThis = thisWeekKeys.map(k => habitPctValue(k, weekHabits));
  const weekHabitLast = lastWeekKeys.map(k => habitPctValue(k, weekHabits));

  return (
    <div className="tabPane">
      <DateBar selectedDate={selectedDate} onOpenCalendar={() => setCalendarOpen(true)} onBackToToday={() => setSelectedDate(todayKey())} />
      {habitHl && <><InsightCallout insight={habitHl} icon="walk" /><div style={{ height: 14 }} /></>}
      <SectionLabel>Habits — {formatDateLabel(selectedDate)}</SectionLabel>
      <Card>
        {selIsSunday ? (
          <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>Sunday — rest day, no tracking needed.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{HABITS.map(h => (
            <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
              <button onClick={() => toggleHabit(selectedDate, h.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${habitsForDate[h.id] ? T.forest : T.border}`, background: habitsForDate[h.id] ? T.forest : T.white, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{habitsForDate[h.id] && <Icon name="check" size={14} color={T.white} />}</button>
              <span style={{ fontFamily: "Inter", fontSize: 13.5 }}>{h.label}</span>
            </div>
          ))}</div>
        )}
      </Card>
      <div style={{ height: 18 }} />
      <ActivityLog selectedDate={selectedDate} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} />
      <SectionLabel>7-day overview ({dates[0].toLocaleDateString("en-IN", { day: "numeric", month: "short" })} – {dates[6].toLocaleDateString("en-IN", { day: "numeric", month: "short" })})</SectionLabel>
      <Card>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 480 }}>
            <thead><tr><th></th>{dates.map((d, i) => {
              const key = ymd(d);
              const isToday = key === todayKey();
              return (
                <th key={i} style={{ fontFamily: "Manrope", fontWeight: isToday ? 800 : 700, fontSize: 12, color: isToday ? T.saffronDeep : T.inkSoft, paddingBottom: 8 }}>
                  <div>{dayLabel(d)}</div>
                  <div style={{ fontSize: 13, marginTop: 1 }}>{d.getDate()}</div>
                </th>
              );
            })}</tr></thead>
            <tbody>{HABITS.map(h => (
              <tr key={h.id}>
                <td style={{ fontFamily: "Inter", fontSize: 12.5, paddingRight: 8, whiteSpace: "nowrap" }}>{h.label}</td>
                {dates.map((d, i) => {
                  const key = ymd(d); const rest = isSunday(d); const done = weekHabits[key]?.[h.id];
                  return <td key={i} style={{ textAlign: "center", padding: 3 }}><button onClick={() => !rest && setSelectedDate(key)} style={{ width: 26, height: 26, borderRadius: 7, border: key === selectedDate ? `2px solid ${T.saffron}` : `1px solid ${T.border}`, background: rest ? T.creamDeep : done ? T.forest : "rgba(200,90,70,0.16)", cursor: rest ? "default" : "pointer" }} /></td>;
                })}
              </tr>
            ))}</tbody>
          </table>
        </div>
        <div style={{ display: "flex", gap: 12, marginTop: 12, fontFamily: "Inter", fontSize: 12, color: T.inkSoft, flexWrap: "wrap" }}>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: T.forest, borderRadius: 3, marginRight: 4 }} />Done</span>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: "rgba(200,90,70,0.16)", border: `1px solid ${T.border}`, borderRadius: 3, marginRight: 4 }} />Missed</span>
          <span><span style={{ display: "inline-block", width: 10, height: 10, background: T.creamDeep, borderRadius: 3, marginRight: 4 }} />Sunday</span>
        </div>
        <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>Tap any day to jump the whole tab to that date, or use the calendar above for further back.</div>
      </Card>
      <div style={{ height: 14 }} />
      <SectionLabel>Streaks</SectionLabel>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{HABITS.map(h => (
        <Card key={h.id} style={{ flex: "1 1 45%", textAlign: "center", padding: 12 }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20, color: T.saffronDeep }}>{streakFor(h.id)}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{h.label}</div></Card>
      ))}</div>
      <div style={{ height: 14 }} />
      <SectionLabel>Weekly score</SectionLabel>
      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 26 }}>{weekPct}%</div>
          <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft, textAlign: "right", maxWidth: 220 }}>{weekPct >= 80 ? "Strong week — keep going." : weekPct >= 50 ? "Halfway there." : "Needs work."}</div>
        </div>
        <MiniBarChart bars={weekBars} />
        {(weekHabitThis.some(v => v != null) || weekHabitLast.some(v => v != null)) && (
          <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Habits completed per day (%) — this week vs last week</div>
            <div style={{ minWidth: 480 }}>
              <TwoLineChart labels={weekLabels} a={weekHabitThis} b={weekHabitLast} aLabel="This week" bLabel="Last week" yMax={100} unit="%" height={170} />
            </div>
          </div>
        )}
      </Card>
      <div style={{ height: 90 }} />
      {calendarOpen && <CalendarPicker selectedDate={selectedDate} onSelect={setSelectedDate} onClose={() => setCalendarOpen(false)} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} />}
    </div>
  );
}

/* ============================== TAB 5: PLAN ============================== */
function SupplementsTab({ selectedDate, setSelectedDate, supplementsForDate, toggleSupplement, weekFood, activities, weekSupplements, supplements, advice, suggestedSupps, onAddSupplement }) {
  const [calendarOpen, setCalendarOpen] = useState(false);
  const groups = [{ key: "morning", label: "🌅 Morning" }, { key: "afternoon", label: "☀️ After lunch" }, { key: "evening", label: "🌆 Evening" }, { key: "night", label: "🌙 Before bed" }, { key: "weekly", label: "📅 Weekly" }];
  const takenToday = supplements.filter(s => supplementsForDate[s.id]).length;
  const total = supplements.length;
  const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(selectedDate);
  const { thisMonthKey, lastMonthKey } = monthWindowsForDate(selectedDate);
  const suppHl = suppHeadline(thisWeekKeys, lastWeekKeys, weekSupplements, total, advice.criticalSuppNames);
  const curW = suppStats(thisWeekKeys, weekSupplements, total);
  const prevW = suppStats(lastWeekKeys, weekSupplements, total);
  const weekLabels = thisWeekKeys.map(dowShort);
  const suppFn = (k) => suppPctValue(k, weekSupplements, total);
  const weekSuppThis = thisWeekKeys.map(suppFn);
  const weekSuppLast = lastWeekKeys.map(suppFn);
  const monSuppThis = monthWeekSeries(thisMonthKey, suppFn);
  const monSuppLast = monthWeekSeries(lastMonthKey, suppFn);
  const monLen = Math.max(monSuppThis.length, monSuppLast.length, 1);
  const monPad = (arr) => arr.concat(Array(Math.max(0, monLen - arr.length)).fill(null));
  const monLabels = Array.from({ length: monLen }, (_, i) => `W${i + 1}`);
  return (
    <div className="tabPane">
      <DateBar selectedDate={selectedDate} onOpenCalendar={() => setCalendarOpen(true)} onBackToToday={() => setSelectedDate(todayKey())} />
      {suppHl && <><InsightCallout insight={suppHl} icon="pill" /><div style={{ height: 14 }} /></>}
      <Card style={{ marginBottom: 14, textAlign: "center" }}>
        {supplements.length === 0 ? (
          <><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 17, color: T.forest }}>✅ No supplements to take</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 3 }}>Add any your doctor recommends in ⚙️ → Supplements.</div></>
        ) : (
          <><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22 }}>{takenToday} of {supplements.length}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>taken — {formatDateLabel(selectedDate)}</div></>
        )}
      </Card>
      {suggestedSupps && suggestedSupps.length > 0 && (
        <>
          <SectionLabel>Suggested for your profile</SectionLabel>
          <Card style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
              {suggestedSupps.map(s => {
                const added = supplements.some(x => (x.name || "").toLowerCase() === s.name.toLowerCase());
                return (
                <div key={s.name} style={{ display: "flex", gap: 9, alignItems: "flex-start" }}>
                  <span style={{ color: T.teal, fontSize: 15, lineHeight: "20px" }}>•</span>
                  <div style={{ flex: 1 }}><div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, color: T.ink }}>{s.name}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{s.why}</div></div>
                  {added
                    ? <span style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12, color: T.forest, whiteSpace: "nowrap", alignSelf: "center" }}>Added ✓</span>
                    : <button onClick={() => onAddSupplement && onAddSupplement(s)} style={{ background: T.tealSolid, border: "none", borderRadius: 8, padding: "7px 12px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap", alignSelf: "center" }}>+ Add</button>}
                </div>
              );})}
            </div>
            <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginTop: 10, borderTop: `1px solid ${T.border}`, paddingTop: 8 }}>Based on the conditions in your profile. General wellness ideas only — confirm what's right for you (and any doses) with your doctor before starting.</div>
          </Card>
        </>
      )}
      {(curW || prevW) && (
        <>
          <SectionLabel>Adherence — week & month</SectionLabel>
          <Card style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 6 }}>
              <MetricDelta label="This week" cur={curW ? curW.pct : null} prev={prevW ? prevW.pct : null} unit="%" />
              <MetricDelta label="Avg taken/day" cur={curW ? curW.avgTaken : null} prev={prevW ? prevW.avgTaken : null} />
              <div style={{ flex: 1, minWidth: 76 }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>{prevW ? prevW.pct + "%" : "—"}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>Last week</div></div>
            </div>
            {(weekSuppThis.some(v => v != null) || weekSuppLast.some(v => v != null)) && (
              <div style={{ marginTop: 8, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Supplements taken per day (%) — this week vs last week</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={weekLabels} a={weekSuppThis} b={weekSuppLast} aLabel="This week" bLabel="Last week" yMax={100} unit="%" height={170} />
                </div>
              </div>

// Turn the week's meal names into a rough shopping list by matching common ingredient keywords.
const GROCERY_MAP = [
  [/palak|spinach|methi|leaf|greens|saag|amaranth/i, "Leafy greens (palak / methi)"],
  [/paneer/i, "Paneer"], [/tofu|soya|\bsoy\b/i, "Tofu / soya"],
  [/\bdal\b|daal|moong|toor|masoor|urad|lentil|rajma|chana|chhole|chole|kidney bean|sprout/i, "Dal / legumes / sprouts"],
  [/curd|dahi|yogurt|raita|buttermilk|chaas|lassi/i, "Curd"], [/\bmilk\b|kheer/i, "Milk"],
  [/roti|paratha|chapati|thepla|naan|poori|\bpuri\b|phulka|bhakri|rotla|handvo|dhokla|chilla|besan/i, "Wheat / atta / besan"],
  [/jowar|bajra|ragi|millet|nachni/i, "Millet flour (jowar / bajra / ragi)"],
  [/\brice\b|pulao|biryani|khichdi|idli|dosa|upma|poha|pongal|sambar|uttapam|rava/i, "Rice / poha / rava"],
  [/oats/i, "Oats"], [/\begg\b|anda|omelet/i, "Eggs"], [/chicken|murgh|tandoori/i, "Chicken"], [/fish|prawn|macher|meen/i, "Fish / prawns"],
  [/tomato/i, "Tomatoes"], [/onion|kanda/i, "Onions"], [/potato|aloo|batata/i, "Potatoes"],
  [/carrot|beans|cauliflower|gobi|cabbage|capsicum|brinjal|baingan|ringan|bhindi|okra|lauki|dudhi|gourd|pumpkin|peas|matar|\bveg|bharta|sabji|sabzi|shaak|shak/i, "Mixed vegetables"],
  [/cucumber|salad|kachumber|kachombar|koshimbir/i, "Salad veg"],
  [/coconut|nariyal/i, "Coconut"], [/peanut|groundnut|almond|cashew|walnut|\bnut/i, "Nuts / peanuts"],
  [/fruit|banana|apple|guava|papaya|orange|berr|jamun|amla/i, "Seasonal fruit & amla"],
  [/ghee|butter/i, "Ghee"], [/\boil\b/i, "Cooking oil"],
];
function groceryFromPlan(plan) {
  if (!plan || !plan.days) return [];
  const flat = v => Array.isArray(v) ? v.join(" ") : (v || "");
  const text = plan.days.map(d => [flat(d.breakfast), flat(d.lunch), flat(d.snack), flat(d.dinner)].join(" ")).join(" ");
  const out = []; GROCERY_MAP.forEach(([re, item]) => { if (re.test(text) && !out.includes(item)) out.push(item); });
  return out;
}

            const Toggle = ({ k, label, desc }) => (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 0", borderBottom: `1px solid ${T.creamDeep}`, gap: 10 }}>
                <div style={{ flex: 1 }}><div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 600, color: T.ink }}>{label}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{desc}</div></div>
                <button onClick={() => set(k, S[k] === false)} aria-label={"Toggle " + label} style={{ width: 46, height: 27, borderRadius: 999, background: S[k] !== false ? T.forest : T.border, border: "none", position: "relative", cursor: "pointer", flexShrink: 0 }}><span style={{ position: "absolute", top: 3, left: S[k] !== false ? 22 : 3, width: 21, height: 21, borderRadius: 999, background: "#fff" }} /></button>
              </div>
            );
            return (
              <div>
                <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 8, lineHeight: 1.5 }}>Pick which nudges you get — they appear on the 🔔 bell (and as phone notifications once the app is installed to your home screen).</div>
                <Toggle k="meals" label="Meal reminders" desc="Nudges to log breakfast / lunch / dinner" />
                <Toggle k="water" label="Water" desc="Are you drinking enough today?" />
                <Toggle k="activity" label="Activity" desc="Nudge when you haven't moved" />
                <Toggle k="supplements" label="Supplements" desc="Remaining supplements today" />
                <Toggle k="focus" label="Health focus" desc="Your flagged marker to watch" />
                <Toggle k="weekly" label="Weekly summary" desc="Wins & warnings vs last week" />
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 14 }}>
                  <div style={{ flex: 1 }}><div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 600, color: T.ink }}>End-of-day reminder</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>Always on — fires only if nothing's logged. Set the time:</div></div>
                  <input type="time" value={S.endOfDayTime || "22:00"} onChange={e => set("endOfDayTime", e.target.value)} style={{ border: `1px solid ${T.border}`, borderRadius: 8, padding: "7px 8px", fontFamily: "Inter", fontSize: 13.5, background: T.cream, color: T.ink }} />
                </div>
              </div>
            );
          })()}
          {section === "account" && (() => {
            const a = authState();
            const inS2 = { width: "100%", boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 10, padding: "10px 12px", fontFamily: "Inter", fontSize: 14, marginBottom: 8 };
            if (a.status === "signedin") {
              return (
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{ width: 9, height: 9, borderRadius: 5, background: T.forest }} />
                    <span style={{ fontFamily: "Inter", fontSize: 13.5, color: T.ink }}>Signed in as <b>{a.email}</b></span>
                  </div>
                  <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 16, lineHeight: 1.5 }}>Your data is private to this account and syncs automatically on every device where you sign in — no sync code needed.</div>
                  <button onClick={() => authSignOut()} style={{ width: "100%", background: T.alertPale, border: `1px solid ${T.alert}`, borderRadius: 10, padding: "10px 0", color: T.alert, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Sign out</button>
                </div>
              );
            }
            return (
              <div>
                <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft, marginBottom: 14, lineHeight: 1.5 }}>Create an account to save your data safely and use it on any device — just sign in and your profile, logs and plan follow you. Your data stays private to you.</div>
                <input type="email" autoComplete="email" placeholder="Email" value={acctEmail} onChange={e => setAcctEmail(e.target.value)} style={inS2} />
                <input type="password" autoComplete="current-password" placeholder="Password (6+ characters)" value={acctPass} onChange={e => setAcctPass(e.target.value)} style={inS2} />
                {a.error && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.alert, marginBottom: 8, lineHeight: 1.4 }}>{a.error}</div>}
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <button disabled={a.status === "working"} onClick={() => authSignIn(acctEmail, acctPass)} style={{ flex: 1, background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 10, padding: "11px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, opacity: a.status === "working" ? 0.6 : 1 }}>{a.status === "working" ? "…" : "Sign in"}</button>
                  <button disabled={a.status === "working"} onClick={() => authSignUp(acctEmail, acctPass)} style={{ flex: 1, background: T.tealSolid, border: "none", borderRadius: 10, padding: "11px 0", color: "#fff", fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, opacity: a.status === "working" ? 0.6 : 1 }}>{a.status === "working" ? "…" : "Create account"}</button>
                </div>
                <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft, marginTop: 10, lineHeight: 1.5 }}>New here? Enter an email + password and tap <b>Create account</b>. Already have one? <b>Sign in</b>. Needs internet; not available inside the claude.ai preview.</div>
              </div>
            );
          })()}
          {section === "data" && (
            <div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>BACKUP &amp; RESTORE</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                <button onClick={exportAppData} style={{ flex: 1, background: T.tealSolid, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>⬇ Export backup</button>
                <button onClick={() => importRef.current && importRef.current.click()} style={{ flex: 1, background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 10, padding: "10px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>⬆ Restore</button>
                <input ref={importRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={e => { const f = e.target.files && e.target.files[0]; if (!f) return; importAppData(f, (n, sum) => {
                  if (n < 0 || !sum) { setImportMsg("⚠ Couldn't read that file — is it a health-backup .json?"); return; }
                  const who = sum.profiles.length ? ` · people: ${sum.profiles.join(", ")}` : "";
                  if (!sum.hasData) { setImportMsg(`This backup has NO logged data (${sum.markers} report markers, ${sum.foodDays} food days, ${sum.supps} supplements)${who}. It only contains profile names — try your OTHER backup file.`); return; }
                  setImportMsg(`Restored ${sum.markers} report markers, ${sum.foodDays} food days, ${sum.supps} supplements${who}. Reloading…`);
                  setTimeout(() => location.reload(), 1600);
                }); e.target.value = ""; }} />
              </div>
              <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: importMsg ? 6 : 20, lineHeight: 1.5 }}>Saves all your data (profiles, logs, reports, supplements, plan) to a JSON file you can restore here or on another device. Do this before switching browsers or clearing storage.</div>
              {importMsg && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.teal, marginBottom: 20 }}>{importMsg}</div>}

              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>SYNC ACROSS DEVICES</div>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 20, lineHeight: 1.5 }}>
                {authState().status === "signedin"
                  ? <>✓ Signed in — your data syncs automatically on every device you sign in to.</>
                  : <>Create a free account and your data syncs across all your devices automatically — no setup needed. Open the <b>Account</b> tab.</>}
              </div>

              <button onClick={onApplyDemoMonth} style={{ width: "100%", background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 10, padding: "10px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>Generate history (Jul 1 → today)</button>
              <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 20, lineHeight: 1.5 }}>Fills every empty day from Jul 1 with sample food (from the Weekly Menu), activity and supplement data. Won't touch days you've already logged.</div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR A SPECIFIC DATE</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                <input type="date" value={clearDateVal} max={todayKey()} onChange={e => setClearDateVal(e.target.value)} style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5 }} />
                <button onClick={() => onClearDate(clearDateVal)} style={{ background: T.alert, border: "none", borderRadius: 10, padding: "0 14px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Clear</button>
              </div>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>CLEAR EVERYTHING</div>
              {!confirmingClearAll ? (
                <button onClick={() => setConfirmingClearAll(true)} style={{ width: "100%", background: T.alertPale, border: `1px solid ${T.alert}`, borderRadius: 10, padding: "10px 0", color: T.alert, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Clear all history</button>
              ) : (
                <div style={{ background: T.alertPale, borderRadius: 10, padding: 12 }}>
                  <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.ink, marginBottom: 10 }}>This can't be undone. Delete every logged day permanently?</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setConfirmingClearAll(false)} style={{ flex: 1, background: T.white, border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 0", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Cancel</button>
                    <button onClick={() => { onClearAll(); setConfirmingClearAll(false); }} style={{ flex: 1, background: T.alert, border: "none", borderRadius: 8, padding: "8px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Yes, delete everything</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== ONBOARDING WIZARD ============================== */
function OnbChip({ label, on, onClick }) {
  return <button onClick={onClick} style={{ background: on ? T.saffron : T.creamDeep, color: on ? "#fff" : T.ink, border: `1px solid ${on ? T.saffron : T.border}`, borderRadius: 999, padding: "8px 13px", fontFamily: "Inter", fontSize: 13, cursor: "pointer" }}>{label}</button>;
}
// Multi-step profile setup. Pre-filled from the active profile, skippable. On finish it writes
// the rich profile (conditions, goals, diet, cuisines, activity, plan opt-in) and flips the two
// body-composition goal toggles the advice/target engine reads. Built now so adding another
// person is just a fresh run of this wizard.
// First-launch welcome: account-first (so data is safe from the start), with a "try it first" escape.
function WelcomeScreen({ onDone }) {
  const [mode, setMode] = useState("create"); // create | signin
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("+");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [, setTick] = useState(0);
  useEffect(() => { const h = () => setTick(t => t + 1); window.addEventListener("auth-state", h); return () => window.removeEventListener("auth-state", h); }, []);
  const a = authState(); const working = a.status === "working";
  const create = async () => {
    setErr("");
    if (!name.trim()) return setErr("Please enter your name.");
    const digits = (phone || "").replace(/[^0-9]/g, "");
    if (!(phone || "").trim().startsWith("+") || digits.length < 8) return setErr("Enter a mobile number with country code, starting with + (e.g. +91 98765 43210).");
    if (!email.trim()) return setErr("Please enter your email.");
    if ((pass || "").length < 6) return setErr("Password should be at least 6 characters.");
    const ok = await authSignUp(email, pass, { name: name.trim(), phone: phone.trim() });
    if (ok) onDone(true);
  };
  const signin = async () => {
    setErr("");
    if (!email.trim() || !pass) return setErr("Enter your email and password.");
    const ok = await authSignIn(email, pass);
    if (ok) onDone(false);
  };
  const inS = { width: "100%", boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 12, padding: "12px 14px", fontFamily: "Inter", fontSize: 15, marginBottom: 10, background: T.cream, color: T.ink };
  const lbl = { fontFamily: "Inter", fontSize: 11.5, fontWeight: 700, color: T.inkSoft, marginBottom: 4, marginTop: 2 };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, background: `linear-gradient(160deg, ${T.teal}, ${T.tealSolid})`, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: "26px 20px", overflowY: "auto" }}>
      <div style={{ width: "100%", maxWidth: 380, background: T.cream, borderRadius: 22, padding: 22, boxShadow: "0 20px 50px rgba(0,0,0,0.3)" }}>
        <div style={{ fontSize: 34, textAlign: "center", marginBottom: 4 }}>🥗</div>
        <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 21, color: T.teal, textAlign: "center", marginBottom: 4 }}>Welcome to Health Companion</div>
        <div style={{ fontFamily: "Inter", fontSize: 13.5, color: T.inkSoft, textAlign: "center", marginBottom: 18, lineHeight: 1.45 }}>{mode === "create" ? "Create a free account so your data is safe and follows you on every device." : "Welcome back — sign in to your account."}</div>
        {mode === "create" && (<>
          <div style={lbl}>YOUR NAME</div>
          <input autoComplete="name" placeholder="e.g. Jignesh Suba" value={name} onChange={e => setName(e.target.value)} style={inS} />
          <div style={lbl}>MOBILE NUMBER (with country code)</div>
          <input type="tel" autoComplete="tel" placeholder="+91 98765 43210" value={phone} onChange={e => setPhone(e.target.value)} style={inS} />
        </>)}
        <div style={lbl}>EMAIL {mode === "create" ? "(this is your username)" : ""}</div>
        <input type="email" autoComplete="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} style={inS} />
        <div style={lbl}>PASSWORD</div>
        <input type="password" autoComplete={mode === "create" ? "new-password" : "current-password"} placeholder={mode === "create" ? "At least 6 characters" : "Your password"} value={pass} onChange={e => setPass(e.target.value)} style={inS} />
        {(err || a.error) && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.alert, marginBottom: 8, lineHeight: 1.4 }}>{err || a.error}</div>}
        <button disabled={working} onClick={mode === "create" ? create : signin} style={{ width: "100%", background: T.tealSolid, border: "none", borderRadius: 12, padding: "13px 0", color: "#fff", fontFamily: "Manrope", fontWeight: 800, fontSize: 15.5, cursor: "pointer", opacity: working ? 0.6 : 1 }}>{working ? "…" : (mode === "create" ? "Create free account" : "Sign in")}</button>
        <div style={{ textAlign: "center", marginTop: 14, fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}>
          {mode === "create"
            ? <>Already have an account? <button disabled={working} onClick={() => { setMode("signin"); setErr(""); }} style={{ background: "none", border: "none", color: T.teal, fontWeight: 800, cursor: "pointer", fontSize: 13, fontFamily: "Inter", padding: 0 }}>Sign in</button></>
            : <>New here? <button disabled={working} onClick={() => { setMode("create"); setErr(""); }} style={{ background: "none", border: "none", color: T.teal, fontWeight: 800, cursor: "pointer", fontSize: 13, fontFamily: "Inter", padding: 0 }}>Create account</button></>}
        </div>
      </div>
    </div>
  );
}
function OnboardingWizard({ open, onClose, profile, saveProfile, goalToggles, saveGoalToggles, onGenerateSample, firstSetup, onFreshSetup, onDone }) {
  const build = () => ({
    name: profile.name || "", gender: profile.gender || "Male", age: profile.age ?? "", height: profile.height ?? "", weight: profile.weight ?? "", city: profile.city || "",
    conditions: profile.conditions || [], goals: profile.goals || [], dietPattern: profile.dietPattern || "Vegetarian",
    dietRules: profile.dietRules || [], cuisines: profile.cuisines || [], activityLevel: profile.activityLevel || "light", wantsMealPlan: profile.wantsMealPlan || "Open to trying",
    smoking: profile.smoking || "none", vaping: profile.vaping || "none", alcohol: profile.alcohol || "none",
    sleepHours: profile.sleepHours || "", bedtime: profile.bedtime || "", chronotype: profile.chronotype || "", dayNaps: !!profile.dayNaps,
    pregnant: !!profile.pregnant, periodLastStart: profile.periodLastStart || "", periodDuration: profile.periodDuration ?? 5, periodCycle: profile.periodCycle ?? 28, periodSymptoms: profile.periodSymptoms || [],
  });
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(build);
  useEffect(() => { if (open) { setStep(0); setForm(build()); } }, [open]);
  if (!open) return null;
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleIn = (k, v) => setForm(f => { const a = f[k] || []; return { ...f, [k]: a.includes(v) ? a.filter(x => x !== v) : [...a, v] }; });
  const STEPS = ["About you", "Health conditions", "Your goals", "Diet", "Cuisines you like", "Activity & plans", "Lifestyle & sleep", "You're all set"];
  const last = STEPS.length - 1;
  const inS = { width: "100%", border: `1px solid ${T.border}`, borderRadius: 10, padding: "10px 12px", fontFamily: "Inter", fontSize: 14, background: T.cream, color: T.ink };
  const lS = { fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 };
  const hint = { fontFamily: "Inter", fontSize: 13, color: T.inkSoft, marginBottom: 12 };
  const subL = { fontFamily: "Inter", fontSize: 13, color: T.inkSoft, marginBottom: 10 };

  function finish(withSample) {
    const built = { ...profile, name: form.name, gender: form.gender, age: Number(form.age) || profile.age, height: Number(form.height) || profile.height, weight: Number(form.weight) || profile.weight, city: form.city, conditions: form.conditions, goals: form.goals, dietPattern: form.dietPattern, diet: form.dietPattern, dietRules: form.dietRules, cuisines: form.cuisines, activityLevel: form.activityLevel, wantsMealPlan: form.wantsMealPlan,
      smoking: form.smoking, vaping: form.vaping, alcohol: form.alcohol, sleepHours: form.sleepHours, bedtime: form.bedtime, chronotype: form.chronotype, dayNaps: form.dayNaps,
      pregnant: form.pregnant, periodLastStart: form.periodLastStart, periodDuration: form.periodDuration, periodCycle: form.periodCycle, periodSymptoms: form.periodSymptoms };
    saveProfile(built);
    saveGoalToggles(goalToggles.map(g => g.id === "weightloss" ? { ...g, active: form.goals.includes("Lose weight") } : g.id === "muscle" ? { ...g, active: form.goals.includes("Build muscle") } : g));
    if (firstSetup && onFreshSetup) onFreshSetup(); // new person: drop any Jignesh seed so everything reflects them
    if (withSample && onGenerateSample) onGenerateSample(built);
    onDone();
  }

  return (
    <div className="askOverlay" style={{ alignItems: "stretch" }}>
      <div style={{ background: T.cream, width: "100%", maxWidth: 420, margin: "0 auto", display: "flex", flexDirection: "column", height: "100%" }}>
        <div style={{ padding: "16px 18px 12px", borderBottom: `1px solid ${T.border}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: T.teal }}>Set up your profile</div>
            <button onClick={onClose} style={{ background: "none", border: "none", fontFamily: "Inter", fontSize: 13, color: T.inkSoft, cursor: "pointer" }}>Skip</button>
          </div>
          <div style={{ display: "flex", gap: 5, marginTop: 12 }}>{STEPS.map((s, i) => <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? T.saffron : T.border }} />)}</div>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 19, color: T.ink, marginTop: 12 }}>{STEPS[step]}</div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 18 }}>
          {step === 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div><div style={lS}>Name</div><input value={form.name} onChange={e => set("name", e.target.value)} style={inS} /></div>
              <div><div style={{ ...lS, marginBottom: 6 }}>Sex</div><div style={{ display: "flex", gap: 8 }}>{["Male", "Female"].map(g => <OnbChip key={g} label={g} on={form.gender === g} onClick={() => set("gender", g)} />)}</div></div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}><div style={lS}>Age</div><input value={form.age} inputMode="numeric" onChange={e => set("age", e.target.value.replace(/\D/g, ""))} style={inS} /></div>
                <div style={{ flex: 1 }}><div style={lS}>Height (cm)</div><input value={form.height} inputMode="numeric" onChange={e => set("height", e.target.value.replace(/\D/g, ""))} style={inS} /></div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}><div style={lS}>Weight (kg)</div><input value={form.weight} inputMode="numeric" onChange={e => set("weight", e.target.value.replace(/[^0-9.]/g, ""))} style={inS} /></div>
                <div style={{ flex: 1 }}><div style={lS}>City / Country</div><input value={form.city} onChange={e => set("city", e.target.value)} style={inS} /></div>
              </div>
            </div>
          )}
          {step === 1 && (
            <>
              <div style={hint}>Pick anything you're managing — grouped by area. Your report also flags markers automatically.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {ONB_CONDITION_GROUPS.map(g => (
                  <div key={g.cat}>
                    <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 11.5, letterSpacing: 0.4, color: T.teal, marginBottom: 7, textTransform: "uppercase" }}>{g.cat}</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{g.items.map(c => <OnbChip key={c} label={c} on={(form.conditions || []).includes(c)} onClick={() => toggleIn("conditions", c)} />)}</div>
                  </div>
                ))}
                <div style={{ paddingTop: 4, borderTop: `1px solid ${T.border}` }}><OnbChip label="None / not sure" on={(form.conditions || []).includes("None")} onClick={() => toggleIn("conditions", "None")} /></div>
              </div>
            </>
          )}
          {step === 2 && (<><div style={hint}>What are you working towards? Pick all that apply.</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_GOALS.map(c => <OnbChip key={c} label={c} on={(form.goals || []).includes(c)} onClick={() => toggleIn("goals", c)} />)}</div></>)}
          {step === 3 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <div><div style={subL}>Your diet pattern</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_DIET_PATTERNS.map(c => <OnbChip key={c} label={c} on={form.dietPattern === c} onClick={() => set("dietPattern", c)} />)}</div></div>
              <div><div style={subL}>Any restrictions?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_DIET_RULES.map(c => <OnbChip key={c} label={c} on={(form.dietRules || []).includes(c)} onClick={() => toggleIn("dietRules", c)} />)}</div></div>
            </div>
          )}
          {step === 4 && (<><div style={hint}>We'll lean on these when suggesting meals.</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_CUISINES.map(c => <OnbChip key={c} label={c} on={(form.cuisines || []).includes(c)} onClick={() => toggleIn("cuisines", c)} />)}</div></>)}
          {step === 5 && (

              <div><div style={subL}>Want a weekly meal plan?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_MEALPLAN.map(c => <OnbChip key={c} label={c} on={form.wantsMealPlan === c} onClick={() => set("wantsMealPlan", c)} />)}</div></div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              <div><div style={subL}>Do you vape?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_FREQ.map(f => <OnbChip key={f.k} label={f.l} on={(form.vaping || "none") === f.k} onClick={() => set("vaping", f.k)} />)}</div></div>
              <div><div style={subL}>Do you drink alcohol?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_FREQ.map(f => <OnbChip key={f.k} label={f.l} on={(form.alcohol || "none") === f.k} onClick={() => set("alcohol", f.k)} />)}</div></div>
              <div><div style={subL}>How many hours do you sleep a night?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_SLEEP_HOURS.map(s => <OnbChip key={s.k} label={s.l} on={form.sleepHours === s.k} onClick={() => set("sleepHours", s.k)} />)}</div></div>
              <div><div style={subL}>What time do you usually go to bed?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_BEDTIME.map(s => <OnbChip key={s.k} label={s.l} on={form.bedtime === s.k} onClick={() => set("bedtime", s.k)} />)}</div></div>
              <div><div style={subL}>Which sounds most like you?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_CHRONO.map(s => <OnbChip key={s.k} label={s.l} on={form.chronotype === s.k} onClick={() => set("chronotype", s.k)} />)}<OnbChip label="I nap in the day too" on={!!form.dayNaps} onClick={() => set("dayNaps", !form.dayNaps)} /></div></div>
              {isFemale(form) && (<>
                <div style={{ height: 1, background: T.border }} />
                <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: T.teal }}>Women's health</div>
                <div><div style={subL}>Are you pregnant?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}><OnbChip label="No" on={!form.pregnant} onClick={() => set("pregnant", false)} /><OnbChip label="Yes" on={!!form.pregnant} onClick={() => set("pregnant", true)} /></div>
                  {form.pregnant && <div style={{ background: T.alertPale, border: `1px solid ${T.alert}`, borderRadius: 10, padding: "10px 12px", marginTop: 8, fontFamily: "Inter", fontSize: 12.5, color: T.alert, lineHeight: 1.5 }}>⚠ This app isn't designed for pregnancy. Please don't use its meal or calorie targets — follow your doctor's guidance. You can still finish setup, but we'll keep this warning visible.</div>}
                </div>
                {!form.pregnant && (<>
                  <div><div style={subL}>When did your last period start? (first day)</div><input type="date" value={form.periodLastStart || ""} onChange={e => set("periodLastStart", e.target.value)} style={{ ...inS }} /></div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <div style={{ flex: 1 }}><div style={subL}>Lasts (days)</div><input type="number" min="1" max="14" value={form.periodDuration} onChange={e => set("periodDuration", Number(e.target.value) || 5)} style={inS} /></div>
                    <div style={{ flex: 1 }}><div style={subL}>Cycle gap (days)</div><input type="number" min="15" max="60" value={form.periodCycle} onChange={e => set("periodCycle", Number(e.target.value) || 28)} style={inS} /></div>
                  </div>
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft }}>“Cycle gap” = days from the start of one period to the next (average ≈ 28). We'll predict your next date and refine it as you log.</div>
                  <div><div style={subL}>Which symptoms do you usually get?</div><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{ONB_PERIOD_SYMPTOMS.map(s => <OnbChip key={s} label={s} on={(form.periodSymptoms || []).includes(s)} onClick={() => toggleIn("periodSymptoms", s)} />)}</div></div>
                </>)}
              </>)}
            </div>
          )}
          {step === 7 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 17, color: T.teal }}>Nice — you're set up{form.name ? `, ${form.name}` : ""}! 🎉</div>
              <div style={hint}>Based on your choices, we've prepared a <b>sample month</b> of meals and activity — built from the {(form.cuisines || []).length ? (form.cuisines.slice(0, 3).join(", ") + (form.cuisines.length > 3 ? "…" : "")) : "cuisines"} you like and your activity level — so the app isn't empty while you find your feet.</div>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 2 }}>Want to explore with that sample, or start with a clean slate? You can switch anytime in ⚙️ → Data.</div>

              <button onClick={() => finish(false)} style={{ background: T.white, color: T.teal, border: `1.5px solid ${T.teal}`, borderRadius: 12, padding: "13px 0", fontFamily: "Manrope", fontWeight: 800, fontSize: 15, cursor: "pointer" }}>Start with a blank slate</button>
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 10, padding: "12px 18px 20px", borderTop: `1px solid ${T.border}` }}>
          {step > 0 && <button onClick={() => setStep(step - 1)} style={{ flex: "0 0 auto", background: T.creamDeep, border: `1px solid ${T.border}`, borderRadius: 12, padding: "12px 18px", fontFamily: "Manrope", fontWeight: 700, fontSize: 14, color: T.ink, cursor: "pointer" }}>Back</button>}
          {step < last && <button onClick={() => setStep(step + 1)} style={{ flex: 1, background: T.saffron, border: "none", borderRadius: 12, padding: "12px 0", fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: "#fff", cursor: "pointer" }}>Next</button>}
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function App() {
  const [tab, setTab] = useState("today");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsSection, setSettingsSection] = useState("profile");
  const [gearMenuOpen, setGearMenuOpen] = useState(false);
  const [logOpen, setLogOpen] = useState(false);
  const [notifsOpen, setNotifsOpen] = useState(false);
  // Surface any failed persist (e.g. storage full) instead of silently dropping the save.
  const [kvErr, setKvErr] = useState(false);
  useEffect(() => { const h = () => setKvErr(true); window.addEventListener("kv-write-error", h); if (KV_WRITE_ERROR) setKvErr(true); return () => window.removeEventListener("kv-write-error", h); }, []);
  const [, setAuthTick] = useState(0);
  useEffect(() => { const h = () => setAuthTick(t => t + 1); window.addEventListener("auth-state", h); return () => window.removeEventListener("auth-state", h); }, []);
  const [acctPromptOff, setAcctPromptOff] = useKV("ui:acctPromptOff", false);
  // Multi-profile: the "self" profile keeps the original UNPREFIXED keys (zero migration for
