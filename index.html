  // so switching the active profile swaps every store below to that person's data.
  const [profiles, setProfiles] = useKV("profiles:list", [{ id: "self", name: FRESH_MODE ? "" : PROFILE_SEED.name }]);
  const [activeId, setActiveId] = useKV("profiles:active", "self");
  const isSelf = activeId === "self";
  const pk = (k) => isSelf ? k : `p:${activeId}:${k}`;
  const [onboarded, setOnboarded] = useKV(pk("profile:onboarded"), false);
  const [wizardOpen, setWizardOpen] = useState(false);
  const [welcomeOpen, setWelcomeOpen] = useState(false);
  // First launch: a brand-new, signed-out device sees the Welcome (account-first, with a "try it
  // first" escape). A device that has signed in before just resumes and its data syncs back.
  useEffect(() => { if (onboarded) return; if (!kvGet("account:on", false)) setWelcomeOpen(true); else setWizardOpen(true); }, []);
  const tk = todayKey();

  const [weekFood, setWeekFood] = useKV(pk("week:foodlog"), {});
  const [weekSupplements, setWeekSupplements] = useKV(pk("week:supplements"), {});
  const [weekHabits, setWeekHabits] = useKV(pk("week:habits"), {});
  const [demoCleared, setDemoCleared] = useKV(pk("week:demoCleared"), false);
  const [activities, setActivities] = useKV(pk("activities:log"), {});
  const [vitals, setVitals] = useKV(pk("week:vitals"), {}); // { [dateKey]: { water, steps, weight } } — MFP-style daily quick log
  const [profile, setProfile] = useKV(pk("profile:data"), (isSelf && !FRESH_MODE) ? PROFILE_SEED : BLANK_PROFILE);
  const [goalToggles, setGoalToggles] = useKV(pk("goals:toggles"), DEFAULT_GOAL_TOGGLES);
  const [customGoals, setCustomGoals] = useKV(pk("goals:custom"), []);
  const [metrics, setMetrics] = useKV(pk("reports:metrics"), (isSelf && !FRESH_MODE) ? METRICS_SEED : blankMetrics());
  const [periods, setPeriods] = useKV(pk("reports:periods"), (isSelf && !FRESH_MODE) ? PERIODS_SEED : []);
  const [supplements, setSupplements] = useKV(pk("supplements:list"), (isSelf && !FRESH_MODE) ? SUPPLEMENTS_SEED : []);
  const [theme, setTheme] = useKV("ui:theme", "dark");
  const [notifSettings, setNotifSettings] = useKV("ui:notifs", { meals: true, water: true, activity: true, supplements: true, focus: true, weekly: true, endOfDay: true, endOfDayTime: "22:00" });
  T = theme === "light" ? T_LIGHT : T_DARK; // apply the chosen palette before this render tree paints
  useEffect(() => { try { document.body.style.background = (theme === "light" ? T_LIGHT : T_DARK).creamDeep; } catch {} }, [theme]);
  TOTAL_SUPPLEMENTS = supplements.length;
  const [customDishes, setCustomDishes] = useKV(pk("dishes:custom"), {});
  const [weeklyPlan, setWeeklyPlan] = useKV(pk("plan:weekly"), null);
  const [cycleLog, setCycleLog] = useKV(pk("cycle:log"), []); // menstrual-cycle history (female): [{start, duration, symptoms, note}]
  const [corpusLoaded, setCorpusLoaded] = useState(false);
  useEffect(() => { loadDishCorpus().then(() => setCorpusLoaded(true)); }, []);
  useEffect(() => { loadHealthDB(); loadRulesDB(); loadGuidance(); }, []);
  useEffect(() => { if (kvGet("account:on", false)) autoStartAccount(); else autoStartSync(); }, []); // resume account, else sync-code, on launch
  // One-time seed of real-looking history (Jul 1 → today). Runs once per SEED_VERSION and
  // never overwrites days that already have real logged data (spread order: seed first, then
  // existing wins). Cleared history is not re-seeded — the flag stays set until they clear it
  // or use "Generate history" in ⚙️ → Data.
  // Fresh/shared mode: never seed the personal demo; lock the profile blank so it stays empty even
  // if onboarding is closed and the page is reopened without the ?new flag.
  useEffect(() => {
    if (!FRESH_MODE || activeId !== "self") return;
    try {
      if (kvGet("seed:history", null)) return; // already locked to blank on a prior fresh load
      kvSet("seed:history", SEED_VERSION);
      // Persist ALL blank defaults so a later visit WITHOUT ?new still reads blank, never the
      // personal (Jignesh) seed that "self" otherwise defaults to.
      if (!kvGet("profile:data", null)) kvSet("profile:data", BLANK_PROFILE);
      if (!kvGet("reports:metrics", null)) kvSet("reports:metrics", blankMetrics());
      if (!kvGet("reports:periods", null)) kvSet("reports:periods", []);
      if (!kvGet("supplements:list", null)) kvSet("supplements:list", []);
    } catch (e) {}
  }, []);
  useEffect(() => {
    try {
      if (activeId !== "self" || FRESH_MODE) return; // only the primary profile gets the demo history
      if (kvGet("account:on", false)) return; // signed into an account -> data comes from the cloud, never the demo seed
      if (kvGet("seed:history", null) === SEED_VERSION) return;
      const { foodByDate, activitiesByDate, habitsByDate, supplementsByDate } = generateHistory();
      setWeekFood(prev => ({ ...foodByDate, ...prev }));
      setActivities(prev => ({ ...activitiesByDate, ...prev }));
      setWeekHabits(prev => ({ ...habitsByDate, ...prev }));
      setWeekSupplements(prev => ({ ...supplementsByDate, ...prev }));
      kvSet("seed:history", SEED_VERSION);
    } catch {}
  }, []);
  const saveCustomDish = (key, entry) => setCustomDishes(prev => ({ ...prev, [key]: entry }));
  // Keep the profile-list label in sync with the person's actual name (set during onboarding).
  useEffect(() => {
    setProfiles(ps => { const cur = ps.find(p => p.id === activeId); if (!cur || cur.name === (profile.name || cur.name)) return ps; return ps.map(p => p.id === activeId ? { ...p, name: profile.name || p.name } : p); });
  }, [profile.name]); // depend on the name only — avoids overwriting a new profile with the previous one's name on switch
  const addPerson = () => { const id = `p${Date.now()}`; setProfiles([...profiles, { id, name: "New person" }]); setActiveId(id); setSettingsOpen(false); setTab("today"); setWizardOpen(true); };
  const switchPerson = (id) => { setActiveId(id); setSettingsOpen(false); setTab("today"); };
  const removePerson = (id) => { if (id === "self") return; setProfiles(profiles.filter(p => p.id !== id)); if (activeId === id) setActiveId("self"); };
  // Weekly meal plan: auto-(re)generate when the week rolls over or the diet changes; manual regenerate + per-meal swap.
  const mealPreferences = mealPrefs(profile);
  // Signature of everything that shapes the plan — regenerate on week rollover OR whenever the
  // person edits their diet pattern, cuisines or restrictions so the plan always reflects setup.
  const planSig = (profile.dietPattern || "") + "|" + (profile.cuisines || []).join(",") + "|" + (profile.dietRules || []).join(",");
  useEffect(() => { const wk = weekNumber(); if (!weeklyPlan || weeklyPlan.week !== wk || weeklyPlan.sig !== planSig || weeklyPlan.v !== 2) setWeeklyPlan({ ...generateWeeklyPlan(wk, wk, mealPreferences), sig: planSig }); }, [weeklyPlan, activeId, planSig]);
  const regeneratePlan = () => setWeeklyPlan({ ...generateWeeklyPlan(weekNumber(), Math.floor(Math.random() * 1e6), mealPreferences), sig: planSig });
  const swapPlanMeal = (dayIdx, slot) => setWeeklyPlan(p => (p ? swapMeal(p, dayIdx, slot, mealPreferences) : p));
  const addPlanItem = (dayIdx, slot, dish) => setWeeklyPlan(p => (p && p.days) ? { ...p, days: p.days.map((d, i) => i === dayIdx ? { ...d, [slot]: [...(d[slot] || []), dish] } : d) } : p);
  const removePlanItem = (dayIdx, slot, idx) => setWeeklyPlan(p => (p && p.days) ? { ...p, days: p.days.map((d, i) => i === dayIdx ? { ...d, [slot]: (d[slot] || []).filter((_, j) => j !== idx) } : d) } : p);
  const logPeriod = (start) => {
    if (!start) return;
    setCycleLog(prev => [...(prev || []).filter(e => e && e.start !== start), { start, duration: profile.periodDuration || 5, symptoms: profile.periodSymptoms || [], loggedAt: Date.now() }].sort((a, b) => a.start < b.start ? -1 : 1));
    setProfile(p => ({ ...p, periodLastStart: start })); // keep Settings + prediction in agreement
  };

  const foodToday = weekFood[tk] || [];
  const supplementsToday = weekSupplements[tk] || {};
  const habitToday = weekHabits[tk] || {};
  const foodForDate = weekFood[selectedDate] || [];
  const supplementsForDate = weekSupplements[selectedDate] || {};
  const habitsForDate = weekHabits[selectedDate] || {};
  const targets = computeTargets(profile.weight, goalToggles, profile);
  const suggestedSupps = suggestSupplements(profile);
  // One-tap add of a suggested supplement to the person's own list (no manual retyping in Settings).
  const addSuggestedSupplement = (s) => {
    if (!s || !s.name) return;
    if (supplements.some(x => (x.name || "").toLowerCase() === s.name.toLowerCase())) return; // already added
    setSupplements([...supplements, { id: `supp-${Date.now()}`, name: s.name, dose: "", time: "morning", timeLabel: "", why: s.why || "", critical: false }]);
  };
  const advice = computeAdvice(metrics, periods, supplements, goalToggles, profile);
  // Notification engine — live nudges derived from today's data, gated by the user's per-category
  // settings, plus a weekly win/warning, goal coaching, and a mandatory end-of-day catch-all.
  const notifications = (() => {
    const S = notifSettings || {};
    const list = [];
    const now = new Date(); const hour = now.getHours();
    const fToday = weekFood[tk] || [], sToday = weekSupplements[tk] || {}, hToday = weekHabits[tk] || {}, aToday = activities[tk] || [];
    const suppLeft = supplements.length - Object.values(sToday).filter(Boolean).length;
    const sun = new Date(tk + "T00:00:00").getDay() === 0;
    const anyLoggedToday = fToday.length > 0 || aToday.length > 0 || Object.values(sToday).some(Boolean);
    if (S.meals !== false) {
      if (fToday.length === 0 && hour >= 10) list.push({ icon: "food", text: "You haven't logged any food today — tap ＋ to add a meal.", tab: "food" });
      else if (fToday.length && fToday.every(f => /chai|tea|juice|coffee|drink/i.test(f.dish || ""))) list.push({ icon: "food", text: "Only a drink is logged so far — a drink isn't a meal, eat something too.", tab: "food" });
    }
    if (S.supplements !== false && suppLeft > 0 && hour >= 9) list.push({ icon: "pill", text: `${suppLeft} supplement${suppLeft > 1 ? "s" : ""} still to take today.`, tab: "supplements" });
    if (S.activity !== false && !sun && aToday.length === 0 && hour >= 12) {
      const twoDaysNone = [0, 1].every(off => (activities[dateKeyOffset(off)] || []).length === 0);
      list.push({ icon: "walk", text: twoDaysNone ? "No activity logged for 2 days — time for a 30-minute walk?" : "No movement logged today — a 30-minute walk counts.", tab: "habits" });
    }
    if (S.water !== false && !hToday.water && hour >= 12) list.push({ icon: "walk", text: "Are you drinking enough water today?", tab: "habits" });
    if (S.focus !== false && advice.focusMarkerLabel) list.push({ icon: "alert", text: `Focus for you: ${advice.focusMarkerLabel} needs attention — see Progress.`, tab: "health" });
    if (goalToggles.find(g => g.id === "weightloss" && g.active)) {
      const cal = fToday.reduce((s, f) => s + (f.calories || 0), 0);
      if (cal > 0 && cal <= targets.calories) list.push({ icon: "sparkles", text: `On track for your goal — ${cal} of ${targets.calories} kcal so far, staying in your deficit.`, tab: "food" });
    }
    if (S.weekly !== false) {
      const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(tk);
      const a1 = activityStats(thisWeekKeys, activities, weekHabits), a0 = activityStats(lastWeekKeys, activities, weekHabits);
      if (a1.minutes - a0.minutes >= 60) list.push({ icon: "trendUp", text: `Weekly win: more active than last week (${a1.minutes} vs ${a0.minutes} min).`, tab: "health" });
      else if (a0.minutes - a1.minutes >= 60) list.push({ icon: "trendDown", text: `Less active than last week (${a1.minutes} vs ${a0.minutes} min) — worth a push.`, tab: "health" });
      const f1 = foodStats(thisWeekKeys, weekFood), f0 = foodStats(lastWeekKeys, weekFood);
      if (f1 && f0) { if (f1.sugar - f0.sugar >= 8) list.push({ icon: "food", text: `Sugar's up vs last week (${f1.sugar} vs ${f0.sugar} g/day) — ease off sweets.`, tab: "food" }); else if (f0.sugar - f1.sugar >= 8) list.push({ icon: "food", text: `Weekly win: sugar down vs last week (${f1.sugar} vs ${f0.sugar} g/day).`, tab: "food" }); }
    }
    if (S.endOfDay !== false) {
      const [eh, em] = (S.endOfDayTime || "22:00").split(":").map(Number);
      if ((hour > eh || (hour === eh && now.getMinutes() >= (em || 0))) && !anyLoggedToday) list.push({ icon: "bell", text: "Your day's wrapping up and nothing's logged — add today's food, activity or supplements before midnight.", tab: "food", mandatory: true });
    }
    if (isFemale(profile) && !profile.pregnant) {
      const pr = cyclePrediction(cycleLog, profile);
      if (pr && pr.daysUntil <= 0) list.push({ icon: "bell", text: "Your next period is due (or late) — log the date in Plan → Your cycle so predictions stay accurate.", tab: "plan" });
      else if (pr && pr.daysUntil <= 2) list.push({ icon: "bell", text: `Your period is expected in about ${pr.daysUntil} day${pr.daysUntil === 1 ? "" : "s"} — open Plan → Your cycle for tips to prepare.`, tab: "plan" });
    }
    return list;
  })();

  const addFoodEntry = (dateKey, entry) => setWeekFood(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const updateFoodEntry = (dateKey, index, patch) => setWeekFood(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).map((e, i) => i === index ? { ...e, ...patch } : e) }));
  const deleteFoodEntry = (dateKey, index) => setWeekFood(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  // Split a combined entry ("paratha + curd + salad") into one entry per component so each can be
  // moved to a different meal slot on its own. Macros are divided evenly across components.
  const splitFoodEntry = (dateKey, index) => setWeekFood(prev => {
    const list = prev[dateKey] || []; const e = list[index]; if (!e) return prev;
    const parts = String(e.dish || "").split(/\s*[+,&]\s*|\s+and\s+/i).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) return prev;
    const n = parts.length; const div = v => (v == null ? null : Math.round(v / n));
    const pieces = parts.map((name, k) => ({ ...e, dish: name, calories: div(e.calories), protein: div(e.protein), fiber: div(e.fiber), carbs: div(e.carbs), sugar: div(e.sugar), time: (e.time || Date.now()) + k, split: true }));
    return { ...prev, [dateKey]: [...list.slice(0, index), ...pieces, ...list.slice(index + 1)] };
  });
  const toggleSupplement = (dateKey, id) => setWeekSupplements(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [id]: !(prev[dateKey]?.[id]) } }));
  const toggleHabit = (dateKey, habitId) => setWeekHabits(prev => ({ ...prev, [dateKey]: { ...(prev[dateKey] || {}), [habitId]: !(prev[dateKey]?.[habitId]) } }));
  const clearDemo = () => setDemoCleared(true);
  const addActivity = (dateKey, entry) => setActivities(prev => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), entry] }));
  const deleteActivity = (dateKey, index) => setActivities(prev => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((_, i) => i !== index) }));
  // One-tap "30-min brisk walk" — writes to the SAME Activity Log (single source), so walking isn't
  // recorded in two places. On → add a 30-min Walk if none today; off → remove today's Walk entries.
  const toggleWalk = (dateKey) => setActivities(prev => {
    const list = prev[dateKey] || [];
    const has = list.some(a => a.type === "Walk");
    return { ...prev, [dateKey]: has ? list.filter(a => a.type !== "Walk") : [...list, { type: "Walk", duration: 30, time: Date.now() }] };
  });
  const setVital = (dateKey, field, value) => {
    // value may be a plain value or an updater fn(prevFieldValue) — the latter makes rapid taps correct.
    setVitals(prev => { const day = prev[dateKey] || {}; const nv = typeof value === "function" ? value(day[field]) : value; return { ...prev, [dateKey]: { ...day, [field]: nv } }; });
    if (field === "weight" && value && typeof value !== "function") setProfile(p => ({ ...p, weight: value })); // keep profile weight current for targets/burn calc
  };
  const openSettings = (section) => { setSettingsSection(section || "profile"); setSettingsOpen(true); };
  const clearDateData = (dateKey) => {
    setWeekFood(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekSupplements(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setWeekHabits(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
    setActivities(prev => { const n = { ...prev }; delete n[dateKey]; return n; });
  };
  const clearAllData = () => { setWeekFood({}); setWeekSupplements({}); setWeekHabits({}); setActivities({}); };
  const applyDemoMonth = () => {
    const { foodByDate, activitiesByDate, habitsByDate, supplementsByDate } = generateHistory();
    setWeekFood(prev => ({ ...foodByDate, ...prev }));
    setActivities(prev => ({ ...activitiesByDate, ...prev }));
    setWeekHabits(prev => ({ ...habitsByDate, ...prev }));
    setWeekSupplements(prev => ({ ...supplementsByDate, ...prev }));
    try { kvSet("seed:history", SEED_VERSION); } catch {}
  };
  // Fill a tailored ~30-day sample from the person's onboarding choices (used by the wizard's final step).
  const applySampleHistory = (prof) => {
    const { foodByDate, activitiesByDate, habitsByDate } = generateTailoredHistory(prof || profile);
    setWeekFood(prev => ({ ...foodByDate, ...prev }));
    setActivities(prev => ({ ...activitiesByDate, ...prev }));
    setWeekHabits(prev => ({ ...habitsByDate, ...prev }));
    try { kvSet("seed:history", SEED_VERSION); } catch (e) {}
  };
  // First-time profile setup by a NEW person: drop the seeded (Jignesh) lab metrics + demo history so
  // every marker, tip and chart reflects only THEM. Runs only on the very first onboarding, so the
  // owner's existing device (already onboarded) is never touched.
  const clearSeedForNewUser = () => {
    setMetrics(blankMetrics()); setPeriods([]);
    setWeekFood({}); setActivities({}); setWeekHabits({}); setWeekSupplements({});
    setProfiles([{ id: "self", name: "" }]); // drop the seeded "Jignesh" from the People list; name-sync fills their name
    try { kvSet("seed:history", SEED_VERSION); } catch (e) {}
  };

  // 5-item bar: Today · Plan · ＋(log) · Progress · Me. Food/Activity/Supplement logging is
  // reached through the center ＋. "Progress" shows the health markers/trends (MyHealthTab);
  // "Me" opens Profile & Reports. Nav colours are literals because the bar is always deep teal.
  const NAV = [
    { id: "today", label: "Dashboard", icon: "home" },
    { id: "plan", label: "Plan", icon: "clipboard" },
    { center: true },
    { id: "health", label: "Progress", icon: "activity" },
    { id: "me", label: "Me", icon: "user" },
  ];
  const logOptions = [
    { label: "Food / meal", icon: "food", tab: "food" },
    { label: "Activity", icon: "walk", tab: "habits" },
    { label: "Supplement", icon: "pill", tab: "supplements" },
  ];

  return (
    <div style={{ display: "flex", justifyContent: "center", background: T.creamDeep, minHeight: "100vh" }}>
      <style>{`
        .pulseWrap { animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .askOverlay { position: fixed; inset: 0; background: rgba(38,48,46,0.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
        .askPanel { background: ${T.cream}; width: 100%; max-width: 420px; height: 78vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
        .tabPane { padding: calc(56px + env(safe-area-inset-top, 0px)) 16px 16px; }
        input, textarea, select { color: ${T.ink}; background-color: ${T.cream}; border-color: ${T.border}; }
        input::placeholder, textarea::placeholder { color: ${T.inkSoft}; opacity: 1; }
        input[type="date"], input[type="time"] { color-scheme: ${theme === "light" ? "light" : "dark"}; }
        select option { color: ${T.ink}; background: ${T.cream}; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>
      <div style={{ width: "100%", maxWidth: 420, background: T.cream, color: T.ink, minHeight: "100vh", position: "relative", boxShadow: "0 0 40px rgba(0,0,0,0.06)" }}>
        {profile.pregnant && (
          <div style={{ position: "sticky", top: 0, zIndex: 12, background: T.alert, color: "#fff", padding: "10px 14px 10px 14px", fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, lineHeight: 1.45, textAlign: "center", boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}>
            ⚠ This app is not for use during pregnancy. Please don't follow its meal or calorie targets — see your doctor for pregnancy-safe guidance.
          </div>
        )}
        {kvErr && (
          <div onClick={() => openSettings("data")} style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 40, background: T.alert, color: "#fff", padding: "8px 12px", fontFamily: "Inter", fontSize: 12.5, textAlign: "center", lineHeight: 1.4, cursor: "pointer" }}>
            ⚠️ Couldn't save to this browser's storage — it may be full. Tap to open Data & export a backup.
          </div>
        )}
        <button onClick={() => setNotifsOpen(true)} aria-label="Notifications" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 102, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)" }}>
          <Icon name="bell" size={17} color={T.teal} />
          {notifications.length > 0 && <span style={{ position: "absolute", top: -4, right: -4, minWidth: 18, height: 18, padding: "0 4px", borderRadius: 9, background: T.alert, color: "#fff", fontFamily: "Manrope", fontWeight: 800, fontSize: 12, display: "grid", placeItems: "center", border: `2px solid ${T.cream}` }}>{notifications.length}</span>}
        </button>
        <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Toggle light or dark mode" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 58, zIndex: 15, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)", fontSize: 16 }}>{theme === "light" ? "🌙" : "☀️"}</button>
        <button onClick={() => setGearMenuOpen(o => !o)} aria-label="Menu" style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 14, zIndex: 20, background: T.white, border: `1px solid ${T.border}`, borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 6px rgba(0,0,0,0.08)" }}><Icon name="settings" size={17} color={T.teal} /></button>
        {gearMenuOpen && (() => {
          const acc = authState();
          const rowS = { display: "flex", alignItems: "center", gap: 11, width: "100%", background: "none", border: "none", padding: "12px 15px", cursor: "pointer", fontFamily: "Manrope", fontWeight: 700, fontSize: 14, color: T.ink, textAlign: "left" };
          const item = (emoji, label, sub, onClick) => (
            <button onClick={onClick} style={rowS} onMouseDown={e => e.preventDefault()}>
              <span style={{ fontSize: 17, width: 20, textAlign: "center" }}>{emoji}</span>
              <span><span>{label}</span>{sub && <span style={{ display: "block", fontFamily: "Inter", fontWeight: 400, fontSize: 11.5, color: T.inkSoft, marginTop: 1 }}>{sub}</span>}</span>
            </button>
          );
          return (<>
            <div onClick={() => setGearMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 18 }} />
            <div style={{ position: "absolute", top: "calc(56px + env(safe-area-inset-top, 0px))", right: 14, zIndex: 19, background: T.white, border: `1px solid ${T.border}`, borderRadius: 14, boxShadow: "0 12px 34px rgba(0,0,0,0.20)", overflow: "hidden", minWidth: 220 }}>
              <div style={{ padding: "10px 15px", borderBottom: `1px solid ${T.border}`, background: T.cream }}>
                {acc.status === "signedin"
                  ? <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft }}>Signed in as<div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.ink, marginTop: 1, wordBreak: "break-all" }}>{acc.email}</div></div>
                  : <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>Not signed in</div>}
              </div>
              {item("👤", "Profile", "Your details & reports", () => { setGearMenuOpen(false); openSettings("profile"); })}
              {item("⚙️", "Settings", "Reminders, backup & data", () => { setGearMenuOpen(false); openSettings("data"); })}
              {item("🔐", "Account", acc.status === "signedin" ? "Switch account or sign out" : "Sign in / create account", () => { setGearMenuOpen(false); openSettings("account"); })}
            </div>
          </>);
        })()}
        {tab === "today" && <TodayTab profile={profile} targets={targets} advice={advice} foodToday={foodForDate} habitToday={habitsForDate} supplementsToday={supplementsForDate} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} activities={activities} vitals={vitals} setVital={setVital} toggleHabit={toggleHabit} onToggleWalk={toggleWalk} supplements={supplements} onNavigate={setTab} demoCleared={demoCleared} clearDemo={clearDemo} selectedDate={selectedDate} setSelectedDate={setSelectedDate} />}
        {tab === "food" && <FoodCheckTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} foodForDate={foodForDate} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} addFoodEntry={addFoodEntry} deleteFoodEntry={deleteFoodEntry} updateFoodEntry={updateFoodEntry} splitFoodEntry={splitFoodEntry} customDishes={customDishes} saveCustomDish={saveCustomDish} metrics={metrics} periods={periods} targets={targets} advice={advice} />}
        {tab === "health" && <MyHealthTab metrics={metrics} periods={periods} supplementsToday={supplementsToday} toggleSupplement={(id) => toggleSupplement(tk, id)} supplements={supplements} onAddReport={() => openSettings("reports")} advice={advice} selectedDate={selectedDate} setSelectedDate={setSelectedDate} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} activities={activities} targets={targets} demoCleared={demoCleared} clearDemo={clearDemo} />}
        {tab === "habits" && <HabitsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} habitsForDate={habitsForDate} toggleHabit={toggleHabit} weekHabits={weekHabits} weekFood={weekFood} weekSupplements={weekSupplements} activities={activities} addActivity={addActivity} deleteActivity={deleteActivity} advice={advice} />}
        {tab === "supplements" && <SupplementsTab selectedDate={selectedDate} setSelectedDate={setSelectedDate} supplementsForDate={supplementsForDate} toggleSupplement={toggleSupplement} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} supplements={supplements} advice={advice} suggestedSupps={suggestedSupps} onAddSupplement={addSuggestedSupplement} />}
        {tab === "plan" && <PlanTab weekFood={weekFood} advice={advice} profile={profile} targets={targets} weeklyPlan={weeklyPlan} onRegeneratePlan={regeneratePlan} onSwapMeal={swapPlanMeal} onAddPlanItem={addPlanItem} onRemovePlanItem={removePlanItem} cycleLog={cycleLog} onLogPeriod={logPeriod} />}
        <div style={{ position: "fixed", bottom: 0, width: "100%", maxWidth: 420, background: T.tealSolid, display: "flex", alignItems: "center", justifyContent: "space-around", padding: "8px 8px 10px", zIndex: 30 }}>
          {NAV.map((t, i) => {
            if (t.center) return (
              <button key="log" onClick={() => setLogOpen(true)} aria-label="Log something" style={{ flex: "0 0 auto", background: T.saffron, border: "none", width: 52, height: 52, borderRadius: 18, display: "grid", placeItems: "center", cursor: "pointer", marginTop: -22, boxShadow: "0 8px 18px rgba(0,0,0,0.26)" }}>
                <Icon name="plus" size={26} color="#ffffff" />
              </button>
            );
            const active = tab === t.id;
            const col = active ? "#5FE3CE" : "rgba(255,255,255,0.75)";
            const onClick = t.id === "me" ? () => openSettings("profile") : () => setTab(t.id);
            return (
              <button key={t.id} onClick={onClick} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", flex: 1, minWidth: 0 }}>
                <Icon name={t.icon} size={20} color={col} />
                <span style={{ fontFamily: "Inter", fontSize: 12, fontWeight: active ? 700 : 500, color: col }}>{t.label}</span>
              </button>
            );
          })}
        </div>
        {logOpen && (
          <div className="askOverlay" onClick={() => setLogOpen(false)}>
            <div onClick={e => e.stopPropagation()} style={{ background: T.cream, width: "100%", maxWidth: 420, borderRadius: "22px 22px 0 0", padding: "12px 16px 26px" }}>
              <div style={{ width: 40, height: 4, borderRadius: 2, background: T.border, margin: "0 auto 14px" }} />
              <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 16, color: T.teal, marginBottom: 12 }}>What do you want to log?</div>
              {logOptions.map(o => (
                <button key={o.tab} onClick={() => { setTab(o.tab); setLogOpen(false); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 13, background: T.white, border: `1px solid ${T.border}`, borderRadius: 14, padding: "14px 15px", marginBottom: 10, cursor: "pointer" }}>
                  <Icon name={o.icon} size={20} color={T.saffron} />
                  <span style={{ fontFamily: "Inter", fontSize: 15, fontWeight: 600, color: T.ink }}>{o.label}</span>
                  <Icon name="chevron" size={16} color={T.inkSoft} style={{ marginLeft: "auto" }} />
                </button>
              ))}
            </div>
          </div>
        )}
        {notifsOpen && (
          <div className="askOverlay" onClick={() => setNotifsOpen(false)}>
            <div onClick={e => e.stopPropagation()} style={{ background: T.cream, width: "100%", maxWidth: 420, borderRadius: "22px 22px 0 0", padding: "12px 16px 26px", maxHeight: "72vh", overflowY: "auto" }}>
              <div style={{ width: 40, height: 4, borderRadius: 2, background: T.border, margin: "0 auto 14px" }} />
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 16, color: T.teal }}>Notifications</div>
                {notifications.length > 0 && <span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{notifications.length} for today</span>}
              </div>
              {notifications.length === 0 ? (
                <div style={{ fontFamily: "Inter", fontSize: 14, color: T.inkSoft, textAlign: "center", padding: "26px 0" }}>🎉 All caught up — nothing needs your attention right now.</div>
              ) : notifications.map((n, i) => (
                <button key={i} onClick={() => { if (n.tab) setTab(n.tab); setNotifsOpen(false); }} style={{ width: "100%", display: "flex", alignItems: "flex-start", gap: 12, background: T.white, border: `1px solid ${T.border}`, borderRadius: 14, padding: "13px 14px", marginBottom: 10, cursor: "pointer", textAlign: "left" }}>
                  <Icon name={n.icon} size={19} color={T.saffron} style={{ flexShrink: 0, marginTop: 1 }} />
                  <span style={{ fontFamily: "Inter", fontSize: 14, color: T.ink, lineHeight: 1.4 }}>{n.text}</span>
                </button>
              ))}
              <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 8, textAlign: "center" }}>Reminder scheduling &amp; per-type settings arrive with the notifications phase.</div>
            </div>
          </div>
        )}
        <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} initialSection={settingsSection} profile={profile} saveProfile={setProfile} goalToggles={goalToggles} saveGoalToggles={setGoalToggles} customGoals={customGoals} saveCustomGoals={setCustomGoals} metrics={metrics} saveMetrics={setMetrics} periods={periods} savePeriods={setPeriods} supplements={supplements} saveSupplements={setSupplements} onClearDate={clearDateData} onClearAll={clearAllData} onApplyDemoMonth={applyDemoMonth} onOpenWizard={() => { setSettingsOpen(false); setWizardOpen(true); }} profiles={profiles} activeId={activeId} onSwitchPerson={switchPerson} onAddPerson={addPerson} onRemovePerson={removePerson} notifSettings={notifSettings} saveNotifSettings={setNotifSettings} />
        {welcomeOpen && <WelcomeScreen onDone={(isNew) => { setWelcomeOpen(false); if (isNew) setWizardOpen(true); }} />}
        <OnboardingWizard open={wizardOpen} onClose={() => { setWizardOpen(false); setOnboarded(true); }} profile={profile} saveProfile={setProfile} goalToggles={goalToggles} saveGoalToggles={setGoalToggles} onGenerateSample={applySampleHistory} firstSetup={!onboarded} onFreshSetup={clearSeedForNewUser} onDone={() => { setWizardOpen(false); setOnboarded(true); }} />
      </div>
    </div>
  );
}

// Hydrate the IndexedDB-backed store into memory BEFORE first render so every useKV reads real
// data synchronously (and the one-time localStorage migration runs). Falls through on any failure.
initKV().catch(() => {}).then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script>
</body>
</html>
