// data — swap in another person's profile/report/supplements and all of this changes.
function computeAdvice(metrics, periods, supplements, goalToggles, profile) {
  // Union of markers flagged by their actual report AND the conditions they stated in onboarding,
  // so advice is personal from day one and gets sharper once real lab values are entered.
  const labKeys = flaggedMarkerKeys(metrics, periods);
  const condKeys = conditionMarkerKeys(profile);
  const flaggedKeys = [...new Set([...labKeys, ...condKeys])];
  const sugarKey = flaggedKeys.find(k => MARKER_INFO[k]?.drivers?.sugar != null);
  const cardioKeys = flaggedKeys.filter(k => k === "hdl" || k === "tg");
  const critNames = supplements.filter(s => s.critical).map(s => s.name.replace(/\s*\(.*?\)/, "").trim());
  return {
    flaggedKeys,
    avoidList: avoidFromKeys(flaggedKeys),
    eatMore: eatMoreFromKeys(flaggedKeys),
    dailyFocus: focusFromKeys(flaggedKeys),
    testNext: computeTestNext(metrics, periods),
    criticalSuppNames: critNames.length ? joinNames(critNames) : "your key supplements",
    sugarMarkerLabel: sugarKey ? MARKER_INFO[sugarKey].short : null,
    cardioMarkerLabel: cardioKeys.length ? joinNames([...new Set(cardioKeys.map(k => MARKER_INFO[k].short))]) : "your heart & metabolic markers",
    focusMarkerLabel: flaggedKeys.length ? (MARKER_INFO[flaggedKeys[0]]?.short || null) : null,
    weightGoal: !!(goalToggles || []).find(g => g.id === "weightloss" && g.active),
  };
}

    const fish = /fish|prawn|shrimp|salmon|tuna|meen|seafood|macher/.test(n);
    const egg = /\begg\b|omelette|bhurji|shakshuka|congee|jok/.test(n);

// is stable across reloads and regenerations (never Math.random, which would reshuffle).
function seededRand(seed) { const x = Math.sin(seed * 999.13 + 7.7) * 43758.5453; return x - Math.floor(x); }

// Rough default macros per meal slot, used when a Weekly-Menu entry is a compound
// description that doesn't map to a single FOOD_DB dish — this keeps the food charts and
// insights populated with real numbers instead of blanks. A small deterministic jitter
// (per day) gives day-to-day variation so the trends aren't perfectly flat.
const SLOT_DEFAULTS = {
  Breakfast: { calories: 300, protein: 11, fiber: 4, carbs: 42, sugar: 6 },
  Lunch:     { calories: 480, protein: 15, fiber: 6, carbs: 66, sugar: 8 },
  Dinner:    { calories: 430, protein: 12, fiber: 5, carbs: 58, sugar: 9 },

const SAFE_WORDS = ["oats", "idli", "chilla", "dhokla", "khaman", "salad", "dal", "daal", "khichdi", "sabji", "shak", "upma", "poha", "curd", "chhash", "handvo", "sambhar", "mung", "moong", "rajma", "chana", "chhole", "chole", "brocolli", "broccoli", "uttapam", "bajra", "jowar", "brown rice"];
const HEAVY_WORDS = ["fried", " fry", "vada", "bhajiya", "puri", "pakora", "samosa", "kachori", "pizza", "pasta", "pav", "cheese", "cream", "sandwich", "dabeli", "misal", "biryani", "schezwan", "chinese", "noodles", "manchurian", "wafer", "chilly fry", "sabudana", "cutlet", "quesadilla", "tikki", "chaat", "chat -", "panipuri", "bhel", "sevpuri"];
function demoVerdictFor(dishText) {
  const n = dishText.toLowerCase();
  if (/pizza|samosa|vada pav|manchurian|kachori|dabeli/.test(n)) return "avoid";
  if (HEAVY_WORDS.some(w => n.includes(w))) return "limit";
  if (SAFE_WORDS.some(w => n.includes(w))) return "safe";
  return "moderate";
}

// Matches a Weekly-Menu text entry against FOOD_DB first; if it's a compound description
// that can't be mapped to one dish, falls back to slot-based default macros + a keyword
// verdict (so every seeded meal still carries calories/protein/sugar). Kept synchronous —
// no API calls during bulk history generation. Always tagged demo:true.
function classifyDemoMeal(dishText, slot, dayIdx) {
  if (!dishText) return null;
  const key = normalizeWithAliases(dishText);
  for (const [k, entry] of Object.entries(FOOD_DB)) {
    const nk = normalizeWithAliases(k);
    if (key.includes(nk) || nk.includes(key)) {
      return { dish: dishText, calories: entry.calories, protein: entry.protein, fiber: entry.fiber, carbs: entry.carbs, sugar: entry.sugar, verdict: entry.verdict, demo: true };
    }
  }
  const base = SLOT_DEFAULTS[slot] || SLOT_DEFAULTS.Lunch;
  const scale = 0.85 + seededRand((dayIdx + 1) * (slot ? slot.length : 5)) * 0.3; // 0.85–1.15
  const verdict = demoVerdictFor(dishText);
  const sugarBoost = verdict === "avoid" ? 10 : verdict === "limit" ? 5 : 0;
  return {
    dish: dishText,
    calories: Math.round(base.calories * scale), protein: Math.round(base.protein * scale),
    fiber: Math.round(base.fiber * scale), carbs: Math.round(base.carbs * scale),
    sugar: Math.round(base.sugar * scale) + sugarBoost, verdict, demo: true,
  };
}

// Generates real-looking history from Jul 1, 2026 through `endKey` (default: today), using
// her real Weekly-Menu rotation (WEEKLY_MENU_LOG, digested from the Menu25 "Weekly menu"
// sheet) for food, plus the specified activity/supplement pattern:
//   • Jul 18–28: a brisk walk every day (8k–20k steps) + 20-min yoga on some days, no gym,
//     and every supplement taken EXCEPT Turmeric+Piperine, Silymarin and Zinc.
//   • Every other week: about half the days a 30-min walk, the rest no activity (no gym,
//     nothing else), and supplements taken less consistently.
//   • Sundays are rest days (no walk).
// Pure function — returns data, doesn't touch storage — so it's easy to review and easy to
// wipe via the existing "Clear all history" / "Clear a specific date" controls.
function generateHistory(endKey) {
  const foodByDate = {}, activitiesByDate = {}, habitsByDate = {}, supplementsByDate = {};
  const start = new Date(2026, 6, 1);            // Jul 1, 2026
  const end = endKey ? new Date(endKey + "T00:00:00") : new Date();
  const highStart = new Date(2026, 6, 18), highEnd = new Date(2026, 6, 28); // Jul 18–28

  let i = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1), i++) {
    const dk = ymd(d);
    const dow = d.getDay(); // 0 = Sunday
    const inHigh = d >= highStart && d <= highEnd;
    const menuDay = WEEKLY_MENU_LOG[i % WEEKLY_MENU_LOG.length];

    // ---- Food (from her real weekly-menu rotation) ----
    const entries = [];
    [["b", "Breakfast"], ["l", "Lunch"], ["d", "Dinner"]].forEach(([mk, slot]) => {
      const classified = classifyDemoMeal(menuDay[mk], slot, i);
      if (classified) entries.push({ ...classified, mealSlot: slot, time: d.getTime() });
    });
    if (entries.length) foodByDate[dk] = entries;

    // ---- Activity + habits ----
    const acts = [];
    const habits = {};
    if (dow === 0) {
      habits.walk = false; // Sunday rest day
    } else if (inHigh) {
      const steps = 8000 + Math.floor(seededRand(i * 3.1) * 12000); // 8k–20k
      acts.push({ type: "Walk", duration: Math.round(steps / 130), time: d.getTime(), demo: true, note: `~${steps.toLocaleString()} steps` });
      if (seededRand(i * 5.7) < 0.45) acts.push({ type: "Yoga", duration: 20, time: d.getTime(), demo: true });
      habits.walk = true; habits.noAlcohol = true; habits.water = true;
      habits.noFried = seededRand(i * 2.3) < 0.7; habits.noSugar = seededRand(i * 4.9) < 0.6;
    } else {
      if (seededRand(i * 6.3) < 0.5) { acts.push({ type: "Walk", duration: 30, time: d.getTime(), demo: true }); habits.walk = true; }
      else habits.walk = false;
      habits.noAlcohol = seededRand(i * 1.7) < 0.7; habits.water = seededRand(i * 3.9) < 0.6;
      habits.noFried = seededRand(i * 2.1) < 0.5; habits.noSugar = seededRand(i * 5.3) < 0.45;
    }
    if (acts.length) activitiesByDate[dk] = acts;
    habitsByDate[dk] = habits;

    // ---- Supplements (no demo flag inside — the object is counted for adherence) ----
    const supp = {};
    SUPPLEMENTS_SEED.forEach((s, si) => {
      if (s.time === "weekly") { supp[s.id] = dow === 1; return; }       // weekly D3 → Mondays
      if (inHigh) supp[s.id] = !HIGH_WINDOW_SKIP.includes(s.id);
      else supp[s.id] = seededRand(i * 10 + si) < (CRITICAL_SUPP_IDS.includes(s.id) ? 0.65 : 0.3);
    });
    supplementsByDate[dk] = supp;
  }
  return { foodByDate, activitiesByDate, habitsByDate, supplementsByDate };
}

function generateTailoredHistory(profile, days) {

}

function localAnswer(question, customDishes) {
  const q = question.toLowerCase();
  for (const entry of FAQ_DB) {
    if (entry.keywords.some(k => q.includes(k))) return entry.answer;
  }
  for (const [dish, info] of Object.entries(FOOD_DB)) {
    if (q.includes(dish)) {
      const meta = verdictMetaMap()[info.verdict] || verdictMetaMap().moderate;
      const tip = info.healthierTip || suggestSwap(dish);
      return `${meta.emoji} ${meta.label} — ${info.reason} Portion: ${info.portion}.${tip ? " " + tip : ""}`;
    }
  }
  if (customDishes) {
    for (const [dish, info] of Object.entries(customDishes)) {
      if (q.includes(dish)) {
        const meta = verdictMetaMap()[info.verdict] || verdictMetaMap().moderate;
        return `${meta.emoji} ${meta.label} — from your saved dishes. ${info.reason}${info.healthierTip ? " " + info.healthierTip : ""}`;
      }
    }
  }
  return null;
}

// Deterministic verdict from macros — rules-based on current priorities, not an AI
// judgment. Used for dishes looked up via the free nutrition API or pasted text.
function classifyMacros(dishName, macros) {
  const name = dishName.toLowerCase();
  const notFriedOverride = /\bair.?(fry|fri)|baked|steamed|grilled|boiled|roasted(?! peanuts)/.test(name);
  const friedWords = ["fried", " fry", "vada", "bhajiya", "puri", "pakora", "chips", "samosa", "kachori", "bhatura"];
  const isFried = !notFriedOverride && friedWords.some(k => name.includes(k));
  const sugar = macros.sugar || 0, fat = macros.fat || 0, carbs = macros.carbs || 0;
  if (isFried || sugar >= 15) return "avoid";
  if (sugar >= 8 || fat >= 18 || carbs >= 55) return "limit";
  if (sugar >= 4 || fat >= 10 || carbs >= 35) return "moderate";
  return "safe";
}

// Detects improving modifiers in a dish name — "air fried", "sugar free", "brown rice",
// "less oil", "with ghee", "extra vegetables" etc — and upgrades a base verdict
// accordingly. Applied on top of both curated-DB matches and freshly looked-up dishes,
// so "air fried veg cutlet" or "sugar free besan laddoo" get credit for the swap
// already made, instead of being flagged the same as the unmodified dish.
const VERDICT_ORDER = ["avoid", "limit", "moderate", "safe"];
const IMPROVING_MODIFIERS = [
  { match: ["brown bread", "brown rice", "whole wheat", "whole grain", "wholegrain", "multigrain", "jowar", "bajra", "ragi", "millet", "oats aata", "mix aata", "atta"], note: "whole grain / millet base instead of refined flour" },
  { match: ["air fried", "air-fried", "air fry", "air fryer", "baked", "steamed", "grilled", "boiled"], note: "not deep-fried" },
  { match: ["sugar free", "sugar-free", "no sugar", "jaggery-free", "date sweetened", "date-sweetened", "stevia"], note: "reduced or no added sugar" },
  { match: ["less oil", "low oil", "minimal oil", "no oil"], note: "less oil than usual" },
  { match: ["with ghee"], note: "ghee instead of butter or refined oil" },
  { match: ["extra vegetables", "more vegetables", "loaded with veg", "broccoli", "beetroot", "capsicum", "added vegetables"], note: "extra vegetables added" },
];
function detectModifiers(dishName) {
  const name = dishName.toLowerCase();
  const notes = [];
  for (const m of IMPROVING_MODIFIERS) {
    if (m.match.some(k => name.includes(k))) notes.push(m.note);
  }
  return notes;
}
function applyModifierUpgrade(baseVerdict, dishName) {
  const notes = detectModifiers(dishName);
  if (notes.length === 0) return { verdict: baseVerdict, notes: [] };
  // cap the upgrade at 2 tiers regardless of how many modifiers match, so e.g.
  // "air fried sugar free jalebi" doesn't get waved through as fully "safe"
  const steps = Math.min(2, notes.length);
  const normalizedBase = baseVerdict === "caution" ? "moderate" : baseVerdict; // "caution" and "moderate" render identically but only "moderate" is in VERDICT_ORDER
  const baseIdx = VERDICT_ORDER.indexOf(normalizedBase);
  const idx = Math.min(VERDICT_ORDER.length - 1, (baseIdx === -1 ? 0 : baseIdx) + steps);
  return { verdict: VERDICT_ORDER[idx], notes };
}
// Strips recognized modifier phrases from a query so the *base dish* can still be
// matched against the curated list/corpus even when modifiers are typed inline
// (e.g. "air fried vada pav" -> matches "vada pav", then the verdict is upgraded).
function stripModifiers(dishName) {
  let name = dishName;
  for (const m of IMPROVING_MODIFIERS) {
    for (const k of m.match) {
      name = name.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), "");
    }
  }
  // clean up leftover connector words the modifier phrases leave behind
  // (e.g. "aloo paratha with jowar atta" -> after removing "jowar"/"atta" -> "aloo paratha with")
  name = name.replace(/\b(with|using|made|instead of|and|no)\b/gi, "");
  return name.replace(/\s+/g, " ").trim() || dishName;
}

// Given the CURRENT top-priority markers (from the latest report — updates automatically
// if the report changes) and a dish's macro profile, generates good/bad tags. Approximate
// and rules-based on purpose — not a clinical claim, just a rough macro-level signal.
function computeDynamicTags(macros, priorities) {
  const tags = [];
  const sugar = macros.sugar, fat = macros.fat;
  for (const p of priorities || []) {
    const drivers = MARKER_INFO[p.key]?.drivers;
    if (!drivers) continue;
    let verdict = null;
    if (drivers.sugar != null && sugar != null) { if (sugar >= drivers.sugar) verdict = "bad"; else if (sugar <= 3) verdict = "good"; }
    if (verdict == null && drivers.fat != null && fat != null) { if (fat >= drivers.fat) verdict = "bad"; else if (fat <= 5) verdict = "good"; }
    if (verdict) tags.push({ label: p.label, verdict });
  }
  return tags;
}

  { match: ["noodles", "chow mein", "hakka"], exclude: ["whole wheat noodles", "millet noodles"], tip: "Whole wheat or millet noodles with extra vegetables and less oil is a lighter version of the same dish." },

function suggestSwap(dishName) {
  const name = dishName.toLowerCase();
  for (const rule of STAPLE_SWAPS) {
    if (rule.match.some(k => name.includes(k)) && !rule.exclude.some(k => name.includes(k))) return rule.tip;
  }
  return null;
}

// Free nutrition lookup via your own backend proxy (calls a free-tier nutrition API,
// never Anthropic). Returns null on any failure so the caller can fall back gracefully.
async function lookupNutrition(dish) {
  try {
    const res = await fetch("/api/nutrition", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dish }),
    });
    const data = await res.json();
    if (!res.ok || data.error) return null;
    return data;
  } catch {
    return null;
  }
}

// Loads once at startup — a ~6,700-name vegetarian dish corpus (dishes.json, built from
// the Vegetarian Dish Database) used as a spelling/typo dictionary AND to recognize dishes
// beyond the curated FOOD_DB. Shape: { cuisines:[...], dishes:[[name, cuisineIdx], ...] }.
// The database's own 1–5 ratings are templated (nearly every dish scores ~4/safe), so they
// are deliberately NOT used for verdicts — verdicts come from the app's own keyword rules.
let DISH_CORPUS = null;
// Single-file build: the databases can be embedded in the page as <script type="application/json">
// tags so the app needs NO fetch — it then works offline, from a file://, and when deployed as just
// index.html with no JSON files beside it. Falls back to fetch when not embedded (split build).
function readEmbeddedJSON(id) {
  try { const el = document.getElementById(id); if (el && el.textContent && el.textContent.trim()) return JSON.parse(el.textContent); } catch (e) {}
  return null;
}
async function loadDishCorpus() {
  if (DISH_CORPUS) return DISH_CORPUS;
  const emb = readEmbeddedJSON("__dishes_data");
  if (emb) { DISH_CORPUS = emb; return DISH_CORPUS; }
  try {
    const res = await fetch("dishes.json");
    DISH_CORPUS = await res.json();
  } catch {
    DISH_CORPUS = { cuisines: [], dishes: [] };
  }
  return DISH_CORPUS;
}

// 1,479-dish rating corpus — unlike the name-only corpus above, this one's ratings do
// differentiate real dishes (jalebi scores badly, dhokla scores well), so it's used as a
// rough verdict fallback when no real macro data is available. Always labeled "approximate"
// in the UI — the explanatory text behind these ratings is templated, not dish-specific.
let DISH_RATINGS = null;
async function loadDishRatings() {
  if (DISH_RATINGS) return DISH_RATINGS;
  try {
    const res = await fetch("dishratings.json");
    DISH_RATINGS = await res.json();

    DISH_RATINGS = { subs: [], portions: [], dishes: [] };
  }

function ratingToVerdict(avg) {
  if (avg <= 1.5) return "avoid";
  if (avg <= 2.5) return "limit";
  if (avg <= 3.5) return "moderate";
  return "safe";
}
function lookupDishRating(query, ratings) {
  const nq = normalizeWithAliases(query);
  if (!ratings || !ratings.dishes) return null;
  // exact pass first
  for (const [name, avg, subIdx, portionIdx] of ratings.dishes) {
    if (normalizeWithAliases(name) === nq) {
      return { name, verdict: ratingToVerdict(avg), substitution: ratings.subs[subIdx], portion: ratings.portions[portionIdx] };
    }
  }
  // fuzzy fallback — same tolerance approach as the spelling corpus
  let best = null, bestDist = Infinity, bestRow = null;
  for (const row of ratings.dishes) {
    const nk = normalizeWithAliases(row[0]);
    const dist = levenshtein(nq, nk);

/* ============================== STORAGE (IndexedDB-backed) ==============================

   the extension doesn't touch. An in-memory mirror (KV_MEM) keeps reads synchronous so useKV and

/* ============================== CLOUD SYNC (Firebase, opt-in) ==============================
   Optional cross-device sync. The user pastes their OWN Firebase config + a shared "sync code" in
   Settings → Data; the whole app keyspace lives in one Firestore doc keyed by that code and stays
   live via onSnapshot. Needs internet + the Firebase CDN — works on the hosted/Vercel/local app but
   NOT inside the sandboxed artifact (CDN blocked), where it degrades gracefully with a clear error. */
let FB = null;                                          // { app, db, auth, ref, unsub } when connected
let SYNC = { status: "off", error: null, at: null };   // off | connecting | live | error
const SYNC_CLIENT = "c" + Math.random().toString(36).slice(2);  // used to ignore our own snapshot echoes
function syncState() { return SYNC; }
function dispatchSync(patch) { SYNC = { ...SYNC, ...patch }; try { window.dispatchEvent(new CustomEvent("sync-state")); } catch (e) {} }
function loadFirebaseSDK() {
  if (window.firebase && window.firebase.firestore) return Promise.resolve(true);
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const files = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"];
  return files.reduce((p, f) => p.then(() => new Promise((res, rej) => {

    s.onerror = () => rej(new Error("Couldn't load Firebase (offline, or blocked in this hosted view).")); document.head.appendChild(s);
  })), Promise.resolve()).then(() => !!(window.firebase && window.firebase.firestore));
}
function syncDocId(code) { let h = 0; const s = "hc:" + (code || ""); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return "s" + h.toString(36); }
// Accept either strict JSON or the whole "const firebaseConfig = { apiKey: … };" snippet the console gives.
function parseFirebaseConfig(text) {
  if (!text) return null;
  let t = String(text).trim();
  // The console snippet wraps the object in imports (`import { initializeApp } …`), so anchor on the
  // word "firebaseConfig" and take the `{ … }` AFTER it — not the first `{` on the page.
  const anchor = t.search(/firebaseConfig/i);
  const from = anchor >= 0 ? t.indexOf("{", anchor) : t.indexOf("{");
  const to = t.lastIndexOf("}");
  if (from >= 0 && to > from) t = t.slice(from, to + 1);
  try { return JSON.parse(t); } catch (e) {}
  try { return (new Function("return (" + t + ")"))(); } catch (e) {}
  return null;
}
// "profiles:active" (which profile is on screen) is DEVICE-LOCAL — never sync it, or signing in on a
// device could silently switch you to a different profile and make your data look gone.
function isSyncedKey(k) { return isAppKey(k) && !k.startsWith("sync:") && k !== "profiles:active" && k !== "account:on"; }
function gatherAppData() { const d = {}; Object.keys(KV_MEM).forEach(k => { if (isSyncedKey(k)) d[k] = KV_MEM[k]; }); return d; }
function applyRemote(data) { if (!data) return; Object.keys(data).forEach(k => { if (!isSyncedKey(k)) return; try { if (JSON.stringify(KV_MEM[k]) !== JSON.stringify(data[k])) kvSetLocal(k, data[k]); } catch (e) { kvSetLocal(k, data[k]); } }); }
// True if THIS device already holds real data in ANY profile (self or an added person). Used so a
// device with data never gets overwritten by an emptier cloud copy on sign-in.
function deviceHasData() {
  for (const k of Object.keys(KV_MEM)) {
    try {
      if (/(^|:)week:foodlog$|(^|:)activities:log$|(^|:)week:supplements$|(^|:)week:habits$/.test(k) && Object.keys(KV_MEM[k] || {}).length) return true;
      if (/(^|:)profile:data$/.test(k) && KV_MEM[k] && KV_MEM[k].name) return true;
      if (/(^|:)reports:metrics$/.test(k) && (KV_MEM[k] || []).some(m => (m.points || []).some(v => v != null))) return true;
    } catch (e) {}
  }

}
let _pushTimer = null;
function syncPushSoon() { if (!FB) return; clearTimeout(_pushTimer); _pushTimer = setTimeout(syncPushNow, 900); }
function syncPushNow() { if (!FB) return; const payload = { data: gatherAppData(), updatedAt: Date.now(), origin: SYNC_CLIENT }; const contact = kvGet("account:contact", null); if (contact) payload.contact = contact; FB.ref.set(payload, { merge: true }).catch(e => dispatchSync({ status: "error", error: String(e && e.message || e) })); }
async function startSync(config, code) {
  dispatchSync({ status: "connecting", error: null });
  try {
    if (!config || !config.projectId || !config.apiKey) throw new Error("Firebase config looks incomplete (needs at least apiKey & projectId).");
    if (!code || String(code).length < 4) throw new Error("Choose a sync code of at least 4 characters (same on every device).");
    await loadFirebaseSDK();
    const fb = window.firebase;
    const app = (fb.apps && fb.apps.length) ? fb.app() : fb.initializeApp(config);
    await fb.auth().signInAnonymously();
    const ref = fb.firestore().collection("synced").doc(syncDocId(code));
    FB = { app, db: fb.firestore(), auth: fb.auth(), ref, unsub: null };
    const snap = await ref.get();
    if (snap.exists && snap.data() && snap.data().data) applyRemote(snap.data().data);        // pull existing first
    await ref.set({ data: gatherAppData(), updatedAt: Date.now(), origin: SYNC_CLIENT }, { merge: true }); // then push so both sides exist
    FB.unsub = ref.onSnapshot(s => { const d = s.data(); if (d && d.data && d.origin !== SYNC_CLIENT) applyRemote(d.data); });
    kvSetLocal("sync:config", config); kvSetLocal("sync:code", code); kvSetLocal("sync:on", true);   // remember for next launch
    dispatchSync({ status: "live", error: null, at: Date.now() });
    return true;
  } catch (e) { FB = null; dispatchSync({ status: "error", error: String(e && e.message || e) }); return false; }
}
function stopSync(forget) {
  try { if (FB && FB.unsub) FB.unsub(); } catch (e) {}
  FB = null; kvSetLocal("sync:on", false);
  if (forget) { kvSetLocal("sync:config", null); kvSetLocal("sync:code", null); }
  dispatchSync({ status: "off", error: null });
}
function autoStartSync() { try { if (kvGet("sync:on", false) && kvGet("sync:config", null) && kvGet("sync:code", null)) startSync(kvGet("sync:config", null), kvGet("sync:code", null)); } catch (e) {} }

/* ============================== ACCOUNTS (Firebase email/password) ==============================
   Real per-user accounts: sign in with email+password and your data lives under users/{uid} in
   Firestore, isolated by security rules and synced live — automatic cross-device (no sync code).
   The Firebase config is embedded (public by design; protected by per-uid rules) so a new person
   just signs up. Only works where Firebase can load (Vercel/local, not the sandboxed artifact). */
const ACCOUNT_FB_CONFIG = {
  apiKey: "AIzaSyBbNmCmC4eiO94Sim_8h1x4MG5lcECkbes",
  authDomain: "health-tracker-f9392.firebaseapp.com",
  projectId: "health-tracker-f9392",
  storageBucket: "health-tracker-f9392.firebasestorage.app",
  messagingSenderId: "490510742498",
  appId: "1:490510742498:web:830a7dc938623038da7fbb",
};
let AUTH = { status: "signedout", email: null, uid: null, error: null }; // signedout | working | signedin | error
let AUTH_INITED = false;
function authState() { return AUTH; }
function dispatchAuth(patch) { AUTH = { ...AUTH, ...patch }; try { window.dispatchEvent(new CustomEvent("auth-state")); } catch (e) {} }
async function ensureFirebaseApp() {
  await loadFirebaseSDK();
  const fb = window.firebase;
  if (!(fb.apps && fb.apps.length)) fb.initializeApp(ACCOUNT_FB_CONFIG);
  return fb;
}
function authMsg(e) {
  const c = (e && e.code) || "";
  if (/email-already-in-use/.test(c)) return "That email already has an account — try Sign in instead.";
  if (/invalid-email/.test(c)) return "That doesn't look like a valid email.";
  if (/weak-password/.test(c)) return "Password should be at least 6 characters.";
  if (/wrong-password|invalid-credential|invalid-login/.test(c)) return "Wrong email or password.";
  if (/user-not-found/.test(c)) return "No account with that email — create one first.";
  if (/operation-not-allowed/.test(c)) return "Email sign-in isn't enabled in Firebase yet (turn on the Email/Password provider).";
  if (/too-many-requests/.test(c)) return "Too many attempts — wait a minute and try again.";
  if (/network/.test(c)) return "Network problem — check your connection (and that you're not on the claude.ai preview).";
  return (e && e.message) || "Something went wrong.";
}
// Sync the signed-in user's data to users/{uid} — reuses the sync engine's apply/gather/push.
// Rough "how much real data" score — so signing in never overwrites a device that already has
// your profile/reports with an emptier cloud copy.
function dataScore(d) {
  if (!d) return 0;
  let s = 0;
  const days = k => { try { return Object.keys(d[k] || {}).length; } catch (e) { return 0; } };
  s += days("week:foodlog") + days("activities:log") + days("week:supplements") + days("week:habits");
  try { const m = d["reports:metrics"]; if (Array.isArray(m)) s += m.reduce((a, x) => a + ((x.points || []).filter(v => v != null).length), 0); } catch (e) {}
  try { const p = d["profile:data"]; if (p && p.name) s += 2; if (p && (p.conditions || []).length) s += (p.conditions || []).length; } catch (e) {}
  return s;
}
async function startAccountSync(uid) {
  const fb = window.firebase;
  const ref = fb.firestore().collection("users").doc(uid);
  FB = { app: fb.app(), db: fb.firestore(), auth: fb.auth(), ref, unsub: null };
  const snap = await ref.get();
  const remote = (snap.exists && snap.data() && snap.data().data) ? snap.data().data : null;
  // RICHER SIDE WINS. Compare how much real data each side holds and adopt whichever is fuller, so
  // neither direction can wipe the other: a second device (or an empty link) pulls your cloud data;
  // a device that holds your real profile/history keeps it and pushes it up. Crucially this also
  // stops the demo SEED from ever overwriting a real cloud account (the old deviceHasData() check
  // treated a seed-only device as "has data" and let it push the demo over your real data).
  const localData = gatherAppData();
  if (remote && dataScore(remote) >= dataScore(localData)) applyRemote(remote);
  const payload = { data: gatherAppData(), updatedAt: Date.now(), origin: SYNC_CLIENT };
  const contact = kvGet("account:contact", null); if (contact) payload.contact = contact; // name+phone of who registered (owner-visible in Firestore)
  await ref.set(payload, { merge: true }); // push the winner up
  FB.unsub = ref.onSnapshot(s => { const d = s.data(); if (d && d.data && d.origin !== SYNC_CLIENT) applyRemote(d.data); });
}
// Attach the auth-state listener once; on sign-in start per-uid sync, on sign-out stop it.
async function authInit() {
  if (AUTH_INITED) return; AUTH_INITED = true;
  const fb = await ensureFirebaseApp();
  fb.auth().onAuthStateChanged(async (user) => {
    if (user) {
      dispatchAuth({ status: "signedin", email: user.email, uid: user.uid, error: null });
      kvSetLocal("account:on", true);
      try { await startAccountSync(user.uid); } catch (e) { dispatchAuth({ status: "error", error: authMsg(e) }); }
    } else {
      try { if (FB && FB.unsub) FB.unsub(); } catch (e) {}
      dispatchAuth({ status: "signedout", email: null, uid: null });
    }
  });
}
async function authSignUp(email, pass, contact) {
  dispatchAuth({ status: "working", error: null });
  try {
    const fb = await ensureFirebaseApp(); await authInit();
    // Capture the sign-up name + phone BEFORE creating the account, so onAuthStateChanged/sync can
    // stamp them onto the cloud user doc (owner can see who registered) and prefill the profile name.
    if (contact && (contact.name || contact.phone)) {
      const rec = { name: (contact.name || "").trim(), phone: (contact.phone || "").trim(), email: (email || "").trim(), at: Date.now() };
      kvSetLocal("account:contact", rec);
      try { const pd = kvGet("profile:data", null) || {}; if (rec.name) kvSetLocal("profile:data", { ...pd, name: rec.name }); } catch (e) {}
    }
    await fb.auth().createUserWithEmailAndPassword((email || "").trim(), pass); return true;
  }
  catch (e) { dispatchAuth({ status: "error", error: authMsg(e) }); return false; }
}
async function authSignIn(email, pass) {
  dispatchAuth({ status: "working", error: null });
  try { const fb = await ensureFirebaseApp(); await authInit(); await fb.auth().signInWithEmailAndPassword((email || "").trim(), pass); return true; }
  catch (e) { dispatchAuth({ status: "error", error: authMsg(e) }); return false; }
}
async function authSignOut() {
  try { if (FB && FB.unsub) FB.unsub(); } catch (e) {} FB = null;
  kvSetLocal("account:on", false);
  try { const fb = window.firebase; if (fb) await fb.auth().signOut(); } catch (e) {}
  dispatchAuth({ status: "signedout", email: null, uid: null, error: null });
}
// On launch, resume a previous account session (Firebase persists the login itself).
function autoStartAccount() { try { if (kvGet("account:on", false)) authInit(); } catch (e) {} }

function CalendarPicker({ selectedDate, onSelect, onClose, weekFood, activities, weekSupplements }) {
  const [viewDate, setViewDate] = useState(new Date(selectedDate + "T00:00:00"));
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMo = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMo; d++) cells.push(d);
  function dk(d) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }

  return (
    <div className="askOverlay" onClick={onClose}>
      <div className="askPanel" onClick={e => e.stopPropagation()} style={{ height: "auto", maxHeight: "82vh", borderRadius: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", borderBottom: `1px solid ${T.border}` }}>
          <button onClick={() => setViewDate(new Date(year, month - 1, 1))} style={{ background: "none", border: "none" }}><Icon name="chevron" size={18} color={T.teal} style={{ transform: "rotate(180deg)" }} /></button>
          <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, color: T.teal }}>{viewDate.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</div>
          <button onClick={() => setViewDate(new Date(year, month + 1, 1))} style={{ background: "none", border: "none" }}><Icon name="chevron" size={18} color={T.teal} /></button>
          <button onClick={onClose} style={{ background: "none", border: "none", marginLeft: 8 }}><Icon name="x" size={18} color={T.inkSoft} /></button>
        </div>
        <div style={{ padding: 16, overflowY: "auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 6 }}>
            {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i} style={{ textAlign: "center", fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
            {cells.map((d, i) => {
              if (d == null) return <div key={i} />;
              const key = dk(d);
              const isFuture = key > todayStr;
              const hasFood = (weekFood[key] || []).length > 0;
              const hasAct = (activities[key] || []).length > 0;
              const hasSupp = Object.values(weekSupplements[key] || {}).some(Boolean);
              const hasAnyData = hasFood || hasAct || hasSupp;
              const isSelected = key === selectedDate;
              const isToday = key === todayStr;
              return (
                <button key={i} disabled={isFuture} onClick={() => { onSelect(key); onClose(); }} style={{
                  aspectRatio: "1", border: isSelected ? `2px solid ${T.saffron}` : isToday ? `1px solid ${T.teal}` : "1px solid transparent",
                  borderRadius: 8, background: isSelected ? T.tealPale : hasAnyData ? T.forestPale : T.white, opacity: isFuture ? 0.3 : 1, cursor: isFuture ? "default" : "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 2
                }}>
                  <span style={{ fontFamily: "Inter", fontSize: 12, fontWeight: hasAnyData ? 700 : 400, color: T.ink }}>{d}</span>
                  <div style={{ display: "flex", gap: 2, marginTop: 2 }}>
                    {hasFood && <span style={{ width: 4, height: 4, borderRadius: 2, background: T.forest, display: "inline-block" }} />}
                    {hasAct && <span style={{ width: 4, height: 4, borderRadius: 2, background: T.tealSolid, display: "inline-block" }} />}
                    {hasSupp && <span style={{ width: 4, height: 4, borderRadius: 2, background: T.amber, display: "inline-block" }} />}
                  </div>
                </button>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 14, fontFamily: "Inter", fontSize: 12, color: T.inkSoft, flexWrap: "wrap" }}>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: T.forest, marginRight: 4 }} />Food logged</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: T.tealSolid, marginRight: 4 }} />Activity logged</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: T.amber, marginRight: 4 }} />Supplement taken</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== SIMPLE CUSTOM CHARTS ============================== */
function MiniLineChart({ periods, series, width = 560, height = 220 }) {
  const padL = 34, padB = 24, padT = 10, padR = 10;
  const allVals = series.flatMap(s => s.points.filter(v => v != null));
  const min = Math.min(...allVals, 0), max = Math.max(...allVals, 1);
  const x = (i) => padL + (i / (periods.length - 1)) * (width - padL - padR);
  const y = (v) => padT + (1 - (v - min) / (max - min || 1)) * (height - padT - padB);
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {[0, 0.5, 1].map((f, i) => <line key={i} x1={padL} x2={width - padR} y1={padT + f * (height - padT - padB)} y2={padT + f * (height - padT - padB)} stroke={T.border} strokeWidth="1" />)}
      {periods.map((p, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{p}</text>)}
      {series.map(s => {
        const segments = []; let current = [];
        s.points.forEach((v, i) => { if (v == null) { if (current.length) segments.push(current); current = []; } else current.push([x(i), y(v)]); });
        if (current.length) segments.push(current);
        return segments.map((seg, si) => <polyline key={s.key + si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />);
      })}
      {series.map(s => s.points.map((v, i) => v != null && <circle key={s.key + i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />))}
    </svg>
  );
}
function MiniBarChart({ bars, height = 100 }) {
  const width = 320, padB = 18, padT = 6;
  const max = Math.max(...bars.map(b => Math.abs(b.value)), 1);
  const bw = (width / bars.length) * 0.6;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      {bars.map((b, i) => {
        const slot = width / bars.length; const cx = slot * i + slot / 2;
        const h = b.value < 0 ? 6 : Math.max(4, (Math.abs(b.value) / max) * (height - padB - padT));
        return (
          <g key={i}>
            <rect x={cx - bw / 2} y={height - padB - h} width={bw} height={h} rx="3" fill={b.color} opacity={b.opacity ?? 1} />
            <text x={cx} y={height - 4} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{b.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Two-line comparison chart (this period vs the one before). Handles nulls (gaps) and
// auto-scales; used for week day-by-day and month week-by-week comparisons across tabs.
function TwoLineChart({ labels, a, b, aLabel, bLabel, aColor = "#EA7A3B", bColor = "#3B82F6", height = 180, yMax, unit = "" }) {
  const width = 560, padL = 34, padB = 34, padT = 12, padR = 12;
  const vals = [...(a || []), ...(b || [])].filter(v => v != null);
  const max = yMax || Math.max(...vals, 1);
  const n = Math.max(1, labels.length - 1);
  const x = i => padL + (i / n) * (width - padL - padR);
  const y = v => padT + (1 - v / (max || 1)) * (height - padT - padB);
  function draw(arr, color) {
    if (!arr) return null;
    const segs = []; let cur = [];
    arr.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    return (
      <g>
        {segs.map((seg, si) => <polyline key={si} points={seg.map(p => p.join(",")).join(" ")} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />)}
        {arr.map((v, i) => v != null && <circle key={i} cx={x(i)} cy={y(v)} r="3" fill={color} />)}
      </g>
    );
  }
  return (
    <div>
      <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
        {[0, 0.5, 1].map((f, i) => { const yy = padT + f * (height - padT - padB); return <g key={i}><line x1={padL} x2={width - padR} y1={yy} y2={yy} stroke={T.border} strokeWidth="1" /><text x={padL - 6} y={yy + 3} fontSize="9" fill={T.inkSoft} textAnchor="end" fontFamily="Inter">{Math.round(max - f * max)}{unit}</text></g>; })}
        {labels.map((l, i) => <text key={i} x={x(i)} y={height - 6} fontSize="9" fill={T.inkSoft} textAnchor="middle" fontFamily="Inter">{l}</text>)}
        {draw(b, bColor)}
        {draw(a, aColor)}
      </svg>
      <div style={{ display: "flex", gap: 14, marginTop: 4, flexWrap: "wrap" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}><span style={{ width: 14, height: 3, borderRadius: 2, background: aColor, display: "inline-block" }} />{aLabel}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}><span style={{ width: 14, height: 3, borderRadius: 2, background: bColor, display: "inline-block" }} />{bLabel}</span>
      </div>
    </div>
  );
}
// Top-of-tab colored callout carrying a { tone, text } headline insight.
function InsightCallout({ insight, icon = "sparkles", style }) {

// A single "this week vs last week" number with a delta chip.
function MetricDelta({ label, cur, prev, unit = "", goodWhenLower = false }) {
  const delta = cur != null && prev != null ? Math.round((cur - prev) * 10) / 10 : null;
  const good = delta == null || delta === 0 ? null : goodWhenLower ? delta < 0 : delta > 0;
  return (
    <div style={{ flex: 1, minWidth: 76 }}>
      <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>{cur ?? "—"}{cur != null ? unit : ""}</div>
      <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>{label}</div>
      {delta != null && delta !== 0 && <div style={{ fontFamily: "Inter", fontSize: 12, color: good ? T.forest : T.alert }}>{delta > 0 ? "▲" : "▼"} {Math.abs(delta)}{unit} vs last wk</div>}
    </div>
  );
}

/* Score trends — moved off the Today home screen so it stays scannable; shown on Progress. */
function TrendsSection({ selectedDate, weekFood, weekHabits, weekSupplements, activities, supplements, targets, demoCleared, clearDemo }) {
  const weekBars = [6, 5, 4, 3, 2, 1, 0].map(offset => {
    const key = dateKeyOffset(offset);
    const rF = weekFood[key], rH = weekHabits[key], rS = weekSupplements[key];
    const hasReal = (rF && rF.length > 0) || (rH && Object.keys(rH).length > 0) || (rS && Object.keys(rS).length > 0);
    const d = new Date(); d.setDate(d.getDate() - offset);
    if (hasReal) { const sc = dayScore(rF || [], rH || {}, rS || {}); return { label: dayLabel(d), value: sc, color: sc >= 70 ? T.forest : sc >= 45 ? T.amber : T.alert }; }
    if (!demoCleared && DEMO_WEEK[offset]) return { label: dayLabel(d), value: DEMO_WEEK[offset].score, color: T.saffron, opacity: 0.5 };
    return { label: dayLabel(d), value: 2, color: T.creamDeep };
  });
  const anyDemo = weekBars.some(b => b.opacity);
  const { thisWeekKeys, lastWeekKeys } = weekWindowsForDate(selectedDate);
  const { thisMonthKey, lastMonthKey } = monthWindowsForDate(selectedDate);
  const thisWeek = avgScoreForKeys(thisWeekKeys, weekFood, weekHabits, weekSupplements);
  const lastWeek = avgScoreForKeys(lastWeekKeys, weekFood, weekHabits, weekSupplements);
  const thisMonth = monthScoreAvg(thisMonthKey, weekFood, weekHabits, weekSupplements);
  const lastMonth = monthScoreAvg(lastMonthKey, weekFood, weekHabits, weekSupplements);
  const weekActivity = activityInsight(thisWeekKeys, lastWeekKeys, activities);
  const weekFoodLines = foodInsight(thisWeekKeys, weekFood, targets);
  const weekSuppText = supplementInsight(thisWeekKeys, lastWeekKeys, weekSupplements, supplements.length);
  const monthKeysThis = Object.keys(weekFood).concat(Object.keys(weekHabits), Object.keys(weekSupplements)).filter(k => k.startsWith(thisMonthKey));
  const monthKeysLast = Object.keys(weekFood).concat(Object.keys(weekHabits), Object.keys(weekSupplements)).filter(k => k.startsWith(lastMonthKey));
  const monthActivity = activityInsight([...new Set(monthKeysThis)], [...new Set(monthKeysLast)], activities);
  const monthFoodLines = foodInsight([...new Set(monthKeysThis)], weekFood, targets);
  const monthSuppText = supplementInsight([...new Set(monthKeysThis)], [...new Set(monthKeysLast)], weekSupplements, supplements.length);
  const scoreFn = (k) => scoreValue(k, weekFood, weekHabits, weekSupplements, activities);
  const weekLineLabels = thisWeekKeys.map(dowShort);
  const weekLineThis = thisWeekKeys.map(scoreFn);
  const weekLineLast = lastWeekKeys.map(scoreFn);
  const monthSeriesThis = monthWeekSeries(thisMonthKey, scoreFn);
  const monthSeriesLast = monthWeekSeries(lastMonthKey, scoreFn);
  const monthLineLen = Math.max(monthSeriesThis.length, monthSeriesLast.length, 1);

    const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([d]) => d);
    const curated = ["besan laddoo", "sukhdi", "vada pav", "khichdi", "dal", "paneer sabzi", "chai", "idli", "dhokla", "poha"];

  async function checkDish(dish) {
    setResult(null); setWarning(null); setNotFound(null); setManualVerdict(null); setManualCals(""); setPasteText(""); setPastePreview(null); setCorrectedFrom(null); setQty(1); setDisambig(null);

      const canonId = (HEALTH_DB && HEALTH_DB.aliases) ? HEALTH_DB.aliases[normalizeWithAliases(hCore)] : null;

      if (canonId && HEALTH_DB.dishes[canonId]) options = [{ id: canonId, name: HEALTH_DB.dishes[canonId].name }, ...cands.filter(c => c.id !== canonId)].slice(0, 8);
      setDisambig({ query: raw, options }); return;
    }

    // 1. Curated FOOD_DB, exact or fuzzy (typo-tolerant), matched on the core dish name

    const foodKeys = Object.keys(FOOD_DB);

          <div style={{ height: 10 }} />
          <Card>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 14, marginBottom: 3 }}>Which {disambig.query}?</div>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 10 }}>A few varieties match — pick the closest so the numbers are right.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {disambig.options.map(o => (
                <button key={o.id} onClick={() => pickHealthDish(o.id)} style={{ textAlign: "left", background: T.creamDeep, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Inter", fontSize: 13.5, color: T.ink }}>{o.name}</button>
              ))}
            </div>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 8 }}>Not listed? Type a more specific name.</div>
          </Card>
        </>
      )}
      {lookingUp && <div style={{ display: "flex", alignItems: "center", gap: 8, padding: 14, fontFamily: "Inter", fontSize: 13, color: T.inkSoft }}><Icon name="loader" size={16} /> Looking it up (free nutrition database)…</div>}
      {notFound && (
        <>
          <div style={{ height: 10 }} />
          <Card>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, textTransform: "capitalize", marginBottom: 4 }}>{notFound}</div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 12 }}>Not found in the dish list, your saved dishes, or the free nutrition databases — check it in 10 seconds, then log it yourself:</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
              <a href={nutritionUrl(notFound)} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, textDecoration: "none" }}>Search calories & nutrition <Icon name="external" size={12} color={T.teal} /></a>
              <a href={healthUrl(notFound)} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, textDecoration: "none" }}>Search if it's safe for TG/GGT <Icon name="external" size={12} color={T.teal} /></a>
              <a href={recipeUrl(notFound)} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, color: T.saffronDeep, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, textDecoration: "none" }}>Search a healthier version <Icon name="external" size={12} color={T.saffronDeep} /></a>
            </div>

            <div style={{ background: T.tealPale, borderRadius: 10, padding: 12, marginBottom: 14 }}>
              <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12, color: T.teal, marginBottom: 6 }}>Got an answer from Google or Google AI? Paste it here:</div>
              <textarea value={pasteText} onChange={e => { setPasteText(e.target.value); setPastePreview(null); }} placeholder="Paste the nutrition text you found — calories, protein, sugar, carbs, fat…" rows={4}
                style={{ width: "100%", border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, fontFamily: "Inter", fontSize: 12.5, resize: "vertical" }} />
              {!pastePreview ? (
                <button onClick={parsePaste} disabled={!pasteText.trim()} style={{ marginTop: 8, background: pasteText.trim() ? T.saffron : T.creamDeep, border: "none", borderRadius: 8, padding: "8px 14px", color: pasteText.trim() ? T.white : T.inkSoft, fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5 }}>Parse numbers</button>
              ) : (
                <div style={{ marginTop: 8 }}>
                  <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 8 }}>
                    <MiniStat v={pastePreview.calories} l="cal" /><MiniStat v={pastePreview.protein} l="protein g" /><MiniStat v={pastePreview.fiber} l="fiber g" /><MiniStat v={pastePreview.carbs} l="carb g" /><MiniStat v={pastePreview.sugar} l="sugar g" />
                  </div>
                  {pastePreview.calories == null && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.alert, marginBottom: 8 }}>Couldn't find a calorie number in that text — check the paste, or fall back to the manual verdict below.</div>}
                  <button onClick={saveAndLogPasted} disabled={pastePreview.calories == null} style={{ width: "100%", background: pastePreview.calories != null ? T.teal : T.creamDeep, border: "none", borderRadius: 8, padding: "9px 0", color: pastePreview.calories != null ? T.white : T.inkSoft, fontFamily: "Manrope", fontWeight: 700, fontSize: 13 }}>Save & log this meal</button>
                  <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>Saved permanently — typing "{notFound}" again will use these numbers instantly, no need to search or paste twice.</div>
                </div>
              )}
            </div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 6 }}>Your verdict, based on what you found:</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
              {["safe", "moderate", "limit", "avoid"].map(v => (
                <button key={v} onClick={() => setManualVerdict(v)} style={{
                  background: manualVerdict === v ? meta(v).fg : T.creamDeep, color: manualVerdict === v ? T.white : T.ink,
                  border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12
                }}>{meta(v).emoji} {meta(v).label}</button>
              ))}
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 6 }}>Calories (optional)</div>
              <input value={manualCals} onChange={e => setManualCals(e.target.value.replace(/\D/g, ""))} placeholder="e.g. 200" inputMode="numeric" style={{ width: 120, border: `1px solid ${T.border}`, borderRadius: 10, padding: "8px 10px", fontFamily: "Inter", fontSize: 13.5 }} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 6 }}>When?</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{MEAL_SLOTS.map(s => <button key={s} onClick={() => setMealSlot(s)} style={{ background: mealSlot === s ? T.teal : T.creamDeep, color: mealSlot === s ? T.white : T.ink, border: "none", borderRadius: 999, padding: "5px 11px", fontFamily: "Inter", fontSize: 12 }}>{s}</button>)}</div>
            </div>
            <button onClick={logManual} disabled={!manualVerdict} style={{ width: "100%", background: manualVerdict ? T.teal : T.creamDeep, border: "none", borderRadius: 10, padding: "10px 0", color: manualVerdict ? T.white : T.inkSoft, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Log this meal</button>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 6 }}>Saved permanently — typing "{notFound}" again will use this verdict instantly.</div>
          </Card>
        </>
      )}
      {result && (
        <>
          <div style={{ height: 12 }} />
          <Card style={{ borderColor: meta(result.verdict).fg }}>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 15, textTransform: "capitalize", marginBottom: 4 }}>{result.dish} {result.lookedUp && <Badge bg={T.creamDeep} fg={T.inkSoft}>estimated{result.source ? ` · ${result.source}` : ""}</Badge>}</div>
            {correctedFrom && <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 8 }}>Matched "{query}" to "{correctedFrom}"</div>}
            {result.ingredients && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>Likely: {result.ingredients}</div>}
            {health && pv ? (
              <div style={{ marginBottom: 10 }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: T[VERDICT_TONE[pv.tone].bg], color: T[VERDICT_TONE[pv.tone].fg], padding: "8px 13px", borderRadius: 10, fontFamily: "Manrope", fontWeight: 800, fontSize: 13.5, marginBottom: 8 }}>{VERDICT_TONE[pv.tone].emoji} {pv.text}</div>
                {mod.applied.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", background: T.tealPale, borderRadius: 8, padding: "6px 10px", marginBottom: 8 }}>
                    <span style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12, color: T.teal }}>✓ ADJUSTED FOR</span>
                    {mod.applied.map((a, i) => <span key={i} style={{ fontFamily: "Inter", fontSize: 12, color: T.teal }}>{a}{i < mod.applied.length - 1 ? "," : ""}</span>)}
                    <span style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>— scores &amp; calories recalculated</span>
                  </div>
                )}
                {scored.worse_for.length > 0 && (
                  <div style={{ marginTop: 6 }}>
                    <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12, letterSpacing: 0.4, color: T.inkSoft, marginBottom: 4 }}>NOT GOOD FOR</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {scored.worse_for.map(([c, lvl, reason], i) => (
                        <span key={i} title={reason} style={{ background: "transparent", border: `1px solid ${lvl === "red" ? T.alert : T.amber}`, color: lvl === "red" ? T.alert : T.amber, padding: "4px 10px", borderRadius: 999, fontFamily: "Inter", fontSize: 12 }}>{HEALTH_DB.labels[c] || c}</span>
                      ))}
                    </div>
                  </div>
                )}
                {scored.good_source_for.length > 0 && (
                  <div style={{ marginTop: 8 }}>
                    <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12, letterSpacing: 0.4, color: T.inkSoft, marginBottom: 4 }}>GOOD SOURCE FOR</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {scored.good_source_for.map(([c, reason], i) => (
                        <span key={i} title={reason} style={{ background: T.forestPale, color: T.forest, padding: "4px 10px", borderRadius: 999, fontFamily: "Inter", fontSize: 12 }}>{HEALTH_DB.labels[c] || c}</span>
                      ))}
                    </div>
                  </div>
                )}
                {health.flags && health.flags.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                    {health.flags.map((fl, i) => (
                      <span key={i} title={fl.note} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: T.amberPale, color: T.amber, padding: "4px 10px", borderRadius: 999, fontFamily: "Inter", fontSize: 12.5 }}>⚠ {fl.flag === "gluten" ? "Contains gluten" : "Goitrogen (thyroid)"}</span>
                    ))}
                  </div>
                )}
                {health.estimated && <div style={{ fontFamily: "Inter", fontSize: 11, color: T.saffronDeep, marginTop: 6 }}>≈ Estimated nutrition (typical for this kind of dish) — not measured. Treat as a rough guide.</div>}
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 8 }}>Personalised to your report &amp; goals · tap a tag to see the numbers.</div>
              </div>
            ) : (
              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: meta(result.verdict).bg, color: meta(result.verdict).fg, padding: "6px 12px", borderRadius: 999, fontFamily: "Manrope", fontWeight: 800, fontSize: 13, marginBottom: 10 }}>{meta(result.verdict).emoji} {meta(result.verdict).label}</div>
            )}
            {!health && result.dynamicTags && result.dynamicTags.length > 0 && (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                {result.dynamicTags.map((t, i) => (
                  <Badge key={i} bg={t.verdict === "bad" ? T.alertPale : T.forestPale} fg={t.verdict === "bad" ? T.alert : T.forest}>{t.verdict === "bad" ? "🔴" : "🟢"} {t.verdict === "bad" ? "Watch for" : "Good for"} {t.label}</Badge>
                ))}
              </div>
            )}
            <div style={{ fontFamily: "Inter", fontSize: 13.5, color: T.ink, lineHeight: 1.5, marginBottom: 10 }}>{result.reason}</div>
            <div style={{ display: "flex", gap: 14, marginBottom: 12, flexWrap: "wrap" }}><MiniStat v={dm.cal} l="cal" /><MiniStat v={dm.protein} l="protein g" /><MiniStat v={dm.fiber} l="fiber g" /><MiniStat v={dm.sugar} l="sugar g" /></div>
            {result.weeklyLimit != null && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>You've had this {weeklyCountFor(result.dish)}x this week · cap: {result.weeklyLimit}/week</div>}
            {result.healthierTip && (
              <div style={{ background: T.tealPale, borderRadius: 10, padding: 10, marginBottom: 12 }}>
                <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 12.5, color: T.teal, marginBottom: 3 }}>💡 HEALTHIER TWIST</div>
                <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.ink, lineHeight: 1.4, marginBottom: 6 }}>{result.healthierTip}</div>
                <a href={recipeUrl(result.dish)} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 5, color: T.saffronDeep, fontFamily: "Manrope", fontWeight: 700, fontSize: 12, textDecoration: "none" }}>
                  Search a healthier recipe <Icon name="external" size={12} color={T.saffronDeep} />
                </a>
              </div>
            )}
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 6 }}>How much did you eat? {health ? "(1 = 100 g)" : "(servings)"}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <button onClick={() => setQty(q => Math.max(1, q - 1))} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${T.border}`, background: T.creamDeep, color: T.ink, fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>−</button>
                <div style={{ minWidth: 34, textAlign: "center", fontFamily: "Manrope", fontWeight: 800, fontSize: 16 }}>{qty}</div>
                <button onClick={() => setQty(q => q + 1)} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${T.border}`, background: T.creamDeep, color: T.ink, fontFamily: "Manrope", fontWeight: 800, fontSize: 18 }}>+</button>
                <div style={{ display: "flex", gap: 6, marginLeft: 6 }}>{[1, 2, 3].map(x => <button key={x} onClick={() => setQty(x)} style={{ background: qty === x ? T.teal : T.creamDeep, color: qty === x ? T.white : T.ink, border: "none", borderRadius: 999, padding: "6px 12px", fontFamily: "Inter", fontSize: 12 }}>×{x}</button>)}</div>
              </div>
              {dm.cal != null && <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginTop: 7 }}>Will log <b>{Math.round(dm.cal * qty)} cal</b>{dm.sugar != null ? ` · ${Math.round(dm.sugar * qty)}g sugar` : ""}{health ? ` · ${qty * 100}g total` : ` · ${qty} serving${qty > 1 ? "s" : ""}`}</div>}
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 6 }}>When?</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{MEAL_SLOTS.map(s => <button key={s} onClick={() => setMealSlot(s)} style={{ background: mealSlot === s ? T.teal : T.creamDeep, color: mealSlot === s ? T.white : T.ink, border: "none", borderRadius: 999, padding: "5px 11px", fontFamily: "Inter", fontSize: 12 }}>{s}</button>)}</div>
            </div>
            <button onClick={logMeal} style={{ width: "100%", background: T.tealSolid, border: "none", borderRadius: 10, padding: "10px 0", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 13.5 }}>Log this meal</button>
          </Card>
        </>
      )}
      {warning && (
        <>
          <div style={{ height: 10 }} />
          <Card style={{ background: T.amberPale, border: "none" }}>
            <div style={{ fontFamily: "Inter", fontSize: 13, color: T.ink, lineHeight: 1.45, marginBottom: 8 }}>{warning}</div>
            <button onClick={() => { setWarning(null); setResult(null); setQuery(""); }} style={{ background: T.tealSolid, border: "none", borderRadius: 8, padding: "7px 12px", color: T.white, fontFamily: "Manrope", fontWeight: 700, fontSize: 12 }}>Got it</button>
          </Card>
        </>
      )}
      <div style={{ height: 18 }} />
      <SectionLabel>What {selectedDate === todayKey() ? "I ate today" : `was eaten — ${formatDateLabel(selectedDate)}`}</SectionLabel>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
          <div><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20 }}>{totalCals}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>calories</div></div>
          <div style={{ textAlign: "right" }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20, color: badCount > 1 ? T.alert : T.forest }}>{badCount}</div><div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>flagged items</div></div>
        </div>
        <div style={{ height: 8, borderRadius: 999, background: T.creamDeep, overflow: "hidden", display: "flex", marginBottom: 10 }}>{foodForDate.length === 0 ? <div style={{ flex: 1 }} /> : foodForDate.map((f, i) => <div key={i} style={{ flex: 1, background: meta(f.verdict).fg }} />)}</div>
        {foodForDate.length === 0 ? (
          <div>
            <div style={{ fontFamily: "Inter", fontSize: 13, color: T.inkSoft, marginBottom: yesterdayMeals.length ? 10 : 0 }}>Nothing logged for this date.</div>
            {yesterdayMeals.length > 0 && <button onClick={copyYesterday} style={{ width: "100%", background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 10, padding: "9px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>📋 Copy yesterday's {yesterdayMeals.length} meal{yesterdayMeals.length > 1 ? "s" : ""}</button>}
          </div>
        ) : (
          <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 4 }}>
            {MEAL_SLOTS.filter(slot => foodForDate.some(f => (f.mealSlot || "Snack") === slot)).map(slot => (
              <div key={slot} style={{ flex: "0 0 auto", width: 168, background: T.creamDeep, borderRadius: 12, padding: 10 }}>
                <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 11.5, letterSpacing: 0.3, color: T.teal, marginBottom: 8, textTransform: "uppercase" }}>{slot}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {foodForDate.map((f, i) => ({ f, i })).filter(({ f }) => (f.mealSlot || "Snack") === slot).map(({ f, i }) => {
                    const canSplit = String(f.dish || "").split(/\s*[+,&]\s*|\s+and\s+/i).map(s => s.trim()).filter(Boolean).length >= 2;
                    return (
                    <div key={i} style={{ background: T.white, border: `1px solid ${T.border}`, borderRadius: 10, padding: "8px 9px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                        <div style={{ fontFamily: "Inter", fontSize: 12.5, textTransform: "capitalize", lineHeight: 1.3 }}>{f.dish}</div>
                        <DeleteBtn onClick={() => deleteFoodEntry(selectedDate, i)} />
                      </div>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, marginTop: 6 }}>
                        <span style={{ fontFamily: "Inter", fontSize: 11.5, color: meta(f.verdict).fg, fontWeight: 700 }}>{meta(f.verdict).emoji} {f.calories ?? "—"} cal</span>
                        <select value={f.mealSlot || "Snack"} onChange={e => updateFoodEntry(selectedDate, i, { mealSlot: e.target.value })} title="Move to another meal" style={{ fontFamily: "Inter", fontSize: 11, color: T.inkSoft, background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6, padding: "1px 2px", cursor: "pointer", maxWidth: 74 }}>{MEAL_SLOTS.map(s => <option key={s} value={s} style={{ color: "#111" }}>{s}</option>)}</select>
                      </div>
                      {canSplit && <button onClick={() => splitFoodEntry(selectedDate, i)} title="Split into separate items so you can move each to a different meal" style={{ marginTop: 6, width: "100%", background: T.tealPale, border: `1px solid ${T.teal}`, borderRadius: 6, padding: "3px 0", color: T.teal, fontFamily: "Manrope", fontWeight: 700, fontSize: 10.5, cursor: "pointer" }}>⤲ Split items</button>}
                    </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
      {(curW || prevW) && (
        <>
          <div style={{ height: 18 }} />
          <SectionLabel>Eating trends — week & month</SectionLabel>
          <Card>
            <div style={{ display: "flex", gap: 10, marginBottom: 6 }}>
              <MetricDelta label="Cal/day" cur={curW ? curW.calories : null} prev={prevW ? prevW.calories : null} />
              <MetricDelta label="Protein/day" cur={curW ? curW.protein : null} prev={prevW ? prevW.protein : null} unit="g" />
              <MetricDelta label="Sugar/day" cur={curW ? curW.sugar : null} prev={prevW ? prevW.sugar : null} unit="g" goodWhenLower />
            </div>
            {(weekCalThis.some(v => v != null) || weekCalLast.some(v => v != null)) && (
              <div style={{ marginTop: 8, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Calories per day — this week vs last week</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={foodWeekLabels} a={weekCalThis} b={weekCalLast} aLabel="This week" bLabel="Last week" height={170} />
                </div>
              </div>
            )}
            {(weekSugThis.some(v => v != null) || weekSugLast.some(v => v != null)) && (
              <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Sugar per day (g) — this week vs last week</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={foodWeekLabels} a={weekSugThis} b={weekSugLast} aLabel="This week" bLabel="Last week" aColor={T.alert} bColor={T.inkSoft} unit="g" height={150} />
                </div>
              </div>
            )}
            {(monCalThis.some(v => v != null) || monCalLast.some(v => v != null)) && (
              <div style={{ marginTop: 14, width: "100%", overflowX: "auto" }}>
                <div style={{ fontFamily: "Inter", fontSize: 12, color: T.inkSoft, marginBottom: 4 }}>Weekly average calories — {monthLabel(thisMonthKey)} vs {monthLabel(lastMonthKey)}</div>
                <div style={{ minWidth: 480 }}>
                  <TwoLineChart labels={foodMonLabels} a={foodMonPad(monCalThis)} b={foodMonPad(monCalLast)} aLabel={monthLabel(thisMonthKey)} bLabel={monthLabel(lastMonthKey)} height={170} />
                </div>
              </div>
            )}
          </Card>
        </>
      )}
      <div style={{ height: 90 }} />
      {calendarOpen && <CalendarPicker selectedDate={selectedDate} onSelect={setSelectedDate} onClose={() => setCalendarOpen(false)} weekFood={weekFood} activities={activities} weekSupplements={weekSupplements} />}
    </div>
  );
}

/* ============================== TAB 3: MY HEALTH ============================== */
function MyHealthTab({ metrics, periods, supplementsToday, toggleSupplement, supplements, onAddReport, advice, selectedDate, setSelectedDate, weekFood, weekHabits, weekSupplements, activities, targets, demoCleared, clearDemo }) {
  const priorities = computeTopPriorities(metrics, periods);
  const [calendarOpen, setCalendarOpen] = useState(false);
  return (
    <div className="tabPane">
      <DateBar selectedDate={selectedDate} onOpenCalendar={() => setCalendarOpen(true)} onBackToToday={() => setSelectedDate(todayKey())} />
      <SectionLabel>Score trends</SectionLabel>
      <TrendsSection selectedDate={selectedDate} weekFood={weekFood} weekHabits={weekHabits} weekSupplements={weekSupplements} activities={activities} supplements={supplements} targets={targets} demoCleared={demoCleared} clearDemo={clearDemo} />
      <div style={{ height: 18 }} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <SectionLabel>Top priorities right now</SectionLabel>
        <button onClick={onAddReport} style={{ background: T.tealPale, border: "none", borderRadius: 8, padding: "5px 10px", fontFamily: "Manrope", fontWeight: 700, fontSize: 12, color: T.teal, marginBottom: 8 }}>+ New report</button>

              <div style={{ textAlign: "right" }}><div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 20, color: p.status === "bad" ? T.alert : T.amber }}>{p.value}</div><Icon name="trendDown" size={16} color={p.status === "bad" ? T.alert : T.amber} /></div>
